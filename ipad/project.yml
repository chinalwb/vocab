# The iPad app (用户 2026-11-02): a native SwiftUI port of the web page, for taobao's notes.
# Generate the Xcode project with `xcodegen` in this directory (VoCab.xcodeproj is gitignored).
name: VoCab
options:
  bundleIdPrefix: io.github.chinalwb
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  VoCab:
    type: application
    platform: iOS
    sources:
      - path: VoCab
      # the bundled snapshot, so a new install works offline; refreshed from Pages at launch
      - path: ../users/taobao/data.json
        buildPhase: resources
        optional: true
      - path: ../users/taobao/avatar.jpg
        buildPhase: resources
    preBuildScripts:
      - name: Build taobao's data.json
        script: cd "$SRCROOT/.." && python3 build.py --src users/taobao
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.chinalwb.vocab.ipad
        PRODUCT_NAME: VoCab
        TARGETED_DEVICE_FAMILY: "2"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: VoCab
        # drawn by tools/make_icon.py
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
