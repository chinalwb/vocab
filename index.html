m></p><p>❌ <strong>synonym(s)/antonym(s) to X</strong> —— 这个搭配不地道,英语里不这么说。</p><p><strong>容易混的点:</strong> 如果用的是形容词 <strong>synonymous</strong>(而不是名词 synonym),搭配的介词是 <strong>with</strong>,不是 for/of:</p><p>&gt; <em>&quot;Huge&quot; is synonymous with &quot;immense&quot;.</em></p><p>&gt; &quot;巨大&quot;和&quot;immense&quot;是同义词。(这里 synonymous with 是固定搭配)</p><p><strong>一句话总结:</strong> 名词 synonym/antonym 后面接 <strong>for</strong> 或 <strong>of</strong>;形容词 synonymous 后面接 <strong>with</strong>——三者都不用 to。</p>", "level": "TERM"}, {"anchor": "moment-phrases", "title": "其他带 moment/moments 的短语", "ipa": "", "pos": "", "cefr": "", "gloss": "in a moment —— 马上、一会儿(很快,通常指几秒到几分钟内)", "html": "<p><strong>in a moment</strong> —— 马上、一会儿(很快,通常指几秒到几分钟内)</p><ol class=\"ex\"><li><span class=\"en\">I&#x27;ll be with you in a moment.</span><span class=\"zh\">我马上就来。</span></li></ol><p><strong>the moment (that)...</strong> —— 一……就……(表示&quot;就在……发生的那一刻&quot;)</p><ol class=\"ex\"><li><span class=\"en\">Call me the moment you land.</span><span class=\"zh\">你一落地就给我打电话。</span></li></ol><p><strong>for a moment</strong> —— (持续)片刻、一会儿</p><ol class=\"ex\"><li><span class=\"en\">She paused for a moment before answering.</span><span class=\"zh\">她停顿了一下才回答。</span></li></ol><p><strong>any moment (now)</strong> —— 随时、马上就要(强调即将发生)</p><ol class=\"ex\"><li><span class=\"en\">The train should arrive any moment now.</span><span class=\"zh\">火车应该随时会到。</span></li></ol><p><strong>moments ago</strong> —— 刚刚、片刻之前</p><ol class=\"ex\"><li><span class=\"en\">He left the office moments ago.</span><span class=\"zh\">他刚刚离开办公室。</span></li></ol><p><strong>moment of truth</strong>(习语)—— 关键时刻、见分晓的时刻</p><ol class=\"ex\"><li><span class=\"en\">This is the moment of truth — let&#x27;s see if the plan works.</span><span class=\"zh\">关键时刻到了——看看这个计划到底行不行。</span></li></ol><p><strong>on the spur of the moment</strong>(习语)—— 一时冲动、临时起意</p><ol class=\"ex\"><li><span class=\"en\">We decided to go on the trip on the spur of the moment.</span><span class=\"zh\">我们是临时起意决定去旅行的。</span></li></ol><p><strong>live in the moment</strong>(习语)—— 活在当下</p><ol class=\"ex\"><li><span class=\"en\">Stop worrying about the future — just live in the moment.</span><span class=\"zh\">别老担心未来了——活在当下就好。</span></li></ol><p><strong>never a dull moment</strong>(习语)—— 永远不无聊、总有精彩事发生</p><ol class=\"ex\"><li><span class=\"en\">Working here, there&#x27;s never a dull moment.</span><span class=\"zh\">在这儿工作,永远不会无聊。</span></li></ol>", "level": "TERM"}, {"anchor": "concentrate-on", "title": "concentrate on / focus on 及其近义表达", "ipa": "/ˈkɑːnsəntreɪt/", "pos": "", "cefr": "", "gloss": "表达\"抛开一切、专心投入到某件事/某个技术点上\"的一组说法。", "html": "<p>表达&quot;抛开一切、专心投入到某件事/某个技术点上&quot;的一组说法。</p><p><strong>concentrate on</strong> —— 最基础、最百搭的&quot;专注于&quot;,中性</p><ol class=\"ex\"><li><span class=\"en\">He decided to concentrate on optimizing the database queries.</span><span class=\"zh\">他决定专注于优化数据库查询。</span></li></ol><p><strong>focus on</strong> —— 和 concentrate on 几乎可以互换,口语书面都常用</p><ol class=\"ex\"><li><span class=\"en\">Let&#x27;s focus on this one technical issue for now.</span><span class=\"zh\">我们现在先专注解决这一个技术问题。</span></li></ol><p><strong>devote oneself to (sth)</strong> —— 更强调&quot;全身心投入、奉献&quot;,语气更重、更正式</p><ol class=\"ex\"><li><span class=\"en\">She dropped all her other projects to devote herself entirely to this optimization problem.</span><span class=\"zh\">她放下了所有其他项目,全身心投入到这个优化问题上。</span></li></ol><p><strong>throw oneself into (sth)</strong> —— 强调&quot;一头扎进去&quot;,带有热情、主动投入的画面感</p><ol class=\"ex\"><li><span class=\"en\">He threw himself into debugging the memory leak, ignoring everything else.</span><span class=\"zh\">他一头扎进去调试这个内存泄漏问题,不理会其他一切事情。</span></li></ol><p><strong>immerse oneself in (sth)</strong> —— 强调&quot;沉浸式投入&quot;,几乎与外界隔绝的专注状态</p><ol class=\"ex\"><li><span class=\"en\">She immersed herself in the codebase for weeks to fully understand the architecture.</span><span class=\"zh\">她一连几周沉浸在这套代码库里,彻底搞懂了整个架构。</span></li></ol><p><strong>zero in on (sth)</strong> —— 强调&quot;精准锁定到一个具体点上&quot;,很适合&quot;某个技术点&quot;这种场景</p><ol class=\"ex\"><li><span class=\"en\">The team decided to zero in on this one performance bottleneck instead of spreading themselves thin.</span><span class=\"zh\">团队决定集中精力锁定这一个性能瓶颈,而不是分散精力面面俱到。</span></li></ol><p><strong>drop everything and focus on (sth)</strong> —— 直接对应&quot;抛开一切其他工作&quot;,画面感最强</p><ol class=\"ex\"><li><span class=\"en\">He dropped everything and focused on fixing the production outage.</span><span class=\"zh\">他放下了手头一切工作,专心去修复这次线上故障。</span></li></ol><p><strong>一句话总结:</strong> 想强调&quot;精准锁定到一个具体技术点&quot;,<strong>zero in on</strong> 最贴切;想强调&quot;放下一切、全情投入&quot;,<strong>devote oneself to / throw oneself into / drop everything and focus on</strong> 都很合适;concentrate on / focus on 则是最中性、最百搭的默认选择。</p>", "level": "TERM"}, {"anchor": "try-to-do-vs-try-doing", "title": "try to do vs. try doing", "ipa": "", "pos": "", "cefr": "", "gloss": "义项一:try to do sth. —— 尝试去做某事(强调动作/目标能否达成,动作本身可能没能完成)", "html": "<p><strong>义项一:try to do sth. —— 尝试去做某事(强调动作/目标能否达成,动作本身可能没能完成)</strong></p><ol class=\"ex\"><li><span class=\"en\">I tried to install the app, but the installer kept crashing.</span><span class=\"zh\">我试图安装这个 App,但安装程序一直崩溃。</span></li><li><span class=\"en\">I tried to fix the bug, but I couldn&#x27;t figure out what was wrong.</span><span class=\"zh\">我试图去修复这个 bug,但没搞清楚问题出在哪。</span></li></ol><p><strong>义项二:try doing sth. —— 试着做一下某事看看效果(动作本身已经完成,&quot;尝试&quot;的是这个手段带来的结果)</strong></p><ol class=\"ex\"><li><span class=\"en\">I tried reinstalling the app, and it worked fine.</span><span class=\"zh\">我试着重装了一下这个 App,结果运行正常了。</span></li><li><span class=\"en\">I tried restarting the router, and the internet came back.</span><span class=\"zh\">我试着重启了路由器,网络就恢复了。</span></li></ol><p><strong>辨析:</strong> try to do 关注&quot;这件事能不能做成&quot;,动作本身可能中途受阻、没能完成;try doing 预设动作本身已经顺利做完,句子关心的是&quot;做完之后效果如何&quot;。判断技巧:句子后半段如果是在陈述某个方法带来的结果,多半用 try doing;如果是在描述动作本身遇到阻碍,则用 try to do。</p>", "level": "TERM"}, {"anchor": "percentage-completed", "title": "What percentage of X has been completed (so far)?", "ipa": "", "pos": "", "cefr": "", "gloss": "用法: 询问/汇报某项工作进度的完成百分比,工作场景里常用的模板句。", "html": "<p><strong>用法:</strong> 询问/汇报某项工作进度的完成百分比,工作场景里常用的模板句。</p><ol class=\"ex\"><li><span class=\"en\">What percentage of the work has been completed so far?</span><span class=\"zh\">现在工作完成的百分比是多少?</span></li><li><span class=\"en\">The project is about 70% complete so far.</span><span class=\"zh\">这个项目目前大概完成了 70%。</span></li></ol>", "level": "TERM"}]}, {"level": "GRAMMAR", "items": [{"anchor": "dangling-modifier", "title": "语法笔记:悬垂修饰语(dangling modifier)", "ipa": "", "pos": "", "cefr": "", "gloss": "问题描述: \"if / when + 动名词(-ing)\" 这种缩略状语结构,省略主语时,隐含的主语必须能从主句里清楚地推断出来。如果推不出来(比如主句主语是个物,而 -ing 动作的执行者其实是\"人\"),就会造成逻辑不清、悬垂修饰语的问题。", "html": "<p><strong>问题描述:</strong> &quot;if / when + 动名词(-ing)&quot; 这种缩略状语结构,省略主语时,隐含的主语必须能从主句里清楚地推断出来。如果推不出来(比如主句主语是个物,而 -ing 动作的执行者其实是&quot;人&quot;),就会造成逻辑不清、悬垂修饰语的问题。</p><p><strong>易错点笔记(来自真实错误案例):</strong></p><ul><li>❌ <em>What is the model name of Gemini 3.5 Flash Lite if using it in python code?</em></li><li>✅ <em>What is the model name for Gemini 3.5 Flash Lite when used in Python code?</em></li><li>✅ <em>What is the model name of Gemini 3.5 Flash Lite if you use it in Python code?</em></li></ul><p>错误点拆解:</p><ol class=\"ex\"><li><span class=\"en\"><strong>if using it</strong> —— 悬垂修饰语,没有明确主语(是谁在 using?)。改法:补上主语(if you use it),或换成被动的 when used(不需要额外主语)。</span></li><li><span class=\"en\"><strong>python</strong> → 应大写为 <strong>Python</strong>——编程语言名称是专有名词。</span></li><li><span class=\"en\"><strong>model name of X</strong> 语法没错,但技术语境里 <strong>model name for X</strong> 更地道。</span></li></ol>", "level": "GRAMMAR"}, {"anchor": "wh-question-order", "title": "语法笔记:why 疑问句 vs how come vs 间接疑问句", "ipa": "", "pos": "", "cefr": "", "gloss": "疑问词提问是否需要 do-support(do/does/did)+ 倒装,要分三种情况看。", "html": "<p><strong>规则总览:</strong> 疑问词提问是否需要 do-support(do/does/did)+ 倒装,要分三种情况看。</p><p><strong>① 直接疑问句(why/what/how 等)—— 需要 do-support + 倒装</strong></p><ul><li>❌ <em>Why it uses the word &quot;would&quot;?</em></li><li>✅ <em>Why does it use the word &quot;would&quot;?</em></li></ul><p>说明:主语第三人称单数用 does,主动词还原成原形(use,不是 uses)。</p><p><strong>② how come 疑问句 —— 特例,不需要倒装,保持陈述句语序</strong></p><ul><li>✅ <em>How come it uses the word &quot;would&quot;?</em></li><li>❌ <em>How come does it use the word &quot;would&quot;?</em>(错,how come 后面不能再加 does)</li></ul><p>说明:how come 意思等同于 why,但语气更口语化、略带疑惑/惊讶,且语法上不倒装,动词保持正常变位(uses)。</p><p><strong>③ 间接疑问句 / 嵌入疑问句(嵌在 tell me / I wonder / do you know 等后面)—— 回到陈述句语序,不倒装</strong></p><ul><li>✅ <em>He didn&#x27;t tell me why that sentence uses the word &quot;would&quot;.</em></li><li>❌ <em>He didn&#x27;t tell me why does that sentence use the word &quot;would&quot;.</em>(错,间接疑问句里不能再加 does)</li></ul><p><strong>一句话记忆:</strong> 独立提问用倒装(why does...);how come 天生不倒装;疑问句被&quot;包&quot;进另一句话里(间接疑问句)时,也变回陈述句语序(why it uses...)。</p>", "level": "GRAMMAR"}, {"anchor": "thing-as-subject", "title": "语法笔记:物做主语 vs 人做主语", "ipa": "", "pos": "", "cefr": "", "gloss": "核心观察: 中文习惯以人作主语(\"我经常看到……\"、\"我注意到……\"),英语在很多场合更偏好以物(事物/现象)作主语,让\"人\"退到宾语位置。常见动词:catch, strike, bother, remind, puzzle, surprise, occur to 等。", "html": "<p><strong>核心观察:</strong> 中文习惯<strong>以人作主语</strong>(&quot;我经常看到……&quot;、&quot;我注意到……&quot;),英语在很多场合更偏好<strong>以物(事物/现象)作主语</strong>,让&quot;人&quot;退到宾语位置。常见动词:<strong>catch, strike, bother, remind, puzzle, surprise, occur to</strong> 等。</p><p><strong>例句:</strong></p><ol class=\"ex\"><li><span class=\"en\">This idea just occurred to me.</span><span class=\"zh\">我突然想到这个主意。(而不是 &quot;I suddenly thought of this idea&quot;)</span></li><li><span class=\"en\">That comment really bothered me.</span><span class=\"zh\">那句话真的让我很在意。</span></li><li><span class=\"en\">These phrases keep catching my eye.</span><span class=\"zh\">这些短语总是引起我的注意/映入眼帘。</span></li></ol><p><strong>关键限制:不是所有&quot;物做主语&quot;的动词都能接人作宾语</strong>——动词必须<strong>本身就是及物的、天生能接人作宾语</strong>(catch one&#x27;s eye、strike sb、bother sb、remind sb),才能这样用。像 <strong>show up</strong> 这种天生不及物的动词,硬接 &quot;to me / for me&quot; 会显得别扭(参考 [[show up]] 相关笔记)。</p><p><strong>替代方案(表达&quot;我经常看到/碰到这些短语&quot;):</strong></p><ol class=\"ex\"><li><span class=\"en\">These phrases keep catching my eye.</span><span class=\"zh\">这些短语总是引起我的注意。</span></li><li><span class=\"en\">These phrases keep coming up (in what I read).</span><span class=\"zh\">这些短语在我读到的东西里反复出现。</span></li><li><span class=\"en\">These words keep popping up.</span><span class=\"zh\">这些词一直冒出来。</span></li></ol><p><strong>补充一点:</strong> 后两句<strong>没有显式出现 &quot;me&quot;</strong>——英语里很多时候&quot;是谁在经历这件事&quot;由上下文/说话人身份自然带出,不需要每次都把 &quot;to me / for me&quot; 明确挂在句子上,硬要加反而不自然。</p>", "level": "GRAMMAR"}, {"anchor": "better-way-to-say", "title": "语法笔记:\"What is a better one for this?\" 不够自然", "ipa": "", "pos": "", "cefr": "", "gloss": "问题: \"a better one\" 里的 one 指代不清——想代替\"句子/说法\",但单独看容易让人愣一下\"better one 指的是哪个 one\"。", "html": "<p><strong>问题:</strong> &quot;a better one&quot; 里的 <strong>one</strong> 指代不清——想代替&quot;句子/说法&quot;,但单独看容易让人愣一下&quot;better one 指的是哪个 one&quot;。</p><p><strong>更地道的问法:</strong></p><ol class=\"ex\"><li><span class=\"en\">What&#x27;s a better way to say this?</span><span class=\"zh\">这句话有没有更好的说法?(最百搭、最常用)</span></li><li><span class=\"en\">How would you phrase this more naturally?</span><span class=\"zh\">这句话你会怎么说会更自然?</span></li><li><span class=\"en\">Is there a more natural way to put this?</span><span class=\"zh\">有没有更地道的表达方式?</span></li></ol>", "level": "GRAMMAR"}, {"anchor": "title-zero-article", "title": "语法笔记:\"tutor to Prince Charles\" 为何省略冠词", "ipa": "", "pos": "", "cefr": "", "gloss": "当某个身份被表达为\"专属于某个人/机构的职位、头衔\"时,尤其是 [职位] to [某人/机构] 这种结构,英语常常省略冠词,让这个名词读起来更像一个\"头衔\",而不是一个普通的、可数的职业名称。", "html": "<p><strong>规则说明:</strong> 当某个身份被表达为&quot;专属于某个人/机构的职位、头衔&quot;时,尤其是 <strong>[职位] to [某人/机构]</strong> 这种结构,英语常常<strong>省略冠词</strong>,让这个名词读起来更像一个&quot;头衔&quot;,而不是一个普通的、可数的职业名称。</p><p><strong>原句:</strong></p><p>&gt; And we should meet Thomas Hobbes, an English philosopher who was tutor to Prince Charles, later King Charles II.</p><p>这里的 <strong>tutor</strong> 不是在说&quot;他是众多家庭教师中的一个&quot;,而是把这个身份当作一个具体的、专属的官方职位来陈述,所以不加冠词。</p><p><strong>同类结构:</strong></p><ol class=\"ex\"><li><span class=\"en\">She was governess to the royal children.</span><span class=\"zh\">她是那些王室孩子的家庭女教师。</span></li><li><span class=\"en\">He served as secretary to the committee.</span><span class=\"zh\">他担任委员会的秘书。</span></li><li><span class=\"en\">He was appointed ambassador to France.</span><span class=\"zh\">他被任命为驻法大使。</span></li><li><span class=\"en\">He was elected president of the club.</span><span class=\"zh\">他被选为俱乐部主席。</span></li></ol><p><strong>对比:</strong></p><ul><li><em>He was a tutor.</em>(泛泛而谈,他的职业是家庭教师,众多教师中的一个)</li><li><em>He was tutor to Prince Charles.</em>(强调这是一个专属于查尔斯王子的职位,更像&quot;头衔&quot;)</li></ul><p><strong>一句话总结:</strong> [职位] to [人/机构] 这种结构,把身份当&quot;头衔&quot;陈述时,常省略冠词。</p>", "level": "GRAMMAR"}, {"anchor": "lets-not", "title": "语法笔记:let's not vs don't 的否定规则", "ipa": "", "pos": "", "cefr": "", "gloss": "\"let us / let's + 动词原形\" 是表示\"提议、号召大家一起做某事\"的固定句型(第一人称复数祈使句,包含说话人自己在内)。否定时,把 not 直接放在动词原形前面,而不是用 don't。", "html": "<p><strong>规则说明:</strong> &quot;let us / let&#x27;s + 动词原形&quot; 是表示&quot;提议、号召大家一起做某事&quot;的固定句型(第一人称复数祈使句,包含说话人自己在内)。否定时,把 <strong>not</strong> 直接放在动词原形前面,而不是用 don&#x27;t。</p><p><strong>原句:</strong></p><p>&gt; And let us not forget the thirteenth-century Catalan writer, poet, theologian, mystic and mathematician Ramon Llull.</p><p>&gt; <strong>Let us not forget...</strong> = <strong>Let&#x27;s not forget...</strong></p><p>&gt; 让我们不要忘记……</p><p>这跟英语里&quot;否定不定式/原形动词&quot;的一般规律一致:</p><ol class=\"ex\"><li><span class=\"en\">I told him not to go.</span><span class=\"zh\">我告诉他别去。(不是 &quot;I told him don&#x27;t go&quot;)</span></li><li><span class=\"en\">She asked me not to worry.</span><span class=\"zh\">她让我别担心。(不是 &quot;She asked me don&#x27;t worry&quot;)</span></li></ol><p><strong>为什么不用 don&#x27;t:</strong></p><ul><li>❌ <em>Let&#x27;s don&#x27;t forget...</em>(美式口语/南方方言偶尔能听到,但属于非正式、地域性说法,不是标准英语)</li><li>✅ <em>Let&#x27;s not forget...</em> / <em>Let us not forget...</em>(标准、正式、书面语都通用)</li></ul><p><strong>let us not forget vs don&#x27;t forget —— 语气/对象不同:</strong></p><ul><li><strong>Don&#x27;t forget your keys!</strong> —— 直接对&quot;你&quot;下命令/提醒,只涉及听话人。</li><li><strong>Let us not forget Ramon Llull.</strong> —— &quot;让我们&quot;一起不要忘记,包含说话人自己在内,语气更正式、更有号召性、集体性,常见于演讲、历史叙述、书面文体。</li></ul><p><strong>一句话总结:</strong> let&#x27;s/let us 是&quot;提议&quot;句型,否定时把 not 直接放在动词前(let&#x27;s not do sth),不用 don&#x27;t;且 let&#x27;s not 比 don&#x27;t 更强调&quot;我们一起&quot;的集体语气,常用于正式/书面场合。</p>", "level": "GRAMMAR"}, {"anchor": "end-weight", "title": "语法笔记:What will X be? vs What will be X?(末端重量原则)", "ipa": "", "pos": "", "cefr": "", "gloss": "\"What will ... be?\" 这种问句里,will 和 be 是连在一起还是被主语隔开,取决于主语的\"轻重\"(长短/复杂程度)——这就是英语里的 \"末端重量原则\"(end-weight principle):轻的成分放前面,重的/长的成分放后面,句子更容易理解。", "html": "<p><strong>规则总览:</strong> &quot;What will ... be?&quot; 这种问句里,will 和 be 是连在一起还是被主语隔开,取决于<strong>主语的&quot;轻重&quot;(长短/复杂程度)</strong>——这就是英语里的 <strong>&quot;末端重量原则&quot;(end-weight principle)</strong>:轻的成分放前面,重的/长的成分放后面,句子更容易理解。</p><p><strong>① What will + 主语 + be?(will 和 be 分开,主语插在中间)—— 主语短小、简单时用这种</strong></p><ol class=\"ex\"><li><span class=\"en\">What will the weather be like tomorrow?</span><span class=\"zh\">明天天气会怎么样?(主语 the weather 很短)</span></li><li><span class=\"en\">What will the price be?</span><span class=\"zh\">价格会是多少?</span></li><li><span class=\"en\">What will the answer be?</span><span class=\"zh\">答案会是什么?</span></li></ol><p><strong>② What will be + 主语?(will be 连在一起,长主语放到句尾)—— 主语又长又复杂时用这种,读起来更顺</strong></p><ol class=\"ex\"><li><span class=\"en\">What will be the size of this dynamically downloaded model?</span><span class=\"zh\">这个动态下载的模型的大小会是多少?(主语 &quot;the size of this dynamically downloaded model&quot; 很长)</span></li><li><span class=\"en\">What will be the impact of this new regulation on small businesses across the country?</span><span class=\"zh\">这项新法规会对全国的小企业造成什么样的影响?(主语极长)</span></li><li><span class=\"en\">What will be the consequences of ignoring this warning?</span><span class=\"zh\">忽视这个警告会造成什么后果?</span></li></ol><p><strong>一句话总结:</strong> 主语短 → will [主语] be;主语长/复杂 → will be [主语],把&quot;重&quot;的部分挪到句尾,句子更顺。如果硬把长主语塞进 will 和 be 中间(比如 &quot;What will the size of this dynamically downloaded model be?&quot;),虽然语法上也说得通,但读起来会更绕、更费劲。</p>", "level": "GRAMMAR"}, {"anchor": "comma-splice-shared-code", "title": "语法笔记:逗号粘连(comma splice)+ shared code 连字符误用", "ipa": "", "pos": "", "cefr": "", "gloss": "原句(有语病):", "html": "<p><strong>原句(有语病):</strong></p><p>&gt; The user was using an iPhone, though the feature was built on shared-code, please help check it out.</p><p><strong>问题一:逗号粘连(comma splice / run-on sentence)</strong></p><p>&quot;The user was using an iPhone&quot;(陈述句)+ &quot;though the feature was built on shared code&quot;(从句)+ &quot;please help check it out&quot;(祈使句)三段只靠逗号硬连在一起。祈使句不能直接用逗号接在前面的陈述/从句后面,需要用句号断开,或改写成疑问句形式的礼貌请求。</p><p><strong>问题二:shared-code 不该加连字符</strong></p><p>这里 &quot;shared code&quot;(共享代码)是介词 on 后面的<strong>名词短语</strong>,shared 只是普通形容词修饰 code,不是放在另一个名词前面的复合形容词,所以不需要连字符。只有当它整体作为形容词去修饰后面的名词时才加连字符,比如 &quot;a shared-code feature&quot;。</p><p><strong>改正后:</strong></p><p>&gt; The user was using an iPhone, even though the feature was built on shared code. Could you help check it out?</p><p>&gt; 这个用户用的是 iPhone,不过这个功能是基于共享代码构建的——能麻烦帮忙查一下吗?</p><p>这里把 though 换成语气更明确的 even though,去掉了多余的连字符,并把最后的祈使句断成独立一句(或改成疑问句 &quot;Could you help check it out?&quot;,更像礼貌请求而不是命令)。</p>", "level": "GRAMMAR"}, {"anchor": "any-singular-plural", "title": "语法笔记:any 后面用单数还是复数", "ipa": "", "pos": "", "cefr": "", "gloss": "① any + 不可数名词 —— 没有单复数可选,直接用原形", "html": "<p><strong>① any + 不可数名词 —— 没有单复数可选,直接用原形</strong></p><ol class=\"ex\"><li><span class=\"en\">Do you have any information on this?</span><span class=\"zh\">你有这方面的信息吗?</span></li></ol><p><strong>② any + 可数名词复数 —— 最常见,问&quot;有没有(数量不确定)&quot;</strong></p><ol class=\"ex\"><li><span class=\"en\">Do you have any questions?</span><span class=\"zh\">你有什么问题吗?</span></li><li><span class=\"en\">I don&#x27;t have any siblings.</span><span class=\"zh\">我没有兄弟姐妹。</span></li></ol><p><strong>③ any + 可数名词单数 —— 强调&quot;随便哪一个都行&quot;,或&quot;哪怕一个&quot;这种加强语气</strong></p><ol class=\"ex\"><li><span class=\"en\">Any student can answer this question.</span><span class=\"zh\">随便哪个学生都能回答这个问题。</span></li><li><span class=\"en\">You can take any book from the shelf.</span><span class=\"zh\">架子上随便拿一本都行。</span></li></ol><p><strong>判断技巧:</strong> 问自己是在问&quot;有没有一批/一些(不管几个)&quot;,还是在说&quot;随便哪一个单独拿出来都成立&quot;——前者用复数(日常问句/否定句里 90% 都是这种),后者才用单数。</p>", "level": "GRAMMAR"}, {"anchor": "soften-why-cant-you", "title": "语域笔记:\"Why can't you do this yourself?\" 太冲,如何委婉表达", "ipa": "", "pos": "", "cefr": "", "gloss": "原句(直译\"你为什么不能自己做这件事\",语气偏冲、容易显得质问/冒犯):", "html": "<p><strong>原句(直译&quot;你为什么不能自己做这件事&quot;,语气偏冲、容易显得质问/冒犯):</strong></p><p>&gt; Why can&#x27;t you do this yourself?</p><p><strong>问题:</strong> &quot;why can&#x27;t you...&quot; 这种结构容易让对方感觉是在质疑他的能力或意愿,带有指责意味,职场/正式场合容易显得不礼貌。</p><p><strong>更委婉的说法(预设对方可能有正当理由,把&quot;质问&quot;转成&quot;了解情况&quot;):</strong></p><ol class=\"ex\"><li><span class=\"en\">Is there a reason you can&#x27;t handle this on your own?</span><span class=\"zh\">是不是有什么原因,让你没法自己搞定这件事?</span></li><li><span class=\"en\">Is there something blocking you from taking care of this yourself?</span><span class=\"zh\">是不是有什么阻碍,让你没法自己处理这件事?</span></li></ol><p><strong>一句话总结:</strong> 把 &quot;why can&#x27;t you...&quot;(质问对方&quot;为什么不行&quot;)换成 &quot;is there a reason / is there something (blocking)...&quot;(询问&quot;是否存在某个客观原因/阻碍&quot;),预设对方有合理理由而非能力/意愿问题,语气立刻从质问变成关心,更适合职场沟通。</p>", "level": "GRAMMAR"}, {"anchor": "stacked-prepositions", "title": "语法笔记:叠介词短语 vs 复合词/分词短语(\"in the version for X\")", "ipa": "", "pos": "", "cefr": "", "gloss": "原句(没有语法错误,但读起来像翻译腔):", "html": "<p><strong>原句(没有语法错误,但读起来像翻译腔):</strong></p><p>&gt; Show me the report in the version for Teams chat.</p><p><strong>问题:</strong> &quot;the report <strong>in</strong> the version <strong>for</strong> Teams chat&quot; 一口气叠了两层介词短语(in...for...)去修饰同一个名词 report,读者要绕两次弯才拼出&quot;这是专为 Teams 聊天场景准备的版本&quot;。</p><p><strong>更自然的说法(把其中一层压缩成复合词或分词短语):</strong></p><ol class=\"ex\"><li><span class=\"en\">Show me the Teams-chat version of the report.</span><span class=\"zh\">给我看一下这份报告的 Teams 聊天版本。</span></li><li><span class=\"en\">Could you show me the report formatted for Teams chat?</span><span class=\"zh\">能把这份报告按 Teams 聊天的格式给我看看吗?</span></li></ol><p><strong>判断技巧:</strong> 发现自己在句子里连续叠了两个以上的介词短语去修饰同一个名词,通常就是一个信号——可以把其中一层压缩成复合形容词(Teams-chat version)或分词短语(formatted for...),让句子更紧凑、更像 native 会脱口而出的说法。</p>", "level": "GRAMMAR"}, {"anchor": "subject-clause-that", "title": "语法笔记:主语从句必须用 That 引导,不能省略", "ipa": "", "pos": "", "cefr": "", "gloss": "一个完整的从句(有自己的主谓宾)可以整体充当另一个句子的主语,这叫主语从句。但和\"宾语从句\"不同,主语从句里的 That 通常不能省略。", "html": "<p><strong>规则:</strong> 一个完整的从句(有自己的主谓宾)可以整体充当另一个句子的主语,这叫<strong>主语从句</strong>。但和&quot;宾语从句&quot;不同,<strong>主语从句里的 That 通常不能省略</strong>。</p><ul><li>✅ I think <strong>(that)</strong> he lied.(宾语从句,that 可省略)</li><li>✅ <strong>That</strong> he lied is obvious.(主语从句,加 that,正确)</li><li>❌ <del>He lied is obvious.</del>(主语从句,省略 that,不合语法——读者会先把 &quot;He lied&quot; 当成一句完整的话,读到 &quot;is obvious&quot; 才发现要回头重新理解整个句子,这叫 <strong>garden-path sentence(花园幽径句)</strong>)</li></ul><p><strong>真实案例:</strong></p><p>&gt; Platform equals 10 means the request originated from the web, right?</p><p>这句里 &quot;Platform equals 10&quot;(主谓宾结构完整)被当作了主语,严格来说应该加 that:</p><p><strong>That platform equals 10 means the request originated from the web, right?</strong></p><p>platform 等于 10,就代表请求来自 web,对吧?</p><p><strong>例外:</strong> 当&quot;主语从句&quot;其实是一个公式/代码式的表达(比如 &quot;2+2=4&quot; 或 &quot;platform=10&quot; 这种符号形式)时,它更像一个自成一体的名词化单元,而不是严格的自然语言从句,这时候省略 that 也比较自然、不容易产生误读:<em>2+2=4 is a basic fact.</em> 但如果像本例一样用完整英文单词拼出来(&quot;Platform equals 10&quot;),就更接近真正的从句,建议还是加上 that,或者改写成动名词短语/名词短语更安全。</p><p><strong>更推荐的写法:</strong></p><ol class=\"ex\"><li><span class=\"en\">That platform equals 10 means the request originated from the web.</span><span class=\"zh\">加 that,语法最保险。</span></li><li><span class=\"en\">Platform equaling 10 means the request originated from the web.</span><span class=\"zh\">把从句改成动名词短语做主语,英语里更常见、更地道。</span></li><li><span class=\"en\">A platform value of 10 means the request originated from the web.</span><span class=\"zh\">直接改写成名词短语做主语,技术写作里最干净利落。</span></li></ol>", "level": "GRAMMAR"}]}];

const LV = {
  A1:{nm:"入门",  sw:["--a1-1","--a1-2","--a1-3"]},
  A2:{nm:"基础",  sw:["--a2-1","--a2-2","--a2-3"]},
  B1:{nm:"进阶",  sw:["--b1-1","--b1-2","--b1-3"]},
  B2:{nm:"中高级",sw:["--b2-1","--b2-2","--b2-3"]},
  C1:{nm:"高级",  sw:["--c1-1","--c1-2","--c1-3"]},
  C2:{nm:"精通",  sw:["--c2-1","--c2-2","--c2-3"]},
  TERM:{nm:"术语与固定搭配(无 CEFR 分级)", sw:["--tm-1","--tm-2","--tm-3"]},
  GRAMMAR:{nm:"语法与语域笔记", sw:["--gr-1","--gr-2","--gr-3"]}
};
const LABEL = {TERM:"术语", GRAMMAR:"语法"};

// ── theme toggle ─────────────────────────
const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.4M12 19v2.4M21.4 12H19M5 12H2.6M18.6 5.4l-1.7 1.7M7.1 16.9l-1.7 1.7M18.6 18.6l-1.7-1.7M7.1 7.1L5.4 5.4"/></svg>';
const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.6A8.6 8.6 0 1 1 9.4 3.5a6.9 6.9 0 0 0 11.1 11.1Z"/></svg>';
const themeBtn = document.getElementById("theme");
const darkMQ = window.matchMedia("(prefers-color-scheme: dark)");
const effective = () => document.documentElement.dataset.theme || (darkMQ.matches ? "dark" : "light");
function paintTheme(){
  const isDark = effective() === "dark";
  themeBtn.innerHTML = isDark ? SUN : MOON;
  const label = isDark ? "切换到浅色主题" : "切换到深色主题";
  themeBtn.setAttribute("aria-label", label);
  themeBtn.title = label;
}
themeBtn.addEventListener("click", () => {
  const next = effective() === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("vk.theme", next); } catch(e){}
  paintTheme();
});
darkMQ.addEventListener("change", () => { if (!document.documentElement.dataset.theme) paintTheme(); });
paintTheme();

const board = document.getElementById("board");
const filters = document.getElementById("filters");
const q = document.getElementById("q");
const empty = document.getElementById("empty");
const total = DATA.reduce((n,g)=>n+g.items.length,0);
document.getElementById("tally").textContent = total + " 条 · 按 CEFR 等级分组";

let active = "ALL";
try { const s = localStorage.getItem("vk.level"); if (s) active = s; } catch(e){}

// filter pills
const mk = (key, text, sw) => {
  const b = document.createElement("button");
  b.className = "pill"; b.type = "button"; b.dataset.k = key;
  b.setAttribute("aria-pressed", String(active === key));
  if (sw) { b.style.setProperty("--sw", `var(${sw})`); b.innerHTML = '<span class="dot"></span>'; }
  b.append(text);
  b.addEventListener("click", () => {
    active = key;
    try { localStorage.setItem("vk.level", key); } catch(e){}
    [...filters.children].forEach(c => c.setAttribute("aria-pressed", String(c.dataset.k === key)));
    render();
  });
  return b;
};
filters.append(mk("ALL", "全部"));
DATA.forEach(g => filters.append(mk(g.level, LABEL[g.level] || g.level, LV[g.level].sw[0])));

// build sections once
const sections = DATA.map(g => {
  const sec = document.createElement("section");
  sec.className = "sect"; sec.dataset.level = g.level;
  const head = document.createElement("div");
  head.className = "sect-head";
  head.style.setProperty("--sw", `var(${LV[g.level].sw[0]})`);
  head.innerHTML =
    `<span class="badge">${LABEL[g.level] || g.level}</span>` +
    `<span class="nm">${LV[g.level].nm}</span>` +
    `<span class="ct">${g.items.length} 条</span>`;
  const grid = document.createElement("div");
  grid.className = "grid";
  const cards = g.items.map((it, i) => {
    const c = document.createElement("button");
    c.className = "card"; c.type = "button";
    c.style.setProperty("--sw", `var(${LV[g.level].sw[i % 3]})`);
    const n = (it.html.match(/<li><span class="en">/g) || []).length;
    const meta = [it.pos && `<span class="pos">${it.pos}</span>`, it.ipa && `<span class="ipa">${it.ipa}</span>`]
      .filter(Boolean).join("");
    c.innerHTML =
      `<h3 class="hw">${it.title}</h3>` +
      (meta ? `<div class="meta">${meta}</div>` : "") +
      (it.gloss ? `<p class="gloss">${it.gloss}</p>` : "") +
      `<div class="foot"><span class="lv">${it.cefr ? it.cefr.split("/")[0].trim() : (LABEL[g.level] || g.level)}</span>` +
      `<span>${n ? n + " 例句" : "笔记"}</span></div>`;
    c.addEventListener("click", () => open(it, g.level, i));
    grid.append(c);
    return { el: c, hay: (it.title + " " + it.gloss + " " + it.html).toLowerCase() };
  });
  sec.append(head, grid);
  board.append(sec);
  return { level: g.level, el: sec, cards };
});

function render(){
  const term = q.value.trim().toLowerCase();
  let shown = 0;
  sections.forEach(s => {
    if (active !== "ALL" && active !== s.level) { s.el.hidden = true; return; }
    let n = 0;
    s.cards.forEach(c => {
      const hit = !term || c.hay.includes(term);
      c.el.hidden = !hit;
      if (hit) n++;
    });
    s.el.hidden = n === 0;
    s.el.querySelector(".ct").textContent = n + " 条";
    shown += n;
  });
  empty.hidden = shown > 0;
}
q.addEventListener("input", render);

// modal
let scrim = null, lastFocus = null;
function open(it, level, i){
  lastFocus = document.activeElement;
  scrim = document.createElement("div");
  scrim.className = "scrim";
  const sheet = document.createElement("div");
  sheet.className = "sheet";
  sheet.setAttribute("role", "dialog");
  sheet.setAttribute("aria-modal", "true");
  sheet.setAttribute("aria-label", it.title);
  sheet.style.setProperty("--sw", `var(${LV[level].sw[i % 3]})`);
  const meta = [it.pos, it.ipa, it.cefr && ("CEFR " + it.cefr)].filter(Boolean)
    .map(x => `<span>${x}</span>`).join("");
  sheet.innerHTML =
    `<button class="x" type="button" aria-label="关闭">✕</button>` +
    `<h2>${it.title}</h2>` +
    (meta ? `<div class="meta">${meta}</div>` : "") +
    `<div class="body">${it.html}</div>`;
  scrim.append(sheet);
  document.body.append(scrim);
  sheet.querySelector(".x").addEventListener("click", close);
  scrim.addEventListener("click", e => { if (e.target === scrim) close(); });
  sheet.querySelector(".x").focus();
}
function close(){
  if (!scrim) return;
  scrim.remove(); scrim = null;
  if (lastFocus) lastFocus.focus();
}
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { if (scrim) close(); else if (document.activeElement === q) { q.value = ""; render(); } }
});

render();
</script>
