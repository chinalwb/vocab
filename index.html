<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  body{margin:0;font:14px system-ui,-apple-system,sans-serif}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
<title>词汇便签墙</title>
<script>

  try {
    var t = localStorage.getItem("vk.theme");
    if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
:root{
  color-scheme: light;
  --ground:#f7f6f2;
  --ink:#1f1f1e;
  --ink-2:#4a4944;
  --ink-3:#77756c;
  --rule:#e2e0d8;
  --chip:#ffffff;
  --chip-on:#1f1f1e;
  --chip-on-ink:#f7f6f2;
  --shadow:0 1px 2px rgba(31,31,30,.10), 0 1px 3px 1px rgba(31,31,30,.07);
  --shadow-lift:0 2px 6px rgba(31,31,30,.14), 0 8px 20px -6px rgba(31,31,30,.18);
  --scrim:rgba(31,31,30,.42);
  --card-ink:#1f1f1e;
  --card-ink-2:#4a4944;
  --card-edge:rgba(31,31,30,.10);

  --a1-1:#dcecd4; --a1-2:#cde5c6; --a1-3:#e7f2e1;
  --a2-1:#cbe7e1; --a2-2:#bbdfd8; --a2-3:#dbefeb;
  --b1-1:#d2e3f4; --b1-2:#c1d9ef; --b1-3:#e0ecf8;
  --b2-1:#fbf0bd; --b2-2:#f7e8a4; --b2-3:#fdf6d4;
  --c1-1:#fbdcc0; --c1-2:#f7cea7; --c1-3:#fde9d6;
  --c2-1:#f7cfc9; --c2-2:#f2bab2; --c2-3:#fadfdb;
  --tm-1:#ddd9f2; --tm-2:#cec9ea; --tm-3:#e9e6f7;
  --gr-1:#f2d5e4; --gr-2:#ebc2d7; --gr-3:#f7e4ee;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --ground:#1b1b19;
    --ink:#eceae2;
    --ink-2:#c3c0b5;
    --ink-3:#928f84;
    --rule:#343330;
    --chip:#2a2926;
    --chip-on:#eceae2;
    --chip-on-ink:#1b1b19;
    --shadow:0 1px 2px rgba(0,0,0,.45), 0 1px 3px 1px rgba(0,0,0,.3);
    --shadow-lift:0 2px 8px rgba(0,0,0,.55), 0 10px 24px -6px rgba(0,0,0,.5);
    --scrim:rgba(0,0,0,.62);
    --card-ink:#efede6;
    --card-ink-2:#c9c6bb;
    --card-edge:rgba(255,255,255,.09);

    --a1-1:#2e4a2a; --a1-2:#375835; --a1-3:#263f23;
    --a2-1:#1d4a45; --a2-2:#245853; --a2-3:#173d39;
    --b1-1:#254460; --b1-2:#2c5273; --b1-3:#1e3950;
    --b2-1:#57501c; --b2-2:#665e22; --b2-3:#484216;
    --c1-1:#5a3a1d; --c1-2:#6b4623; --c1-3:#4a3017;
    --c2-1:#5b2b28; --c2-2:#6d3430; --c2-3:#4b2320;
    --tm-1:#3b3364; --tm-2:#473d76; --tm-3:#312a54;
    --gr-1:#562a44; --gr-2:#663251; --gr-3:#472238;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --ground:#1b1b19;
  --ink:#eceae2;
  --ink-2:#c3c0b5;
  --ink-3:#928f84;
  --rule:#343330;
  --chip:#2a2926;
  --chip-on:#eceae2;
  --chip-on-ink:#1b1b19;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 1px 3px 1px rgba(0,0,0,.3);
  --shadow-lift:0 2px 8px rgba(0,0,0,.55), 0 10px 24px -6px rgba(0,0,0,.5);
  --scrim:rgba(0,0,0,.62);
  --card-ink:#efede6;
  --card-ink-2:#c9c6bb;
  --card-edge:rgba(255,255,255,.09);

  --a1-1:#2e4a2a; --a1-2:#375835; --a1-3:#263f23;
  --a2-1:#1d4a45; --a2-2:#245853; --a2-3:#173d39;
  --b1-1:#254460; --b1-2:#2c5273; --b1-3:#1e3950;
  --b2-1:#57501c; --b2-2:#665e22; --b2-3:#484216;
  --c1-1:#5a3a1d; --c1-2:#6b4623; --c1-3:#4a3017;
  --c2-1:#5b2b28; --c2-2:#6d3430; --c2-3:#4b2320;
  --tm-1:#3b3364; --tm-2:#473d76; --tm-3:#312a54;
  --gr-1:#562a44; --gr-2:#663251; --gr-3:#472238;
}

*{box-sizing:border-box}
body{
  background:var(--ground);
  color:var(--ink);
  font-family:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  font-size:15px;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
.wrap{padding-inline:16px;padding-block:0 64px;max-width:1500px;margin:0 auto}

/* ── header ─────────────────────────────── */
.top{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
  background:color-mix(in srgb, var(--ground) 92%, transparent);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--rule);
  margin-inline:-16px;padding:14px 16px 12px;
}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
h1{
  font-family:Newsreader,Georgia,"Songti SC",serif;
  font-weight:600;font-size:26px;line-height:1.15;margin:0;letter-spacing:-.01em;
}
.tally{color:var(--ink-3);font-size:12.5px;letter-spacing:.04em}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search{
  flex:1 1 200px;min-width:0;max-width:320px;
  background:var(--chip);color:var(--ink);
  border:1px solid var(--rule);border-radius:999px;
  padding:7px 14px;font:inherit;font-size:13.5px;
}
.search::placeholder{color:var(--ink-3)}
.search:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.pill{
  font:inherit;font-size:12px;font-weight:500;letter-spacing:.03em;
  background:var(--chip);color:var(--ink-2);
  border:1px solid var(--rule);border-radius:999px;
  padding:5px 12px;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;
}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--sw)}
.pill[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink);border-color:var(--chip-on)}
.pill:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.theme{
  margin-left:auto;flex:0 0 auto;
  width:32px;height:32px;padding:0;
  display:inline-grid;place-items:center;
  background:var(--chip);color:var(--ink-2);
  border:1px solid var(--rule);border-radius:50%;cursor:pointer;
}
.theme:hover{color:var(--ink)}
.theme:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.theme svg{width:16px;height:16px;display:block}

/* ── sections ───────────────────────────── */
.sect{margin-top:34px}
.sect-head{display:flex;align-items:baseline;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.sect-head .badge{
  font-family:Newsreader,Georgia,serif;font-weight:600;font-size:17px;
  background:var(--sw);color:var(--card-ink);
  border:1px solid var(--card-edge);
  border-radius:8px;padding:2px 11px;letter-spacing:.02em;
}
.sect-head .nm{font-size:14px;color:var(--ink-2);font-weight:500}
.sect-head .ct{font-size:12px;color:var(--ink-3);letter-spacing:.04em}

.grid{columns:4 250px;column-gap:14px}
.card{
  break-inside:avoid;-webkit-column-break-inside:avoid;
  background:var(--sw);color:var(--card-ink);
  border:1px solid var(--card-edge);border-radius:10px;
  padding:13px 15px 12px;margin-bottom:14px;
  box-shadow:var(--shadow);cursor:pointer;text-align:left;width:100%;
  font:inherit;display:block;
  transition:box-shadow .16s ease, transform .16s ease;
}
.card:hover{box-shadow:var(--shadow-lift);transform:translateY(-1px)}
.card:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.hw{
  font-family:Newsreader,Georgia,"Songti SC",serif;
  font-weight:600;font-size:19px;line-height:1.25;margin:0 0 5px;
  letter-spacing:-.005em;text-wrap:balance;
}
.meta{display:flex;flex-wrap:wrap;gap:4px 8px;margin-bottom:7px;font-size:11.5px;color:var(--card-ink-2);line-height:1.45}
.card .meta{max-height:3.1em;overflow:hidden}
.meta .pos{font-weight:500}
.meta .ipa{font-variant-numeric:tabular-nums;opacity:.9}
.gloss{
  margin:0;font-size:13.5px;line-height:1.62;color:var(--card-ink-2);
  display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;
}
.foot{
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  margin-top:10px;padding-top:8px;border-top:1px solid var(--card-edge);
  font-size:11px;color:var(--card-ink-2);letter-spacing:.05em;
}
.foot .lv{font-weight:700}

.empty{color:var(--ink-3);font-size:14px;padding:48px 0;text-align:center}

/* ── modal ──────────────────────────────── */
.scrim{
  position:fixed;inset:0;z-index:50;background:var(--scrim);
  display:flex;align-items:flex-start;justify-content:center;
  padding:max(24px,env(safe-area-inset-top,0px)) 16px 40px;overflow-y:auto;
}
.sheet{
  background:var(--sw);color:var(--card-ink);
  border:1px solid var(--card-edge);border-radius:14px;
  box-shadow:var(--shadow-lift);
  width:min(680px,100%);padding:22px 24px 26px;position:relative;
}
.sheet h2{
  font-family:Newsreader,Georgia,"Songti SC",serif;
  font-weight:600;font-size:25px;line-height:1.2;margin:0 0 6px;padding-right:40px;
  text-wrap:balance;
}
.sheet .meta{font-size:12.5px;margin-bottom:16px}
.x{
  position:absolute;top:14px;right:14px;
  width:30px;height:30px;border-radius:50%;
  background:transparent;border:1px solid var(--card-edge);
  color:var(--card-ink-2);font:inherit;font-size:15px;line-height:1;cursor:pointer;
}
.x:hover{background:var(--card-edge)}
.x:focus-visible{outline:2px solid var(--card-ink);outline-offset:1px}
.body{font-size:14px;color:var(--card-ink)}
.body p{margin:0 0 11px}
.body strong{font-weight:700}
.body code{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.9em;
  background:var(--card-edge);padding:1px 5px;border-radius:4px;
}
.body ul{margin:0 0 12px;padding-left:19px}
.body ul li{margin-bottom:5px}
.body ol.ex{margin:0 0 13px;padding-left:19px}
.body ol.ex li{margin-bottom:9px}
.body ol.ex .en{
  display:block;font-family:Newsreader,Georgia,serif;font-size:15.5px;line-height:1.45;
}
.body ol.ex .zh{display:block;font-size:13px;color:var(--card-ink-2);margin-top:2px}
.body del{opacity:.65}

@media (max-width:640px){
  .grid{columns:2 150px;column-gap:10px}
  .card{margin-bottom:10px;padding:11px 13px}
  h1{font-size:22px}
  .sheet{padding:18px 17px 22px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>词汇便签墙</h1>
      <span class="tally" id="tally"></span>
    </div>
    <div class="tools">
      <input class="search" id="q" type="search" placeholder="搜索单词、释义、语法点…" autocomplete="off" aria-label="搜索">
      <div class="filters" id="filters"></div>
      <button class="theme" id="theme" type="button"></button>
    </div>
  </header>
  <main id="board"></main>
  <p class="empty" id="empty" hidden>没有匹配的条目。</p>
</div>

<script>
const DATA = [{"level": "A1", "items": [{"anchor": "name-verb", "title": "name(动词,\"指定/开出条件\"义)", "ipa": "/neɪm/", "pos": "v.(引申义,不是\"起名字\"的字面义)", "cefr": "基础义 A1(起名字);\"指定/开出条件\"这个引申义算 B2", "gloss": "释义: 明确说出/指定(自己想要什么),常用于\"对方主动给你选择权,让你自己提条件\"这种场景。", "html": "<p><strong>释义:</strong> 明确说出/指定(自己想要什么),常用于&quot;对方主动给你选择权,让你自己提条件&quot;这种场景。</p><p><strong>例句:</strong></p><ol class=\"ex\"><li><span class=\"en\">The emperor was so impressed and grateful that he invited the inventor to name his reward.</span><span class=\"zh\">皇帝对这个发明印象深刻、非常感激,于是邀请发明者自己说出想要什么样的奖赏。(经典的&quot;棋盘麦粒问题&quot;故事开头)</span></li><li><span class=\"en\">The buyer was so eager that he told the seller to name her price.</span><span class=\"zh\">买家太想要了,直接让卖家开个价。</span></li><li><span class=\"en\">&quot;Name your reward,&quot; the king said, &quot;and it shall be yours.&quot;</span><span class=\"zh\">国王说:&quot;你说吧,想要什么奖赏,我都给你。&quot;</span></li></ol><p><strong>常见固定搭配:name your price —— 开个价吧,你说多少就多少</strong></p>", "level": "A1"}]}, {"level": "A2", "items": [{"anchor": "bakery", "title": "bakery", "ipa": "/ˈbeɪkəri/", "pos": "n.", "cefr": "A2/B1", "gloss": "释义: 卖面包/糕点的店铺(地点),不管是不是自己现烤——跟 pastry(糕点这种东西本身)是\"地点 vs 产品\"的区别。", "html": "<p><strong>释义:</strong> 卖面包/糕点的店铺(地点),不管是不是自己现烤——跟 <strong>pastry</strong>(糕点这种东西本身)是&quot;地点 vs 产品&quot;的区别。</p><p><strong>例句:</strong></p><ol class=\"ex\"><li><span class=\"en\">There&#x27;s a bakery around the corner that sells fresh bread every morning.</span><span class=\"zh\">拐角有一家面包店,每天早上都卖新鲜面包。</span></li><li><span class=\"en\">We stopped by the bakery to pick up some pastries for the meeting.</span><span class=\"zh\">我们顺路去了趟面包店,给会议买了些糕点。</span></li></ol><p><strong>⚠️ bakery vs bread shop:</strong> &quot;bread shop&quot; 语法正确、能理解,但<strong>不是英语里的自然说法</strong>,听起来像是从其他语言直译过来的(比如中文&quot;面包店&quot;逐字对应)。母语者几乎都会直接说 <strong>bakery</strong>,这跟之前存过的 &quot;quota is spent&quot; 是类似的&quot;能懂但不地道&quot;案例。</p><p><strong>同源词:</strong></p><ul><li><strong>baker</strong>(名词)—— 面包师。<em>The baker gets up at 4 a.m. to prepare the dough.</em></li><li><strong>bake</strong>(动词)—— 烘烤。<em>She bakes cookies every weekend.</em></li></ul><p><strong>更细分的相关词:</strong></p><ul><li><strong>patisserie</strong>(法语借词,/pəˈtiːsəri/)—— 更偏&quot;精致法式糕点店&quot;,聚焦甜点/酥皮点心,语境偏高档。</li></ul><p><em>We got some macarons from a patisserie downtown.</em></p><p>我们从市中心一家法式糕点店买了些马卡龙。</p><ul><li><strong>artisan bakery</strong> —— 强调&quot;手工/匠人精神&quot;的面包店,强调手工制作、非工业化生产。</li></ul>", "level": "A2"}, {"anchor": "check-out", "title": "check out / checkout", "ipa": "/tʃɛk aʊt/(check out);/ˈtʃɛkaʊt/(checkout)", "pos": "check out = 短语动词(分写);checkout = 名词(连写)", "cefr": "A2/B1(基础义);B2(引申义)", "gloss": "核心意象: 核对一下然后\"放行/离开\"——不管是核实信息、结账离开、退房离开,还是借书\"放行\"带走,甚至精神上\"离场\",都能追溯到这个共同的意象。", "html": "<p><strong>核心意象:</strong> 核对一下然后&quot;放行/离开&quot;——不管是核实信息、结账离开、退房离开,还是借书&quot;放行&quot;带走,甚至精神上&quot;离场&quot;,都能追溯到这个共同的意象。</p><p><strong>check out(动词短语)义项一:核实、证实(某种说法/信息)是真的</strong></p><ol class=\"ex\"><li><span class=\"en\">We ruled him out as a suspect once his alibi checked out.</span><span class=\"zh\">一旦他的不在场证明被核实,我们就排除了他的嫌疑。</span></li><li><span class=\"en\">I need to check out this information before I report it.</span><span class=\"zh\">我需要先核实这个信息,然后再上报。</span></li></ol><p><strong>义项二:(酒店)退房</strong></p><ol class=\"ex\"><li><span class=\"en\">We need to check out of the hotel by 11 a.m.</span><span class=\"zh\">我们得在早上11点之前退房。</span></li></ol><p><strong>义项三:(超市/商店)结账</strong></p><ol class=\"ex\"><li><span class=\"en\">There was a long line to check out at the grocery store.</span><span class=\"zh\">超市结账的队排得很长。</span></li></ol><p><strong>义项四:(从图书馆)借出</strong></p><ol class=\"ex\"><li><span class=\"en\">She checked out three books from the library.</span><span class=\"zh\">她从图书馆借了三本书。</span></li></ol><p><strong>义项五:(口语)看看、瞧一瞧(引起注意,推荐/展示某样东西)</strong></p><ol class=\"ex\"><li><span class=\"en\">Check out this new restaurant that just opened downtown!</span><span class=\"zh\">快看看市中心新开的这家餐厅!</span></li><li><span class=\"en\">Check it out — I just got a new phone!</span><span class=\"zh\">看看这个——我刚买了个新手机!</span></li></ol><p><strong>义项六:(口语)走神、精神上抽离,不再投入</strong></p><ol class=\"ex\"><li><span class=\"en\">He mentally checked out of the meeting halfway through.</span><span class=\"zh\">会开到一半他就走神了,完全没在听。</span></li></ol><p><strong>义项七:(Git 命令,技术语境)切换分支/提交,或恢复文件——跟&quot;从图书馆借书&quot;是同一个心智模型:版本库是&quot;图书馆&quot;,分支/commit 是&quot;书&quot;,checkout 就是把这本&quot;书&quot;取出来放到工作目录里</strong></p><ol class=\"ex\"><li><span class=\"en\">Run <code>git checkout main</code> to switch back to the main branch.</span><span class=\"zh\">运行 <code>git checkout main</code> 切换回 main 分支。</span></li><li><span class=\"en\">He checked out an old commit to debug the regression.</span><span class=\"zh\">他检出了一个旧的提交,用来排查这个回归问题。</span></li><li><span class=\"en\">You can check out a specific file to discard local changes: <code>git checkout -- file.js</code>.</span><span class=\"zh\">你可以检出某个具体文件来丢弃本地修改。</span></li><li><span class=\"en\">Use <code>git checkout -b feature/login</code> to create and switch to a new branch.</span><span class=\"zh\">用 <code>git checkout -b feature/login</code> 来创建并切换到一个新分支。</span></li></ol><p><strong>checkout(名词,一个词连写,注意和 check out 动词短语的拼写区分)</strong></p><ul><li><strong>收银台/结账处</strong></li></ul><p>Please pay at the checkout.</p><p>请在收银台付款。</p><p>This store now offers self-checkout machines.</p><p>这家店现在提供自助结账机。</p><ul><li><strong>(酒店)退房时间</strong></li></ul><p>Checkout time is 11 a.m.</p><p>退房时间是上午11点。</p><ul><li><strong>(电商/技术语境,高频)结账流程/结算页面</strong></li></ul><p>Many users abandon their cart during checkout.</p><p>很多用户会在结账环节放弃购物车。</p><p>We redesigned the checkout page to reduce friction.</p><p>我们重新设计了结账页面,以减少操作阻力。</p><ul><li><strong>(Git,名词用法)检出的仓库副本</strong></li></ul><p>Do a fresh checkout of the repo before running the tests.</p><p>在跑测试之前,先重新检出一份仓库副本。</p><p><strong>拼写规则记忆:</strong> check out(两个词,分写)是动词短语;checkout(一个词,连写)是名词。同样的模式还有 log in(动词)vs login(名词)、sign up(动词)vs signup(名词)。</p><p><strong>语法重点:可分割短语动词,宾语为纯代词时必须拆开(和 rule out / rule sb out 同一条规则)</strong></p><ul><li>✅ check it out / check this out(this 单独作代词,和 it 一样必须拆开)</li><li>⚠️ check out this ——孤立代词不能这样放,但如果 this 后面跟名词组成完整名词短语(比如 check out this restaurant),两种语序都行:</li><li>check out this restaurant = check this restaurant out ✅</li><li>check out this information = check this information out ✅(名词短语,两种语序皆可)</li></ul><p><strong>一句话记忆:</strong> 孤立代词(it / this 单独用)→ 必须拆开:check it out / check this out;this/that + 名词组成的完整名词短语 → 两种语序都行。</p>", "level": "A2"}, {"anchor": "for-now", "title": "for now / at the moment / for the moment", "ipa": "/fər naʊ/", "pos": "", "cefr": "A2/B1", "gloss": "三者都表示\"目前、暂时\",但语气和强调点不同。", "html": "<p>三者都表示&quot;目前、暂时&quot;,但语气和强调点不同。</p><p><strong>for now</strong> —— 强调&quot;目前先这样,以后可能会变&quot;,常用作句末收尾语气,带一点&quot;到此为止,后面再说&quot;的味道,口语高频</p><ol class=\"ex\"><li><span class=\"en\">Let&#x27;s leave it here for now — we can revisit it later.</span><span class=\"zh\">我们先放这儿吧,以后再说。</span></li><li><span class=\"en\">I&#x27;m using a temporary fix for now.</span><span class=\"zh\">我目前先用一个临时方案顶着。</span></li></ol><p><strong>at the moment</strong> —— 强调&quot;此刻、当下这个时间点&quot;,更中性、更客观地描述当前状态,不一定暗示&quot;很快会变&quot;,书面口语都常见</p><ol class=\"ex\"><li><span class=\"en\">She&#x27;s not available at the moment — she&#x27;s in a meeting.</span><span class=\"zh\">她现在不方便——正在开会。</span></li><li><span class=\"en\">We don&#x27;t have any openings at the moment.</span><span class=\"zh\">我们目前没有空缺职位。</span></li></ol><p><strong>for the moment</strong> —— 和 for now 意思很接近,强调&quot;暂且、就当前这个阶段而言&quot;,比 for now 略正式一点,常见于书面语,也带&quot;这只是暂时状态&quot;的意味</p><ol class=\"ex\"><li><span class=\"en\">For the moment, we&#x27;ll continue using the old system.</span><span class=\"zh\">目前这个阶段,我们会继续使用旧系统。</span></li><li><span class=\"en\">The situation is under control for the moment.</span><span class=\"zh\">目前局势尚在控制之中。</span></li></ol><p><strong>一句话总结:</strong></p><ul><li><strong>at the moment</strong> 最中性,单纯描述&quot;此刻是什么状态&quot;</li><li><strong>for now</strong> 最口语,带&quot;先这样,后面再看&quot;的暂时感</li><li><strong>for the moment</strong> 和 for now 意思接近但更书面,常用于强调&quot;这只是当前阶段,不是长久之计&quot;</li></ul>", "level": "A2"}, {"anchor": "race-out-of-control", "title": "race out of control", "ipa": "/reɪs/", "pos": "", "cefr": "A2/B1(基础义:赛跑、竞速)", "gloss": "race(动词,这里的引申义)", "html": "<p><strong>race</strong>(动词,这里的引申义)</p><ul><li>释义:本义是&quot;赛跑、竞速&quot;,引申为&quot;极快地移动/发展&quot;——强调速度快到近乎失控的冲刺感。</li></ul><p><strong>out of control</strong>(形容词性短语)</p><ul><li>释义:失控的,不再受控制的。</li></ul><p><strong>合起来:race out of control —— 迅速失控、飞速冲向失控的地步</strong>,强调&quot;某个东西发展/增长的速度快到让人根本来不及反应、抓不住&quot;。</p><p><strong>例句:</strong></p><ol class=\"ex\"><li><span class=\"en\">But, like the emperor, we often struggle to grasp intuitively how quickly something doubling can race out of control.</span><span class=\"zh\">但和那位皇帝一样,我们往往很难凭直觉理解,一个不断翻倍(指数级增长)的东西,能以多快的速度飞速失控。(呼应&quot;棋盘麦粒&quot;的故事:翻倍增长一开始看起来很温和,但很快就会快到完全超出人的直觉预期、彻底失控)</span></li><li><span class=\"en\">If left unchecked, the outbreak could race out of control within weeks.</span><span class=\"zh\">如果不加以控制,这场疫情可能在几周内就迅速失控。</span></li><li><span class=\"en\">The project&#x27;s scope started to race out of control once new requirements kept piling up.</span><span class=\"zh\">一旦新需求不断堆积,这个项目的范围就开始迅速失控。</span></li></ol>", "level": "A2"}]}, {"level": "B1", "items": [{"anchor": "independent", "title": "independent", "ipa": "/ˌɪndɪˈpendənt/", "pos": "adj.", "cefr": "B1", "gloss": "义项一:独立自主的(不受他人控制,人/国家/组织)", "html": "<p><strong>义项一:独立自主的(不受他人控制,人/国家/组织)</strong></p><ol class=\"ex\"><li><span class=\"en\">After turning 18, she moved out and became fully independent.</span><span class=\"zh\">满 18 岁后,她搬出去住,变得完全独立自主了。</span></li><li><span class=\"en\">The country gained independence and became an independent nation in 1960.</span><span class=\"zh\">这个国家在 1960 年获得独立,成为一个独立国家。</span></li></ol><p><strong>义项二:不受……影响、与……无关(常搭配 independent of)</strong></p><ol class=\"ex\"><li><span class=\"en\">The results of the experiment should be independent of who conducts it.</span><span class=\"zh\">实验结果应该跟由谁来做无关。</span></li><li><span class=\"en\">In this study, age and income were treated as independent variables.</span><span class=\"zh\">在这项研究中,年龄和收入被当作自变量(相互独立的变量)。</span></li></ol><p><strong>义项三:自由职业的 / 非隶属于大机构的</strong></p><ol class=\"ex\"><li><span class=\"en\">He works as an independent contractor rather than a full-time employee.</span><span class=\"zh\">他是自由职业的承包商,而不是全职员工。</span></li><li><span class=\"en\">The film festival showcases independent films made outside the major studios.</span><span class=\"zh\">这个电影节展映的是在大制片厂体系之外制作的独立电影。</span></li></ol><p><strong>介词搭配辨析:independent of vs independent from</strong></p><ul><li><strong>independent of</strong> —— 最通用、最常见,适用于绝大多数&quot;不受……影响、与……无关&quot;的抽象语境。</li></ul><p><em>The outcome should be independent of external pressure.</em></p><p>结果应该不受外部压力的影响。</p><p><em>These two variables are independent of each other.</em></p><p>这两个变量彼此独立、互不相关。</p><ul><li><strong>independent from</strong> —— 也正确,更常出现在&quot;摆脱某个统治/隶属关系,获得政治独立&quot;这个具体语境里,from 的&quot;脱离、来自&quot;方向感更契合。</li></ul><p><em>The country declared independence from British rule in 1947.</em></p><p>这个国家在 1947 年宣布脱离英国统治,获得独立。</p><p><em>The subsidiary now operates independent from its parent company.</em></p><p>这家子公司现在已经独立于母公司运营。</p><p>一句话总结:抽象的&quot;不受影响、无关&quot;用 <strong>independent of</strong>;具体的&quot;脱离某个统治/机构获得独立&quot;用 <strong>independent from</strong> 更贴合方向感,但很多场合可以互换,independent of 是更保险、更百搭的默认选择。</p>", "level": "B1"}, {"anchor": "pastry", "title": "pastry / pastries", "ipa": "/ˈpeɪstri/(复数 /ˈpeɪstriz/)", "pos": "n.(pastry 不可数;pastries 可数复数)", "cefr": "B1/B2", "gloss": "义项一:不可数名词 —— (做糕点用的)油酥面团/面皮", "html": "<p><strong>义项一:不可数名词 —— (做糕点用的)油酥面团/面皮</strong></p><ol class=\"ex\"><li><span class=\"en\">She rolled out the pastry before placing it in the pie dish.</span><span class=\"zh\">她把油酥面团擀开,然后放进派盘里。</span></li></ol><p><strong>义项二:可数名词(常用复数 pastries)—— 各式酥皮糕点、甜点</strong></p><ol class=\"ex\"><li><span class=\"en\">We grabbed some fresh pastries from the bakery this morning.</span><span class=\"zh\">我们今天早上从面包店买了些新鲜的糕点。</span></li><li><span class=\"en\">The bakery offers a wide assortment of pastries.</span><span class=\"zh\">这家面包店提供各式各样的糕点。</span></li></ol>", "level": "B1"}, {"anchor": "on-a-basis", "title": "on a ... basis", "ipa": "/ˈbeɪsɪs/", "pos": "", "cefr": "B1/B2", "gloss": "basis(名词)", "html": "<p><strong>basis</strong>(名词)</p><ul><li>核心含义:基础、依据、方式——指某件事运作/安排时所依据的&quot;底层原则或方式&quot;。</li></ul><p><strong>&quot;on a ... basis&quot; 结构:</strong> 字面意思是&quot;依据……的方式/基础(来做某事)&quot;,用来回答&quot;这件事的性质/安排方式是什么样的&quot;,给动作/状态定性,而不是描述动作本身。</p><p><strong>例句:</strong></p><ol class=\"ex\"><li><span class=\"en\">Many part-time workers hope to get hired on a permanent basis.</span><span class=\"zh\">许多兼职员工都希望能被转为永久雇佣(转正)。</span></li><li><span class=\"en\">The service is currently offered on a temporary basis.</span><span class=\"zh\">这项服务目前是以临时性质提供的。</span></li><li><span class=\"en\">We review these requests on a case-by-case basis.</span><span class=\"zh\">我们会逐案审核这些请求,具体情况具体分析。</span></li></ol><p><strong>常见组合:</strong></p><ul><li><strong>on a temporary basis</strong> —— 临时性质的</li><li><strong>on a permanent basis</strong> —— 永久/长期性质的(转正,和临时工/合同工相对)</li><li><strong>on a part-time / full-time basis</strong> —— 兼职/全职性质的</li><li><strong>on a regular basis</strong> —— 定期地、经常性地</li><li><strong>on a voluntary basis</strong> —— 自愿性质的(不是被强制的)</li><li><strong>on a case-by-case basis</strong> —— 逐案处理、具体情况具体分析</li></ul>", "level": "B1"}]}, {"level": "B2", "items": [{"anchor": "canary", "title": "canary", "ipa": "英 /kəˈneəri/ 美 /kəˈneri/", "pos": "n.", "cefr": "B2", "gloss": "义项一:金丝雀(鸟)", "html": "<p><strong>义项一:金丝雀(鸟)</strong></p><ol class=\"ex\"><li><span class=\"en\">She keeps a canary in a cage by the window.</span><span class=\"zh\">她在窗边养了一只笼子里的金丝雀。</span></li><li><span class=\"en\">Miners once carried a canary in a coal mine to detect toxic gas.</span><span class=\"zh\">矿工过去会带一只金丝雀下矿井,用来侦测有毒气体。—— 这句正好是引申义的来源典故。</span></li></ol><p><strong>义项二:预警测试 / 哨兵版本(引申义,技术语境常见)</strong></p><ol class=\"ex\"><li><span class=\"en\">We run a canary test before every deploy to catch regressions early.</span><span class=\"zh\">我们每次部署前都会跑一个&quot;哨兵测试&quot;,提前发现回归问题。</span></li><li><span class=\"en\">They rolled out the update to a small canary group of users first.</span><span class=\"zh\">他们先把更新推送给一小部分&quot;金丝雀用户&quot;试用。</span></li></ol><p><strong>常见搭配:</strong></p><p>canary test / canary release / canary deployment / canary build —— 都是&quot;先小范围/先跑一个代表性用例来提前预警&quot;的意思。</p>", "level": "B2"}, {"anchor": "spent", "title": "spent(用完了/耗尽了 义)", "ipa": "/spent/", "pos": "adj.(动词 spend 的过去分词转化)", "cefr": "B2", "gloss": "释义: 表示\"用尽、耗尽\",不一定是钱——可以是体力、精力,也可以引申指配额等资源被用光。", "html": "<p><strong>释义:</strong> 表示&quot;用尽、耗尽&quot;,不一定是钱——可以是体力、精力,也可以引申指配额等资源被用光。</p><p><strong>例句:</strong></p><ol class=\"ex\"><li><span class=\"en\">My daily API quota is spent, so requests are being rejected until it resets tomorrow.</span><span class=\"zh\">我今天的 API 额度已经用完了,所以请求会被拒绝,得等明天重置。</span></li><li><span class=\"en\">He was completely spent after the marathon and could barely walk.</span><span class=\"zh\">跑完马拉松后他整个人都被耗尽了,几乎走不动路。(这里指&quot;体力耗尽&quot;)</span></li></ol><p><strong>使用频率与语域说明(按语域区分,而非&quot;地道 vs 不地道&quot;):</strong></p><ul><li><strong>人的体力/精力耗尽</strong>(例句2)—— ✅ 地道高频,不限语域,任何场合都适用。</li><li><strong>配额/资源用完</strong>(例句1)<strong>用在口语/对话式书面语境</strong>(聊天、Slack、AI 助手的对话式回复)—— ✅ 完全地道自然,quota/credits 本身带&quot;钱&quot;的隐喻,spent 类比&quot;花光了&quot;逻辑很顺。</li><li><strong>配额/资源用完</strong>(例句1)<strong>用在正式技术文档/系统报错提示</strong> —— ⚠️ 语法正确、能理解,但不是惯用首选,更常用 exhausted / used up / run out of / rate limit reached。</li></ul><p><strong>一句话结论:</strong> 不是&quot;spent 不地道&quot;,而是&quot;<strong>人的体力耗尽用 spent,放之四海皆准;配额用 spent,在对话语域地道,在正式文档语域不是首选</strong>&quot;。</p><p><strong>常见近义表达(&quot;用完了&quot;),按正式程度排列:</strong></p><ul><li><strong>used up</strong> —— 最口语、最通用。<em>My quota is used up for today.</em></li><li><strong>run out (of sth)</strong> —— 常用短语动词,日常口语。<em>You&#x27;ve run out of quota for today.</em></li><li><strong>exhausted</strong> —— 正式,强调彻底耗尽,技术提示语常见。<em>Your API quota has been exhausted.</em></li><li><strong>depleted</strong>(/dɪˈpliːtɪd/,CEFR C1) —— 更书面,常用于资源/库存/体能。<em>The free tier&#x27;s daily quota has been depleted.</em></li><li><strong>maxed out</strong> —— 口语,强调&quot;用满到上限&quot;。<em>I&#x27;ve maxed out my free requests for the day.</em></li><li><strong>exceeded</strong> —— 注意侧重点不同:强调&quot;超过限额&quot;而非&quot;刚好用完&quot;。<em>You have exceeded your daily quota.</em></li></ul><p><strong>固定搭配:a spent force</strong>(地道习语,英式新闻/体育/政治评论中高频)</p><p><strong>释义:</strong> 曾经强大、但现在已丧失影响力/竞争力的人或群体;&quot;强弩之末,大势已去&quot;。是&quot;spent&quot;(耗尽)在&quot;影响力/实力&quot;层面上的引申,比&quot;quota is spent&quot;这种用法自然、常见得多。</p><p><strong>例句:</strong></p><ol class=\"ex\"><li><span class=\"en\">After several defeats in a row, people are starting to say that the team is a spent force.</span><span class=\"zh\">接连输了好几场之后,大家开始说这支球队已经大势已去了。</span></li><li><span class=\"en\">Once a dominant force in the industry, the company is now widely seen as a spent force.</span><span class=\"zh\">这家公司曾是行业里的主导力量,但现在普遍被认为已经大势已去。</span></li><li><span class=\"en\">Critics say the party is a spent force after losing three elections in a row.</span><span class=\"zh\">评论人士说,这个政党接连输了三次选举后已经彻底失势了。</span></li></ol><p><strong>更克制、更留有余地的替代说法:</strong> &quot;a spent force&quot; 语气偏强、偏绝对(暗示&quot;基本没什么存在感/竞争力了&quot;),如果实际情况没有那么极端,只是&quot;不如从前&quot;、但依然是个有实际业务/存在感的实体,用下面这两种说法更准确:</p><ol class=\"ex\"><li><span class=\"en\">Baidu has lost some of its former momentum compared to its BAT-era dominance.</span><span class=\"zh\">相比 BAT 时代的鼎盛地位,百度确实失去了一些昔日的势头。</span></li><li><span class=\"en\">Baidu is no longer seen as the dominant force it once was.</span><span class=\"zh\">百度不再被视为曾经那样的主导力量了。</span></li></ol><p><strong>另一个更贴切的例子:BroadVision</strong></p><p>BroadVision 曾是互联网泡沫(dot-com bubble)时代最具代表性的明星公司之一——2000 年泡沫顶峰时期市值一度高达 280 多亿美元,创始人是 <strong>Pehong Chen(陈丕宏)</strong>。泡沫破裂后市值几乎归零,虽然公司至今仍存在、仍在做企业软件/AI 相关业务,但早已从行业聚光灯下彻底消失。这是 &quot;a spent force&quot; 更典型的应用场景——一度极其强大,如今几乎不再有任何行业影响力。</p><ol class=\"ex\"><li><span class=\"en\">BroadVision was once a dot-com darling worth billions, but today it&#x27;s widely seen as a spent force in the tech industry.</span><span class=\"zh\">BroadVision 曾是价值数十亿美元的互联网泡沫宠儿,但如今在科技行业里已被普遍视为昨日黄花。</span></li></ol>", "level": "B2"}, {"anchor": "bookkeeping", "title": "bookkeeping", "ipa": "/ˈbʊkˌkiːpɪŋ/", "pos": "n.", "cefr": "B2", "gloss": "义项一:记账、簿记(本义,会计语境)", "html": "<p><strong>义项一:记账、簿记(本义,会计语境)</strong></p><ol class=\"ex\"><li><span class=\"en\">She took a bookkeeping course before starting her own small business.</span><span class=\"zh\">她在开始自己的小生意之前上了一门簿记课程。</span></li></ol><p><strong>义项二:(编程/系统语境引申义)琐碎的状态维护工作</strong></p><ol class=\"ex\"><li><span class=\"en\">The framework handles all the state bookkeeping for you, so you can focus on the actual logic.</span><span class=\"zh\">框架帮你处理了所有状态维护的琐事,你只需要专注于真正的业务逻辑。</span></li><li><span class=\"en\">Manually tracking retry counts and timestamps is just bookkeeping — it shouldn&#x27;t live in your core algorithm.</span><span class=\"zh\">手动追踪重试次数和时间戳只是些维护性的琐事——不应该混在你的核心算法里。</span></li></ol>", "level": "B2"}, {"anchor": "postpone", "title": "postpone", "ipa": "/pəˈspoʊn/", "pos": "v.", "cefr": "B2", "gloss": "释义: 正式、中性的\"推迟\",没有褒贬色彩,书面/口语都常用。", "html": "<p><strong>释义:</strong> 正式、中性的&quot;推迟&quot;,没有褒贬色彩,书面/口语都常用。</p><p><strong>例句:</strong></p><ol class=\"ex\"><li><span class=\"en\">The wedding was postponed due to bad weather.</span><span class=\"zh\">婚礼因为天气不好被推迟了。</span></li><li><span class=\"en\">We&#x27;ve decided to postpone the product launch until next quarter.</span><span class=\"zh\">我们决定把产品发布推迟到下个季度。</span></li></ol>", "level": "B2"}, {"anchor": "stall", "title": "stall", "ipa": "/stɔːl/", "pos": "n. / v.(一词多义,用法很灵活)", "cefr": "B2", "gloss": "义项一:动词 —— 故意拖延、拖时间(常带负面语感,比如为了逃避决定)", "html": "<p><strong>义项一:动词 —— 故意拖延、拖时间(常带负面语感,比如为了逃避决定)</strong></p><ol class=\"ex\"><li><span class=\"en\">He&#x27;s just stalling — he doesn&#x27;t want to give us an answer.</span><span class=\"zh\">他就是在拖延时间——他不想给我们答复。</span></li></ol><p><strong>义项二:动词 —— (发动机/车辆)熄火,失速停转</strong></p><ol class=\"ex\"><li><span class=\"en\">The car stalled at the intersection and wouldn&#x27;t restart.</span><span class=\"zh\">车在路口熄火了,怎么都发动不起来。</span></li><li><span class=\"en\">(航空语境) The plane stalled and lost altitude rapidly.</span><span class=\"zh\">飞机失速,高度急剧下降。</span></li></ol><p><strong>义项三:名词 —— (集市/街边的)摊位,货摊</strong></p><ol class=\"ex\"><li><span class=\"en\">She bought fresh vegetables from a stall at the farmers&#x27; market.</span><span class=\"zh\">她在农贸市场的一个摊位上买了新鲜蔬菜。</span></li></ol><p><strong>义项四:名词 —— (马厩里的)畜栏,单独隔间</strong></p><ol class=\"ex\"><li><span class=\"en\">The horse was kept in a stall next to the barn door.</span><span class=\"zh\">那匹马被养在靠近谷仓门的畜栏里。</span></li></ol><p><strong>义项五:名词(英式,常用复数 stalls)—— 剧院/电影院正厅前排座位</strong></p><ol class=\"ex\"><li><span class=\"en\">We booked seats in the stalls for tonight&#x27;s show.</span><span class=\"zh\">我们订了今晚演出正厅前排的座位。</span></li></ol><p><strong>小结:</strong> 义项一(拖延)和义项二(熄火)是同一个核心意象的延伸——&quot;该往前走的东西,卡住不动了&quot;。</p>", "level": "B2"}, {"anchor": "tinker", "title": "tinker", "ipa": "/ˈtɪŋkər/", "pos": "v. / n.", "cefr": "B2", "gloss": "义项一:动词(最常见,尤其在技术/编程语境)—— 随手摆弄、试验性地修改", "html": "<p><strong>义项一:动词(最常见,尤其在技术/编程语境)—— 随手摆弄、试验性地修改</strong></p><ol class=\"ex\"><li><span class=\"en\">Feel free to tinker with the code and see what happens if you change the temperature parameter.</span><span class=\"zh\">你可以随便摆弄一下代码,看看改变 temperature 参数会发生什么。</span></li><li><span class=\"en\">He spent the weekend tinkering with an old motorcycle in the garage.</span><span class=\"zh\">他周末在车库里摆弄一辆旧摩托车。</span></li></ol><p><strong>义项二:名词(较老/字面义)—— 补锅匠</strong></p><p>(现在很少用字面义,但这是&quot;随手修修补补&quot;这个动词义的历史来源)</p><p><strong>语境笔记:</strong> &quot;Tinker ideas&quot; 常作为教程/课程材料里的小标题,意思是&quot;可以自己动手试一试的想法&quot;——探索性练习建议,不是必须完成的作业。</p>", "level": "B2"}, {"anchor": "rule-out", "title": "rule out / rule sb out", "ipa": "/ruːl aʊt/", "pos": "phrasal verb(可分割,separable)", "cefr": "B2", "gloss": "释义: 排除某种可能性、原因、嫌疑等——注意跟\"把某任务从项目范围里拿掉\"是不同的语义场景,后者应该用 exclude...from / out of scope。", "html": "<p><strong>释义:</strong> 排除某种可能性、原因、嫌疑等——注意跟&quot;把某任务从项目范围里拿掉&quot;是不同的语义场景,后者应该用 exclude...from / out of scope。</p><p><strong>例句(宾语为名词,两种语序均可):</strong></p><ol class=\"ex\"><li><span class=\"en\">Doctors ran several tests to rule out a heart condition.</span><span class=\"zh\">医生做了几项检查,以排除心脏方面的问题。</span></li><li><span class=\"en\">We can&#x27;t rule out the possibility that the bug is caused by a race condition.</span><span class=\"zh\">我们不能排除这个 bug 是由竞态条件导致的可能性。</span></li><li><span class=\"en\">The investigators ruled the initial suspect out early in the case.</span><span class=\"zh\">调查人员在案件早期就排除了最初的嫌疑人。</span></li></ol><p><strong>语法重点:宾语为代词时,必须拆开夹在中间</strong></p><ul><li>✅ rule him / her / it / them out</li><li>❌ rule out him / her / it / them</li></ul><ol class=\"ex\"><li><span class=\"en\">We ruled him out as a suspect once his alibi checked out.</span><span class=\"zh\">一旦他的不在场证明被核实,我们就排除了他的嫌疑。</span></li><li><span class=\"en\">She had a solid alibi, so the police ruled her out quickly.</span><span class=\"zh\">她有确凿的不在场证明,所以警方很快就排除了她的嫌疑。</span></li></ol><p><strong>易错点笔记(来自真实错误案例):</strong></p><ul><li>❌ <em>The police has ruled out him from the suspects given the evidence he was not at the crime scene.</em></li><li>✅ <em>The police have ruled him out as a suspect, given the evidence that he was not at the crime scene.</em></li></ul><p>错误点拆解:</p><ol class=\"ex\"><li><span class=\"en\">police 是集合名词,谓语恒用复数 → have,不是 has</span></li><li><span class=\"en\">代词宾语必须拆开 → ruled him out,不是 ruled out him</span></li><li><span class=\"en\">不用 &quot;rule out ... from the suspects&quot; → 自然说法是 &quot;rule sb out as a suspect&quot; 或 &quot;rule sb out of the suspect list&quot;</span></li><li><span class=\"en\">evidence 后接同位语从句需要 that → evidence that he was not at the crime scene</span></li></ol>", "level": "B2"}, {"anchor": "unstoppable-irresistible-inexorable", "title": "unstoppable / irresistible / inexorable(对应中文\"势不可挡\")", "ipa": "/ʌnˈstɒpəbl/", "pos": "", "cefr": "B2", "gloss": "unstoppable", "html": "<p><strong>unstoppable</strong></p><ul><li>语感:最常用、最直接,口语书面都适用。</li></ul><p><strong>irresistible</strong></p><ul><li>语感:强调&quot;让人无法抗拒&quot;,常搭配 force/trend。</li></ul><p><strong>inexorable</strong></p><ul><li>语感:更书面/文学化,强调&quot;不可逆转、必然如此&quot;,常见于严肃议题(如历史趋势)。</li></ul><p><strong>例句(翻译&quot;鉴于 AI 编程时代势不可挡地来了,我们需要学会如何构建 AI 智能体&quot;):</strong></p><ol class=\"ex\"><li><span class=\"en\">Given that the era of AI-driven programming is arriving unstoppably, we need to learn how to build AI agents.</span><span class=\"zh\">鉴于 AI 编程时代势不可挡地来了,我们需要学会如何构建 AI 智能体。</span></li><li><span class=\"en\">With the AI programming era coming on with unstoppable momentum, we need to learn how to build AI agents.</span><span class=\"zh\">随着 AI 编程时代以不可阻挡的势头到来,我们需要学会如何构建 AI 智能体。</span></li><li><span class=\"en\">Given the inexorable rise of AI-driven programming, we need to learn how to build AI agents.</span><span class=\"zh\">鉴于 AI 编程势不可挡的崛起,我们需要学会如何构建 AI 智能体。(更书面、更有分量感)</span></li></ol>", "level": "B2"}, {"anchor": "chrome", "title": "chrome", "ipa": "/kroʊm/", "pos": "n.", "cefr": "B2(金属义);UI 义属于技术行话,不特别分级", "gloss": "义项一:金属光泽镀层(本义,日常最常见)", "html": "<p><strong>义项一:金属光泽镀层(本义,日常最常见)</strong></p><ol class=\"ex\"><li><span class=\"en\">The old motorcycle&#x27;s chrome exhaust pipe was gleaming in the sun.</span><span class=\"zh\">那辆老摩托车镀铬的排气管在阳光下闪闪发亮。</span></li><li><span class=\"en\">He polished the chrome fixtures in the bathroom until they sparkled.</span><span class=\"zh\">他把浴室里镀铬的五金件擦得锃亮。</span></li></ol><p><strong>义项二:UI/软件语境 —— 界面的框架性/装饰性元素(标题栏、边框、工具栏等),与核心内容相对(Google Chrome 浏览器命名即来源于此)</strong></p><ol class=\"ex\"><li><span class=\"en\">The design team stripped away most of the browser chrome to make the reading experience feel more immersive.</span><span class=\"zh\">设计团队去掉了大部分浏览器的界面框架元素,让阅读体验更沉浸式。</span></li><li><span class=\"en\">Before automating the flow, we need to recon the dialog chrome — its buttons, title bar, and layout.</span><span class=\"zh\">在自动化这个流程之前,我们需要先摸查一下这个对话框的界面框架——按钮、标题栏和布局。</span></li></ol>", "level": "B2"}, {"anchor": "stand", "title": "stand(stands ready / still stands 义)", "ipa": "/stænd/", "pos": "v.(引申义,不是\"站立\"的字面义)", "cefr": "B2/C1(此引申用法)", "gloss": "释义: 表示\"保持在某个特定、稳定的状态里\"——已经准备就绪(stand ready),或依然有效、没有被撤销或改变(still stands)。", "html": "<p><strong>释义:</strong> 表示&quot;<strong>保持在某个特定、稳定的状态里</strong>&quot;——已经准备就绪(stand ready),或依然有效、没有被撤销或改变(still stands)。</p><p><strong>例句:</strong></p><ol class=\"ex\"><li><span class=\"en\">The signed-curl check from earlier stands ready when you want it.</span><span class=\"zh\">之前准备好的那个 signed-curl 检查随时待命,你需要的时候可以直接用。</span></li><li><span class=\"en\">My offer still stands — let me know if you change your mind.</span><span class=\"zh\">我的提议依然有效——如果你改主意了告诉我一声。</span></li><li><span class=\"en\">The verdict stands, despite the appeal.</span><span class=\"zh\">尽管有上诉,判决依然维持不变。</span></li></ol>", "level": "B2"}, {"anchor": "assorted", "title": "assorted", "ipa": "/əˈsɔːrtɪd/", "pos": "adj.", "cefr": "B2", "gloss": "释义: 各种各样混在一起的、什锦的——通常指同一类物品里,包含不同种类/口味/颜色/尺寸的混合装。", "html": "<p><strong>释义:</strong> 各种各样混在一起的、什锦的——通常指同一类物品里,包含不同种类/口味/颜色/尺寸的混合装。</p><p><strong>例句:</strong></p><ol class=\"ex\"><li><span class=\"en\">She bought a box of assorted chocolates for the party.</span><span class=\"zh\">她给聚会买了一盒什锦巧克力。</span></li><li><span class=\"en\">The store sells shirts in assorted colors and sizes.</span><span class=\"zh\">这家店卖的衬衫有各种颜色和尺码可选。</span></li><li><span class=\"en\">The gift basket contained assorted fruits, nuts, and cheeses.</span><span class=\"zh\">这个礼品篮里装了各种各样的水果、坚果和奶酪。</span></li></ol><p><strong>同源词:</strong></p><ul><li><strong>assort</strong>(动词,现代英语很少单独使用)—— 把……分类、把不同种类的东西归类在一起。日常口语更常用 <strong>sort</strong>(A2/B1,最通用),正式/学术语境用 <strong>classify</strong> 或 <strong>categorize</strong>。</li><li><strong>assortment</strong>(名词)—— 混合物、什锦拼盘,指&quot;这一堆混装的东西&quot;本身。</li></ul><p><em>The bakery offers a wide assortment of pastries.</em></p><p>这家面包店提供各式各样的糕点。</p>", "level": "B2"}, {"anchor": "amateur-mature-immature", "title": "amateur / mature / immature", "ipa": "/ˈæmətər/(英)/ˌæməˈtɜːr/(美)", "pos": "", "cefr": "B2", "gloss": "三个词放一起看很有意思——amateur 和 immature 长得像,容易搞混,但词源完全不相关;immature 和 mature 才是一对真正的反义词。", "html": "<p>三个词放一起看很有意思——<strong>amateur 和 immature 长得像,容易搞混,但词源完全不相关</strong>;<strong>immature 和 mature 才是一对真正的反义词</strong>。</p><p><strong>amateur</strong>(名词/形容词)</p><ul><li>词源:法语,源头是拉丁语 &quot;amator&quot;(热爱者)——&quot;因为热爱而做某事的人&quot;,不是&quot;专业的&quot;。</li></ul><p><strong>释义:</strong> 业余爱好者(名词);业余的、非专业的(形容词,有时带&quot;不够专业、有点生疏&quot;的贬义)。</p><ol class=\"ex\"><li><span class=\"en\">He&#x27;s an amateur photographer who only shoots on weekends.</span><span class=\"zh\">他是个业余摄影爱好者,只在周末拍照。</span></li><li><span class=\"en\">That was a pretty amateur mistake to make in a final interview.</span><span class=\"zh\">在终面里犯这种错误,实在是有点业余/不专业。</span></li></ol><p><strong>mature</strong>(形容词/动词)</p><p><strong>释义:</strong> (人)成熟的、心智发展完全的;(事物)成熟的、发展完全的;(动词)成熟、到期(金融语境:债券到期)。</p><ol class=\"ex\"><li><span class=\"en\">She&#x27;s very mature for her age.</span><span class=\"zh\">以她的年龄来说,她非常成熟。</span></li><li><span class=\"en\">This bond matures in five years.</span><span class=\"zh\">这只债券五年后到期。</span></li></ol><p><strong>immature</strong>(形容词,mature 的反义词)</p><ul><li>词源:im-(否定前缀)+ mature</li></ul><p><strong>释义:</strong> 不成熟的、幼稚的(人的心智),或(生物学上)尚未发育完全的。</p><ol class=\"ex\"><li><span class=\"en\">Stop being so immature about this — it&#x27;s a serious issue.</span><span class=\"zh\">别在这件事上这么幼稚了——这是个严肃的问题。</span></li><li><span class=\"en\">The immature bird hasn&#x27;t developed its full plumage yet.</span><span class=\"zh\">这只未成年的鸟还没长出完整的羽毛。</span></li></ol><p><strong>关键提醒:</strong> 虽然 amateur 和 immature 拼写相似,但<strong>没有词源关系,意思也不对立</strong>——amateur 说的是&quot;是否专业&quot;,immature 说的是&quot;是否成熟&quot;;一个人完全可以&quot;amateur 但 mature&quot;(业余但心智成熟),也可以&quot;专业但 immature&quot;(专业但幼稚)。</p>", "level": "B2"}, {"anchor": "alibi", "title": "alibi", "ipa": "/ˈæləˌbaɪ/", "pos": "n.", "cefr": "B2/C1", "gloss": "义项一(本义,法律/侦探语境):不在场证明", "html": "<ul><li>词源:拉丁语,字面意思是&quot;在别处&quot;</li></ul><p><strong>义项一(本义,法律/侦探语境):不在场证明</strong></p><ol class=\"ex\"><li><span class=\"en\">He had a solid alibi — he was at work when the robbery took place.</span><span class=\"zh\">他有确凿的不在场证明——抢劫案发生的时候他正在上班。</span></li><li><span class=\"en\">We ruled him out as a suspect once his alibi checked out.</span><span class=\"zh\">一旦他的不在场证明被核实,我们就排除了他的嫌疑。</span></li></ol><p><strong>义项二(引申义,日常口语):借口、托词(不一定跟犯罪有关)</strong></p><ol class=\"ex\"><li><span class=\"en\">He came up with an alibi for missing the meeting.</span><span class=\"zh\">他找了个借口来解释自己为什么没参加会议。</span></li></ol>", "level": "B2"}, {"anchor": "safety-net", "title": "safety net", "ipa": "/ˈseɪfti nɛt/", "pos": "n.", "cefr": "B2", "gloss": "义项一:字面义 —— (杂技表演/高空作业时用来防止坠落受伤的)安全网", "html": "<p><strong>义项一:字面义 —— (杂技表演/高空作业时用来防止坠落受伤的)安全网</strong></p><ol class=\"ex\"><li><span class=\"en\">The trapeze artist performed without a safety net.</span><span class=\"zh\">那位空中飞人表演时没有安全网保护。</span></li></ol><p><strong>义项二:引申义(高频)—— 保障机制、后备方案,以防万一出问题时的&quot;兜底&quot;手段</strong></p><ol class=\"ex\"><li><span class=\"en\">Unemployment benefits act as a safety net for people who lose their jobs.</span><span class=\"zh\">失业救济金是失去工作的人的一个保障机制。</span></li><li><span class=\"en\">Once you&#x27;ve posted it and closed the issue, that wraps this one — auto-reopen on any newer-version recurrence is the safety net.</span><span class=\"zh\">一旦你发布并关闭了这个 issue,这一项就算结了——如果新版本里再次出现同样的问题,自动重新打开机制就是兜底的保障。</span></li></ol>", "level": "B2"}, {"anchor": "conversely-vs-on-the-contrary", "title": "conversely vs on the contrary", "ipa": "/kənˈvɜːrsli/", "pos": "", "cefr": "B2", "gloss": "conversely(副词)", "html": "<p><strong>conversely</strong>(副词)</p><ul><li>释义:相反地、反过来说——用来引出一个和前文相对/相反的观点,常用于书面/正式论述里承接对比关系。</li><li>⚠️ 注意拼写:不是 &quot;contravesly&quot;(这不是一个真实存在的词),也别和 <strong>controversially</strong>(有争议地,来自 controversial)搞混。</li></ul><p><strong>on the contrary</strong>(短语)</p><ul><li>释义:恰恰相反——用来直接反驳/否定前面的说法或预设,语气更强,常用于纠正一个错误的看法。</li></ul><p><strong>核心区别在于&quot;是否反驳前面的说法&quot;:</strong></p><ul><li><strong>conversely</strong> —— 呈现一个相关但方向相反的事实/观点,不是在反驳前文,而是从&quot;另一个角度/反过来&quot;补充说明,前后两个说法都成立、不矛盾。</li><li><strong>on the contrary</strong> —— 直接反驳/否定前面的说法或预设,语气更强,常紧跟在否定句后面强化&quot;事实正好相反&quot;。</li></ul><p><strong>例句(conversely):</strong></p><ol class=\"ex\"><li><span class=\"en\">Some students learn best through visual aids; conversely, others prefer hands-on practice.</span><span class=\"zh\">有些学生通过视觉辅助学得最好;反过来,另一些学生更喜欢动手实践。</span></li><li><span class=\"en\">Higher prices tend to reduce demand. Conversely, lower prices often increase it.</span><span class=\"zh\">价格上涨往往会降低需求;反过来,价格下降通常会提高需求。(两句话都对,只是从两个方向说同一个规律)</span></li></ol><p><strong>例句(on the contrary):</strong></p><ol class=\"ex\"><li><span class=\"en\">Some people think this task is easy. On the contrary, it&#x27;s extremely difficult.</span><span class=\"zh\">有人觉得这个任务很简单。恰恰相反,它其实极其困难。(明确否定了前一句的看法)</span></li><li><span class=\"en\">I don&#x27;t think he&#x27;s lazy — on the contrary, he&#x27;s one of the hardest workers I know.</span><span class=\"zh\">我不觉得他懒——恰恰相反,他是我见过最勤奋的人之一。</span></li></ol><p><strong>一句话总结:</strong> conversely 是&quot;反过来看同一个关系&quot;(不否定前文,双向都对);on the contrary 是&quot;正面反驳前面的说法&quot;(前文是错的/被否定的,真相恰恰相反)。</p>", "level": "B2"}, {"anchor": "contraceptive", "title": "contraceptive / contraception", "ipa": "contraceptive /ˌkɒntrəˈsɛptɪv/", "pos": "contraceptive = n./adj.;contraception = n.(抽象概念)", "cefr": "B2", "gloss": "义项一:形容词 —— 避孕的", "html": "<ul><li>词源:contra-(反对、抵抗)+ conception(受孕)+ -ive → 字面就是&quot;抗受孕的&quot;</li></ul><p><strong>义项一:形容词 —— 避孕的</strong></p><ol class=\"ex\"><li><span class=\"en\">She started using contraceptive methods after getting married.</span><span class=\"zh\">她结婚后开始使用避孕方法。</span></li></ol><p><strong>义项二:名词 —— 避孕药具、避孕用品(泛指各种避孕手段/工具)</strong></p><ol class=\"ex\"><li><span class=\"en\">Condoms are one of the most common contraceptives.</span><span class=\"zh\">避孕套是最常见的避孕用品之一。</span></li><li><span class=\"en\">Djerassi&#x27;s team synthesized the first oral contraceptive.</span><span class=\"zh\">Djerassi 的团队合成了第一种口服避孕药。</span></li></ol><p><strong>相关词族:contraception(名词)—— 避孕(这件事本身,抽象概念)</strong></p><ol class=\"ex\"><li><span class=\"en\">Contraception has significantly impacted family planning worldwide.</span><span class=\"zh\">避孕手段极大地影响了全球的计划生育。</span></li></ol>", "level": "B2"}, {"anchor": "etiquette", "title": "etiquette", "ipa": "英 /ˈetɪket/ 美 /ˈetɪkət/", "pos": "n.", "cefr": "B2", "gloss": "礼仪、礼节——在特定社交/职场/文化场合中约定俗成的得体行为规范,不是法律强制,而是\"大家都这么做才显得有教养/专业\"的潜规则。", "html": "<p><strong>含义:</strong> 礼仪、礼节——在特定社交/职场/文化场合中约定俗成的得体行为规范,不是法律强制,而是&quot;大家都这么做才显得有教养/专业&quot;的潜规则。</p><ol class=\"ex\"><li><span class=\"en\">It&#x27;s considered good etiquette to arrive on time for a meeting.</span><span class=\"zh\">准时参加会议被认为是一种良好的礼仪。</span></li><li><span class=\"en\">There&#x27;s a certain etiquette around replying to emails promptly.</span><span class=\"zh\">及时回复邮件是有一定的礼仪规范的。</span></li><li><span class=\"en\">Cutting in line is a serious breach of etiquette.</span><span class=\"zh\">插队是严重违反礼仪的行为。</span></li></ol><p><strong>常见搭配:</strong> business etiquette(商务礼仪)、email/phone etiquette(邮件/电话礼仪)、social etiquette(社交礼仪)、dining etiquette(餐桌礼仪)、a breach of etiquette(违反礼仪的行为)。</p><p><strong>小提示:</strong> 拼写容易出错(尾音是 -quette,不是 -quet),而且是不可数名词,不能说 &quot;an etiquette&quot; 或 &quot;etiquettes&quot;。</p>", "level": "B2"}, {"anchor": "implication-vs-indication", "title": "implication vs indication + profound 搭配", "ipa": "implication 英 /ˌɪmplɪˈkeɪʃn/ 美 /ˌɪmplɪˈkeɪʃn/;indication 英 /ˌɪndɪˈkeɪʃn/ 美 /ˌɪndɪˈkeɪʃn/", "pos": "n.", "cefr": "B2", "gloss": "辨析:", "html": "<p><strong>English definition:</strong></p><ul><li><strong>implication</strong> — a conclusion or consequence that follows from something, though not stated directly.</li><li><strong>indication</strong> — a sign or piece of evidence suggesting that something is true or likely to happen.</li></ul><p><strong>辨析:</strong></p><ul><li><strong>implication</strong> —— <strong>深层含义、(引申出的)影响</strong>:某件事<strong>推导出来的结论或后果</strong>。The discovery has profound implications for how we treat the disease.(这一发现对我们治疗该疾病的方式有深远的影响。)</li><li><strong>indication</strong> —— <strong>迹象、征兆</strong>:表明某事可能为真或即将发生的<strong>信号</strong>。There are indications that the economy is recovering.(有迹象表明经济正在复苏。)</li></ul><p><strong>例句:</strong></p><ol class=\"ex\"><li><span class=\"en\">This is a simple exercise, but the implications are profound.</span><span class=\"zh\">这只是一个简单的练习,但它带来的启示/影响却非常深远。</span></li><li><span class=\"en\">There was no indication that the server was about to crash.</span><span class=\"zh\">当时没有任何迹象表明服务器即将崩溃。</span></li></ol><p><strong>常见搭配:</strong></p><ul><li><strong>profound</strong> 只配 implications,不配 indications —— profound 描述&quot;影响/意义的深度&quot;,而 indication 只是一个信号,信号用 strong/clear/early 来形容。</li><li>profound <strong>implications</strong>(深远的影响)、profound <strong>impact/effect</strong>(深刻的影响)、profound <strong>change</strong>(深刻的变革)、profound <strong>insight</strong>(深刻的洞见)。</li><li>a clear / strong / early <strong>indication</strong>(明显的/强烈的/早期的迹象)。</li></ul>", "level": "B2"}, {"anchor": "tilt-bias", "title": "tilt / tilted / bias / biased(倾斜与偏向家族)", "ipa": "tilt /tɪlt/;tilted /ˈtɪltɪd/;bias /ˈbaɪəs/;biased /ˈbaɪəst/", "pos": "tilt(v./n.)、tilted(adj.)、bias(n./v.)、biased(adj.)", "cefr": "均为 B2", "gloss": "① tilt / tilted —— 隐喻来自\"平面歪了\"", "html": "<p><strong>English definition:</strong></p><ul><li><strong>tilt</strong> — to (cause to) move into a sloping position; figuratively, to shift an advantage toward one side.</li><li><strong>tilted</strong> — sloping to one side rather than level; figuratively, weighted in favor of (or against) one side.</li><li><strong>bias</strong> — an inclination or prejudice for or against one person or group, especially in a way considered unfair; in statistics/ML, a systematic deviation from the true value.</li><li><strong>biased</strong> — unfairly prejudiced for or against someone or something; (of data or a sample) not representative.</li></ul><p>---</p><p><strong>① tilt / tilted —— 隐喻来自&quot;平面歪了&quot;</strong></p><p><strong>义项一(字面):倾斜、歪斜</strong></p><ol class=\"ex\"><li><span class=\"en\">The picture on the wall is slightly tilted.</span><span class=\"zh\">墙上那幅画有点歪。</span></li><li><span class=\"en\">She tilted her head to one side and listened.</span><span class=\"zh\">她把头歪向一边听着。</span></li></ol><p><strong>义项二(引申):(制度、环境)偏向某一方、不公平地倾斜</strong></p><ol class=\"ex\"><li><span class=\"en\">The tax system is tilted in favor of the wealthy.</span><span class=\"zh\">这套税收制度偏向富人。</span></li><li><span class=\"en\">The playing field is tilted against small businesses.</span><span class=\"zh\">这个竞争环境对小企业不利。</span></li></ol><p><strong>义项三(游戏/扑克俚语):上头、情绪失控</strong></p><ol class=\"ex\"><li><span class=\"en\">He got tilted after losing three games in a row.</span><span class=\"zh\">他连输三局之后就上头了。(原始说法是 <strong>on tilt</strong>,源自扑克,现在电竞圈很常见)</span></li></ol><p>---</p><p><strong>② bias / biased —— 核心是&quot;系统性的偏向&quot;</strong></p><p><strong>义项一(日常义):偏见、成见</strong></p><ol class=\"ex\"><li><span class=\"en\">The report showed a clear bias against younger applicants.</span><span class=\"zh\">这份报告对年轻求职者有明显的偏见。</span></li><li><span class=\"en\">I might be biased, since he&#x27;s a friend of mine.</span><span class=\"zh\">我的看法可能有偏向,因为他是我朋友。</span></li></ol><p><strong>义项二(统计/机器学习):系统性偏差;样本不具代表性</strong></p><ol class=\"ex\"><li><span class=\"en\">The training data was biased toward English-language sources.</span><span class=\"zh\">训练数据过度偏向英文语料。</span></li><li><span class=\"en\">Sampling bias makes the survey results unreliable.</span><span class=\"zh\">抽样偏差让这份调查结果不可靠。</span></li></ol><p><strong>义项三(神经网络专有术语,中性无贬义):偏置项</strong></p><ul><li><strong>bias term / bias unit</strong> —— 神经网络里那个加在加权和之后的常数项,译作&quot;偏置&quot;,和&quot;偏见&quot;完全无关,纯技术含义。</li><li><strong>bias-variance tradeoff</strong> —— 偏差-方差权衡,机器学习核心概念之一。</li></ul><p>---</p><p><strong>⚠️ 辨析:tilted vs biased</strong></p><ul><li><strong>tilted</strong> —— 隐喻是<strong>空间上的&quot;平面歪了&quot;</strong>,通常用来形容<strong>制度、环境、局势</strong>向某方倾斜,搭配 in favor of / against;<strong>一般不直接形容人</strong>(不说 &quot;he is tilted&quot; 表示他有偏见)。</li><li><strong>biased</strong> —— 核心是<strong>判断/数据的系统性偏向</strong>,<strong>可以直接形容人</strong>(&quot;I might be biased&quot;)、也可以形容数据、算法、样本、报道。</li></ul><p><strong>倾斜家族的语气强度排序(从中性描述到强烈指控):</strong></p><ul><li><strong>tilted / skewed / biased</strong> —— 中性描述&quot;存在偏向&quot;,不一定暗示有人故意为之</li><li><strong>stacked</strong> —— 暗示&quot;牌局被人事先做了手脚&quot;(来自习语 the deck is stacked)</li><li><strong>rigged</strong> —— 语气最强,明确指控&quot;被暗中操纵&quot;,常见于政治批评(a rigged election)</li></ul><p><strong>常见搭配:</strong></p><ul><li>tilt/skew <strong>in favor of</strong> sb、tilt <strong>against</strong> sb</li><li><strong>tilt the balance/scales</strong>(改变局势):This new evidence could tilt the balance in our favor.</li><li>a <strong>level</strong> playing field(公平竞争环境)⟷ a <strong>tilted</strong> playing field</li><li><strong>bias toward/against</strong> sb/sth、<strong>unconscious bias</strong>(无意识偏见)、<strong>confirmation bias</strong>(确认偏误)、<strong>sampling bias</strong>(抽样偏差)</li></ul><p><strong>拼写提示:</strong> biased 标准拼法是<strong>一个 s</strong>;英式偶见 biassed,但已非主流。</p>", "level": "B2"}]}, {"level": "C1", "items": [{"anchor": "intermittent-outage", "title": "intermittent outage", "ipa": "英 /ˌɪntəˈmɪtənt/ 美 /ˌɪntərˈmɪtənt/", "pos": "", "cefr": "C1", "gloss": "intermittent(adj.)", "html": "<p><strong>intermittent</strong>(adj.)</p><ul><li>含义:间歇的、断断续续的——强调<strong>反复发生、不连续</strong>。</li></ul><p><strong>outage</strong>(n.)</p><ul><li>含义:(服务、电力等的)中断、停机,不分长短、不分次数。</li></ul><p><strong>整体释义:</strong> intermittent outage = 间歇性中断/时断时续的宕机——服务器不是持续挂掉,而是反复地、一阵一阵地不可访问。</p><p><strong>近义表达对比(都可表示&quot;短时间不可访问&quot;,但侧重点不同):</strong></p><ul><li><strong>intermittent</strong> —— 强调<strong>反复、多次</strong>断断续续(断了又好、好了又断)。</li><li><strong>transient</strong> —— 强调<strong>短暂、一过性</strong>,通常指<strong>一次性</strong>的短暂中断,过去就恢复正常,不强调反复。</li><li><strong>sporadic</strong> —— 强调<strong>偶发、不规律</strong>,出现时间点没有规律,不一定像 intermittent 那样高频往返。</li><li><strong>brief / momentary</strong> —— 单纯强调<strong>持续时间短</strong>,不涉及是否反复。</li><li><strong>temporary</strong> —— 最中性,只强调&quot;不是永久的、会恢复&quot;,没有&quot;短&quot;或&quot;反复&quot;的强含义。</li></ul><p><strong>例句:表达&quot;刚才跑测试用例时服务器挂了&quot;</strong></p><ol class=\"ex\"><li><span class=\"en\">The server was briefly down while I was running the test cases just now.</span><span class=\"zh\">刚才跑测试用例的时候,服务器有那么一小会儿挂了。(一次性、很快恢复)</span></li><li><span class=\"en\">We hit a transient outage on the server during the test run.</span><span class=\"zh\">我们在跑测试的过程中遇到了一次服务器的短暂中断。(一次性、书面一些)</span></li><li><span class=\"en\">The server went down intermittently while the tests were running, so a couple of runs failed.</span><span class=\"zh\">跑测试的过程中服务器断断续续地挂了几次,所以有几次运行失败了。(强调反复多次)</span></li><li><span class=\"en\">The server was temporarily unreachable during the test run, which caused some failures.</span><span class=\"zh\">跑测试期间服务器暂时无法访问,导致了一些用例失败。(中性、不强调次数)</span></li><li><span class=\"en\">There was a brief service interruption on the server just now while the test cases were executing.</span><span class=\"zh\">刚才测试用例执行的时候,服务器出现了一次短暂的服务中断。(较正式)</span></li></ol>", "level": "C1"}, {"anchor": "tank", "title": "tank", "ipa": "/tæŋk/", "pos": "v.(由名词\"坦克/水箱\"引申而来的动词用法)", "cefr": "C1(动词的\"暴跌/搞砸\"义,口语/非正式)", "gloss": "义项一:名词本义 —— 坦克;(储水/储油等的)大容器", "html": "<p><strong>义项一:名词本义 —— 坦克;(储水/储油等的)大容器</strong></p><p>(此处不展开例句,重点在下面的动词引申义)</p><p><strong>义项二:动词引申义 —— (口语)急剧下跌、彻底失败、搞砸</strong></p><ol class=\"ex\"><li><span class=\"en\">The stock tanked after the earnings report came out.</span><span class=\"zh\">财报公布后,股价暴跌。</span></li><li><span class=\"en\">His performance tanked in the second half of the season.</span><span class=\"zh\">他在赛季下半程的表现直线下滑、彻底崩了。</span></li><li><span class=\"en\">Renaming get_weather to func1 with no description would tank tool usage.</span><span class=\"zh\">把 get_weather 改名成没有描述的 func1,会导致工具的调用率暴跌。</span></li></ol>", "level": "C1"}, {"anchor": "defer", "title": "defer", "ipa": "/dɪˈfɜːr/", "pos": "v.", "cefr": "C1", "gloss": "义项一:推迟(制度化/官方场景,如税务、入学、判决)", "html": "<p><strong>义项一:推迟(制度化/官方场景,如税务、入学、判决)</strong></p><ol class=\"ex\"><li><span class=\"en\">Students can defer their admission to the following academic year.</span><span class=\"zh\">学生可以把入学时间推迟到下一学年。</span></li><li><span class=\"en\">The company deferred the tax payment to the next fiscal quarter.</span><span class=\"zh\">公司把税款缴纳推迟到了下一个财季。</span></li></ol><p><strong>义项二:defer to (sb/sth) = 听从、遵从(某人的意见/权威)—— 与&quot;推迟&quot;完全无关,勿混淆</strong></p><ol class=\"ex\"><li><span class=\"en\">I&#x27;ll defer to your judgment on this — you know the client better than I do.</span><span class=\"zh\">这件事我听你的——你比我更了解这个客户。</span></li></ol>", "level": "C1"}, {"anchor": "recon", "title": "recon", "ipa": "/ˈriːkɒn/", "pos": "n. / v.(reconnaissance 的非正式缩写)", "cefr": "非正式缩略语;完整形式 reconnaissance 约 C1/C2", "gloss": "释义: 本义是军事上的\"侦察\"——先摸清敌情/地形再行动。技术/测试语境里引申为先探查、摸清情况,在正式动手写代码/测试用例之前,先了解目标对象(比如 UI、系统)的实际结构。", "html": "<p><strong>释义:</strong> 本义是军事上的&quot;侦察&quot;——先摸清敌情/地形再行动。技术/测试语境里引申为<strong>先探查、摸清情况</strong>,在正式动手写代码/测试用例之前,先了解目标对象(比如 UI、系统)的实际结构。</p><p><strong>例句:</strong></p><ol class=\"ex\"><li><span class=\"en\">Before writing the automation script, let&#x27;s recon the app&#x27;s login flow manually to understand all the edge cases.</span><span class=\"zh\">在写自动化脚本之前,我们先手动探查一下 App 的登录流程,搞清楚所有的边界情况。</span></li><li><span class=\"en\">The team did a quick recon of the competitor&#x27;s product before starting the redesign.</span><span class=\"zh\">团队在开始重新设计之前,先快速调研了一下竞品。</span></li><li><span class=\"en\">Then recon the dialog chrome on-device before writing the test steps.</span><span class=\"zh\">然后在真机上摸查一下这个对话框的界面结构,再写测试步骤。</span></li></ol>", "level": "C1"}, {"anchor": "coalesce", "title": "coalesce", "ipa": "/ˌkoʊəˈlɛs/", "pos": "v.", "cefr": "C1", "gloss": "释义: (若干分散的部分)融合、汇聚成一个整体——可以是具体的物质,也可以是抽象的想法/群体/意见。", "html": "<p><strong>释义:</strong> (若干分散的部分)融合、汇聚成一个整体——可以是具体的物质,也可以是抽象的想法/群体/意见。</p><p><strong>义项一:字面义 —— (液体、颗粒等物质)融合、凝聚在一起</strong></p><ol class=\"ex\"><li><span class=\"en\">The small droplets of oil coalesced into a single large blob on the water&#x27;s surface.</span><span class=\"zh\">水面上那些小油滴渐渐融合成了一大团。</span></li></ol><p><strong>义项二:引申义 —— (想法、团体、意见等)汇聚、形成一致</strong></p><ol class=\"ex\"><li><span class=\"en\">Over the course of the meeting, everyone&#x27;s ideas began to coalesce into a clear plan.</span><span class=\"zh\">会议过程中,大家的想法逐渐汇聚成了一个清晰的计划。</span></li><li><span class=\"en\">The various protest groups eventually coalesced into a single unified movement.</span><span class=\"zh\">各个抗议团体最终汇聚成了一个统一的运动。</span></li></ol>", "level": "C1"}, {"anchor": "endowed-with", "title": "endow / endowed with", "ipa": "endow /ɪnˈdaʊ/", "pos": "endow = v.;endowed with = 形容词短语(endow 的被动分词形式)", "cefr": "C1", "gloss": "释义: 天生具备(某种才能、特质、能力),或被赋予(某种资源/特权)——强调这种特质是\"与生俱来的\"或\"被授予的\",不是后天努力获得的。", "html": "<p><strong>释义:</strong> 天生具备(某种才能、特质、能力),或被赋予(某种资源/特权)——强调这种特质是&quot;与生俱来的&quot;或&quot;被授予的&quot;,不是后天努力获得的。</p><p><strong>例句:</strong></p><ol class=\"ex\"><li><span class=\"en\">Humans are endowed with the capacity for reason.</span><span class=\"zh\">人类天生被赋予了理性思考的能力。</span></li><li><span class=\"en\">She was endowed with a remarkable talent for music from a young age.</span><span class=\"zh\">她从小就展现出非凡的音乐天赋。</span></li><li><span class=\"en\">The university was endowed with a large sum of money by a wealthy alumnus.</span><span class=\"zh\">一位富有的校友向这所大学捐赠了一大笔资金。(这里是&quot;资金被捐赠给机构&quot;的用法)</span></li></ol><p><strong>完整搭配结构:endow sb/sth with sth —— 赋予某人/某物某种特质或资源</strong></p><ol class=\"ex\"><li><span class=\"en\">Nature has endowed this region with abundant natural resources.</span><span class=\"zh\">大自然赋予了这个地区丰富的自然资源。</span></li></ol>", "level": "C1"}, {"anchor": "supersede", "title": "supersede / superseded", "ipa": "/ˌsuːpərˈsiːd/", "pos": "v.(superseded 是过去式/过去分词)", "cefr": "C1", "gloss": "释义: 取代、替代(通常因为新的东西更先进/更新/更权威,旧的因此被淘汰、不再适用)。", "html": "<p><strong>释义:</strong> 取代、替代(通常因为新的东西更先进/更新/更权威,旧的因此被淘汰、不再适用)。</p><p><strong>例句:</strong></p><ol class=\"ex\"><li><span class=\"en\">This policy supersedes all previous versions.</span><span class=\"zh\">本政策取代之前所有版本。</span></li><li><span class=\"en\">The old API has been superseded by a newer, more efficient one.</span><span class=\"zh\">旧的 API 已经被一个更新、更高效的版本取代了。</span></li><li><span class=\"en\">Steam engines were eventually superseded by diesel and electric ones.</span><span class=\"zh\">蒸汽机最终被柴油机和电动机所取代。</span></li></ol><p><strong>常见搭配:be superseded by sth —— 被……取代(几乎总是被动语态使用)</strong></p><p><strong>语感提示:</strong> supersede 强调&quot;旧的因为过时/不再适用而被新的正式取代&quot;,语气偏正式、书面,常见于法律条文、技术文档、学术/历史语境;比 replace(最通用的&quot;替换&quot;)更强调&quot;旧的已经失效、新的具有权威性/优先性&quot;这层含义。</p>", "level": "C1"}, {"anchor": "practitioner", "title": "practitioner", "ipa": "英 /prækˈtɪʃənə(r)/ 美 /prækˈtɪʃənər/", "pos": "n.", "cefr": "C1", "gloss": "从业者、执业者——指在某个专业领域(尤其是医学、法律,或需要专门技能的行业)实际从事该职业的人,强调\"实践操作者\"而非\"理论研究者\"。", "html": "<p><strong>English definition:</strong> A person who practices a particular profession, especially medicine, law, or another skilled occupation — someone who actively does the work, as opposed to someone who only studies or teaches it.</p><p><strong>含义:</strong> 从业者、执业者——指在某个专业领域(尤其是医学、法律,或需要专门技能的行业)实际从事该职业的人,强调&quot;实践操作者&quot;而非&quot;理论研究者&quot;。</p><ol class=\"ex\"><li><span class=\"en\">She&#x27;s a general practitioner at a local clinic.</span><span class=\"zh\">她是当地一家诊所的全科医生。</span></li><li><span class=\"en\">He&#x27;s a longtime practitioner of traditional Chinese medicine.</span><span class=\"zh\">他是一位长期从事中医的从业者。</span></li><li><span class=\"en\">As a practitioner in this field, I can tell you this approach actually works.</span><span class=\"zh\">作为这个领域的一名从业者,我可以告诉你这个方法确实有效。</span></li></ol><p><strong>常见搭配:</strong> general practitioner(GP,全科医生)、legal practitioner(执业律师)、healthcare practitioner(医疗从业者)、a practitioner of X(X 领域/技艺的从业者)。</p><p><strong>辨析:</strong> practitioner 强调&quot;实际操作、在一线执业&quot;的人,和 theorist(理论家)、academic(学者)形成对比。</p>", "level": "C1"}, {"anchor": "deprioritize", "title": "deprioritize", "ipa": "英 /ˌdiːpraɪˈɒrətaɪz/ 美 /ˌdiːpraɪˈɔːrətaɪz/", "pos": "v.", "cefr": "C1", "gloss": "降低……的优先级、把……往后排——指某件事仍然在计划内,只是重要性/紧急度被调低了,不等于取消或搁置。", "html": "<p><strong>English definition:</strong> To treat something as less important than before; to move it lower down a list of priorities.</p><p><strong>含义:</strong> 降低……的优先级、把……往后排——指某件事<strong>仍然在计划内,只是重要性/紧急度被调低了</strong>,不等于取消或搁置。</p><ol class=\"ex\"><li><span class=\"en\">We&#x27;ve decided to deprioritize this feature until next quarter.</span><span class=\"zh\">我们决定把这个功能的优先级降低,推到下个季度再说。</span></li><li><span class=\"en\">The team deprioritized the redesign to focus on bug fixes.</span><span class=\"zh\">团队降低了改版的优先级,以便集中精力修复 bug。</span></li><li><span class=\"en\">Customer support requests should never be deprioritized.</span><span class=\"zh\">客户支持请求绝不应该被降低优先级。</span></li></ol><p><strong>常见搭配:</strong> deprioritize a task / a feature / a project;被动式 be deprioritized 也很常用。</p><p><strong>拼写提示:</strong> 英式拼写是 deprioritise(-ise 结尾);带连字符的 de-prioritize 现在已不常见,主流写法是连写。</p><p><strong>反义词:</strong> prioritize(优先处理、排优先级)。</p><p><strong>辨析:</strong> deprioritize 只是把重要性调低,任务还在队列里;而 put on hold / shelve 是&quot;暂时停掉不做了&quot;(见 <em>推迟/暂缓家族速查</em> 对比)。</p>", "level": "C1"}, {"anchor": "denote", "title": "denote(vs connote)", "ipa": "英 /dɪˈnəʊt/ 美 /dɪˈnoʊt/", "pos": "v.", "cefr": "C1", "gloss": "表示、指代、记作——尤其常用于\"某个符号/记号代表某个含义\"的技术、数学、学术语境。", "html": "<p><strong>English definition:</strong> To be a sign, symbol, or name for something; to stand for or indicate something.</p><p><strong>含义:</strong> 表示、指代、记作——尤其常用于&quot;<strong>某个符号/记号代表某个含义</strong>&quot;的技术、数学、学术语境。</p><ol class=\"ex\"><li><span class=\"en\">In this paper, the learning rate is denoted by α.</span><span class=\"zh\">在本文中,学习率用 α 表示。</span></li><li><span class=\"en\">Let n denote the number of training samples.</span><span class=\"zh\">设 n 表示训练样本的数量。</span></li><li><span class=\"en\">A dotted line denotes an optional dependency.</span><span class=\"zh\">虚线表示可选的依赖关系。</span></li></ol><p><strong>常见搭配(学术写作高频句式,可直接套用):</strong></p><ul><li><strong>Let X denote ...</strong> —— &quot;设 X 表示……&quot;(论文里引入记号的标准开场白)</li><li><strong>be denoted by / as ...</strong> —— &quot;用……表示&quot;(被动式,最常见)</li><li><strong>X denotes ...</strong> —— &quot;X 表示……&quot;</li></ul><p><strong>⚠️ 辨析:denote vs connote</strong></p><ul><li><strong>denote</strong> —— 字面指代、明确表示(denotation = 外延义/字面义)</li><li><strong>connote</strong> —— 隐含暗示、引发联想(connotation = 内涵义/联想义)</li><li>例:The word &quot;home&quot; <strong>denotes</strong> a place where someone lives, but it <strong>connotes</strong> warmth and belonging.</li></ul><p>&quot;home&quot; 这个词字面指代一个人居住的地方,但它隐含着温暖和归属感的联想。</p><p><strong>一句话总结:</strong> denote 是&quot;这个符号/词明确代表什么&quot;,客观的指代关系;connote 是&quot;这个词让人联想到什么&quot;,主观的情感色彩。技术写作里大量遇到 denote,几乎不会遇到 connote。</p>", "level": "C1"}]}, {"level": "C2", "items": [{"anchor": "orthogonal", "title": "orthogonal", "ipa": "英 /ɔːˈθɒɡənəl/ 美 /ɔːrˈθɑːɡənəl/", "pos": "adj.", "cefr": "C2", "gloss": "义项一:数学/几何 —— 正交的、成直角的", "html": "<p><strong>义项一:数学/几何 —— 正交的、成直角的</strong></p><ol class=\"ex\"><li><span class=\"en\">In a Cartesian coordinate system, the x-axis and y-axis are orthogonal to each other.</span><span class=\"zh\">在笛卡尔坐标系中,x 轴和 y 轴互相垂直。</span></li><li><span class=\"en\">These two vectors are orthogonal, so their dot product is zero.</span><span class=\"zh\">这两个向量是正交的,所以它们的点积为零。</span></li></ol><p><strong>义项二:逻辑/工程 —— 相互独立、互不影响</strong></p><ol class=\"ex\"><li><span class=\"en\">We designed the caching layer to be orthogonal to the authentication logic, so changing one doesn&#x27;t break the other.</span><span class=\"zh\">我们把缓存层设计得和身份验证逻辑相互独立,改一个不会影响另一个。</span></li><li><span class=\"en\">Performance and readability are largely orthogonal concerns in this codebase.</span><span class=\"zh\">在这个代码库里,性能和可读性在很大程度上是两个互不相关的考量维度。</span></li></ol><p><strong>常见搭配:</strong></p><p>orthogonal to (something) —— 最常见的介词搭配,表示&quot;与……正交/无关&quot;。</p>", "level": "C2"}, {"anchor": "held-out", "title": "held-out", "ipa": "/ˌheld ˈaʊt/", "pos": "adj.(源自短语动词 hold out 的过去分词)", "cefr": "C2 / 机器学习专业术语", "gloss": "留出的、预留不用的——机器学习术语,指从数据集里专门划分出来、训练时故意不使用的那部分数据,留着之后用来评估模型在\"没见过的数据\"上的真实表现。", "html": "<p><strong>English definition:</strong> (Of data) deliberately set aside and not used during training, so it can later be used to evaluate how a model performs on examples it has never seen.</p><p><strong>含义:</strong> 留出的、预留不用的——机器学习术语,指从数据集里专门划分出来、<strong>训练时故意不使用</strong>的那部分数据,留着之后用来评估模型在&quot;没见过的数据&quot;上的真实表现。</p><ol class=\"ex\"><li><span class=\"en\">We evaluated the model on a held-out test set.</span><span class=\"zh\">我们在一个留出的测试集上评估了这个模型。</span></li><li><span class=\"en\">The held-out test set had 4,314 samples.</span><span class=\"zh\">这个留出的测试集包含 4,314 个样本。</span></li><li><span class=\"en\">The model performs well on training data but poorly on held-out examples.</span><span class=\"zh\">这个模型在训练数据上表现很好,但在留出的样本上表现很差。</span></li></ol><p><strong>常见搭配:</strong> held-out set / held-out data / held-out test set / held-out validation set。</p><p><strong>连字符规则(容易错):</strong></p><ul><li>放在名词<strong>前面</strong>当形容词用 → <strong>要加连字符</strong>:a <strong>held-out</strong> test set</li><li>作为动词短语出现在句中 → <strong>不加连字符</strong>:Ten percent of the data was <strong>held out</strong>.</li></ul><p><strong>词源理解:</strong> 来自短语动词 hold out(保留、留着不拿出来),所以 &quot;held-out data&quot; 字面就是&quot;被扣着没拿出来用的数据&quot;,很好记。</p>", "level": "C2"}, {"anchor": "loath", "title": "loath(vs loathe)", "ipa": "英 /ləʊθ/ 美 /loʊθ/(词尾是**清辅音** /θ/)", "pos": "adj.", "cefr": "C2", "gloss": "不情愿的、勉强的——几乎总是用在固定句型 be loath to do sth(不愿意做某事)里,语域偏正式/书面。", "html": "<p><strong>English definition:</strong> Reluctant or unwilling to do something.</p><p><strong>含义:</strong> 不情愿的、勉强的——几乎总是用在固定句型 <strong>be loath to do sth</strong>(不愿意做某事)里,语域偏正式/书面。</p><ol class=\"ex\"><li><span class=\"en\">Neural networks are loath to give up their secrets when asked to explain their actions.</span><span class=\"zh\">当被要求解释自己的行为时,神经网络不愿吐露它们的秘密。</span></li><li><span class=\"en\">I&#x27;m loath to admit it, but he was right.</span><span class=\"zh\">我不太愿意承认,但他是对的。</span></li><li><span class=\"en\">Management is loath to raise prices in this market.</span><span class=\"zh\">管理层不愿意在当前市场环境下涨价。</span></li></ol><p><strong>⚠️ 关键辨析:loath(形容词)vs loathe(动词)</strong></p><p>这两个词长得极像,但词性、发音、意思全不一样:</p><ul><li><strong>loath</strong> —— adj.,<strong>没有词尾 e</strong>,读 /ləʊθ/(<strong>清</strong>音 th,如 think),意思是&quot;<strong>不情愿的</strong>&quot;(程度较轻,只是不太想做)。I&#x27;m <strong>loath</strong> to bother him.(我不太想打扰他。)</li><li><strong>loathe</strong> —— v.,<strong>有词尾 e</strong>,读 /ləʊð/(<strong>浊</strong>音 th,如 this),意思是&quot;<strong>极度厌恶、憎恨</strong>&quot;(情绪强烈)。I <strong>loathe</strong> waking up early.(我极其讨厌早起。)</li></ul><p><strong>记忆技巧:</strong> 多出来的那个 <strong>e</strong> 代表 <strong>e</strong>motion(情绪)——带 e 的 loathe 是强烈的情绪动词&quot;憎恶&quot;;不带 e 的 loath 只是&quot;不太乐意&quot;这种温和的形容词。</p><p><strong>顺带一个好习语:give up its/their secrets</strong> —— (谜团、遗迹、黑箱系统)终于吐露/揭开秘密。The ancient tomb finally gave up its secrets.(那座古墓终于揭开了它的秘密。)</p><p><strong>拼写提示:</strong> loath 在英式英语里还有个较少见的变体拼法 <strong>loth</strong>,意思相同。</p>", "level": "C2"}]}, {"level": "TERM", "items": [{"anchor": "prose-parsing", "title": "prose parsing", "ipa": "", "pos": "phrase(短语,无 CEFR/音标)", "cefr": "", "gloss": "释义: 解析非结构化的自然语言文本来提取信息(比如用正则/字符串匹配从人类可读的日志或输出里猜测状态),通常带贬义/警示色彩,因为这种方式脆弱、格式一变就容易失效——常与结构化数据/字段解析相对。", "html": "<p><strong>释义:</strong> 解析非结构化的自然语言文本来提取信息(比如用正则/字符串匹配从人类可读的日志或输出里猜测状态),通常带贬义/警示色彩,因为这种方式脆弱、格式一变就容易失效——常与结构化数据/字段解析相对。</p><p><strong>例句:</strong></p><ol class=\"ex\"><li><span class=\"en\">We used to scrape the CLI output with regex, but that kind of prose parsing broke every time the log format changed.</span><span class=\"zh\">我们以前用正则去抓 CLI 的输出,但这种&quot;解析自由文本&quot;的做法,一旦日志格式变了就会失效。</span></li><li><span class=\"en\">Relying on prose parsing to detect test failures is fragile — prefer structured exit codes or JSON output instead.</span><span class=\"zh\">靠解析自由文本来判断测试是否失败是很脆弱的做法——最好用结构化的退出码或 JSON 输出来代替。</span></li><li><span class=\"en\">No prose parsing needed here, since the API already returns a typed status field.</span><span class=\"zh\">这里不需要解析自由文本,因为这个 API 本身就返回了一个类型化的状态字段。</span></li></ol>", "level": "TERM"}, {"anchor": "ground-truth", "title": "ground truth", "ipa": "", "pos": "noun phrase(固定术语,无 CEFR/音标)", "cefr": "", "gloss": "义项一:机器学习/数据科学本义 —— 真实标签、基准事实", "html": "<p><strong>义项一:机器学习/数据科学本义 —— 真实标签、基准事实</strong></p><ol class=\"ex\"><li><span class=\"en\">The model&#x27;s predictions were compared against the ground truth labels to compute accuracy.</span><span class=\"zh\">模型的预测结果被拿去和真实标签做对比,以此计算准确率。</span></li></ol><p><strong>义项二:引申义 —— 未经抽象层加工的、最原始的事实真相</strong></p><ol class=\"ex\"><li><span class=\"en\">Let me first show you the ground truth with a raw API call, so you can see what actually crosses the network.</span><span class=\"zh\">我先给你看最原始的真实情况——用一个裸的 API 调用,让你能看到网络上实际传输的内容。</span></li><li><span class=\"en\">Before trusting the dashboard&#x27;s numbers, I checked the ground truth by querying the database directly.</span><span class=\"zh\">在相信仪表盘上的数字之前,我直接查询数据库来核实了真实情况。</span></li></ol>", "level": "TERM"}, {"anchor": "hold-on", "title": "hold on", "ipa": "", "pos": "phrasal verb", "cefr": "", "gloss": "义项一:等一下(短暂等待)", "html": "<p><strong>义项一:等一下(短暂等待)</strong></p><ol class=\"ex\"><li><span class=\"en\">Hold on, let me grab my laptop.</span><span class=\"zh\">等一下,我去拿一下笔记本电脑。</span></li></ol><p><strong>义项二:坚持住,撑住</strong></p><ol class=\"ex\"><li><span class=\"en\">Just hold on a little longer — help is coming.</span><span class=\"zh\">再坚持一下,救援马上就到。</span></li></ol><p><strong>义项三:hold on to sth = 抓住 / 保留</strong></p><ol class=\"ex\"><li><span class=\"en\">Hold on to the railing while going down the stairs.</span><span class=\"zh\">下楼梯的时候抓紧扶手。</span></li></ol><p>⚠️ 注意:hold on <strong>不表示</strong>&quot;暂缓/搁置某件事&quot;,这个意思要用 hold off。</p>", "level": "TERM"}, {"anchor": "hold-off", "title": "hold off (on sth)", "ipa": "", "pos": "phrasal verb", "cefr": "", "gloss": "义项一:先不做某事,暂缓/搁置(等条件更合适再说,不一定有具体新时间点)", "html": "<p><strong>义项一:先不做某事,暂缓/搁置(等条件更合适再说,不一定有具体新时间点)</strong></p><ol class=\"ex\"><li><span class=\"en\">Let&#x27;s hold off on the Feedback modal issue until we get more user reports.</span><span class=\"zh\">我们先搁置一下 Feedback modal 这个问题,等收到更多用户反馈再说。</span></li><li><span class=\"en\">I&#x27;d hold off on deploying until the tests are green.</span><span class=\"zh\">我建议先别部署,等测试全绿了再说。</span></li></ol><p><strong>义项二:阻挡、推迟(某种不好的事情的到来)</strong></p><ol class=\"ex\"><li><span class=\"en\">The rain held off just long enough for us to finish the match.</span><span class=\"zh\">雨一直没下,刚好让我们把比赛打完。</span></li></ol>", "level": "TERM"}, {"anchor": "put-off", "title": "put off", "ipa": "", "pos": "phrasal verb", "cefr": "", "gloss": "义项一:推迟、延期(最口语化,常隐含\"拖延\"语感)", "html": "<p><strong>义项一:推迟、延期(最口语化,常隐含&quot;拖延&quot;语感)</strong></p><ol class=\"ex\"><li><span class=\"en\">We had to put off the meeting until next Monday.</span><span class=\"zh\">我们不得不把会议推迟到下周一。</span></li><li><span class=\"en\">Stop putting off your homework — do it now.</span><span class=\"zh\">别再拖你的作业了——现在就做。</span></li></ol><p><strong>义项二:(非正式)使反感、让人倒胃口</strong></p><ol class=\"ex\"><li><span class=\"en\">His rude comment really put me off.</span><span class=\"zh\">他那句无礼的话真的让我很反感。</span></li></ol>", "level": "TERM"}, {"anchor": "push-back", "title": "push back (sth)", "ipa": "", "pos": "phrasal verb(口语化,商务场合高频)", "cefr": "", "gloss": "释义: 把截止日期/计划往后推,意思接近 postpone / put off。", "html": "<p><strong>释义:</strong> 把截止日期/计划往后推,意思接近 postpone / put off。</p><p><strong>例句:</strong></p><ol class=\"ex\"><li><span class=\"en\">Can we push back the deadline to Friday?</span><span class=\"zh\">能把截止日期推到周五吗?</span></li></ol>", "level": "TERM"}, {"anchor": "put-on-hold", "title": "put (sth) on hold", "ipa": "", "pos": "phrase", "cefr": "", "gloss": "释义: 暂停/搁置某事,和 hold off 意思非常接近,可互换。", "html": "<p><strong>释义:</strong> 暂停/搁置某事,和 hold off 意思非常接近,可互换。</p><p><strong>例句:</strong></p><ol class=\"ex\"><li><span class=\"en\">We&#x27;re putting the redesign project on hold for now.</span><span class=\"zh\">我们现在把这个重新设计的项目先搁置了。</span></li></ol>", "level": "TERM"}, {"anchor": "hold-up", "title": "hold up", "ipa": "", "pos": "phrasal verb / n.(hold-up)", "cefr": "", "gloss": "⚠️ 跟 hold on / hold off 形似,但意思不同,容易搞混。", "html": "<p>⚠️ 跟 hold on / hold off 形似,但意思不同,容易搞混。</p><p><strong>义项一:耽搁,拖延(常由外部原因造成,如流程、审批)</strong></p><ol class=\"ex\"><li><span class=\"en\">There&#x27;s a hold-up in the approval process.</span><span class=\"zh\">审批流程卡住了。</span></li></ol><p><strong>义项二:打劫(完全不相关的意思)</strong></p><ol class=\"ex\"><li><span class=\"en\">The store was held up at gunpoint.</span><span class=\"zh\">那家店被持枪抢劫了。</span></li></ol>", "level": "TERM"}, {"anchor": "table", "title": "table (sth)", "ipa": "", "pos": "v.", "cefr": "", "gloss": "⚠️ 英式和美式意思正好相反,经典的跨语境坑。", "html": "<p>⚠️ <strong>英式和美式意思正好相反</strong>,经典的跨语境坑。</p><p><strong>美式英语:</strong> table a discussion = <strong>搁置</strong>这个议题,先不讨论。</p><p><strong>英式英语:</strong> table a discussion = <strong>提出</strong>这个议题,拿出来讨论。</p><p>（所以开跨国会议时这个词很容易造成误会）</p>", "level": "TERM"}, {"anchor": "shelve", "title": "shelve (sth)", "ipa": "", "pos": "v.", "cefr": "", "gloss": "释义: 比 hold off 更\"重\",指无限期搁置/雪藏一个计划,暗示可能不会再捡起来了。", "html": "<p><strong>释义:</strong> 比 hold off 更&quot;重&quot;,指<strong>无限期搁置/雪藏</strong>一个计划,暗示可能不会再捡起来了。</p><p><strong>例句:</strong></p><ol class=\"ex\"><li><span class=\"en\">The merger plan was shelved after the market crashed.</span><span class=\"zh\">市场崩盘后,那个并购计划就被雪藏了(基本没戏了)。</span></li></ol>", "level": "TERM"}, {"anchor": "back-burner", "title": "put sth on the back burner", "ipa": "back burner /bæk ˈbɜːrnər/", "pos": "idiom", "cefr": "", "gloss": "来源: 炉灶前后两个火眼的比喻——前面的(front burner)煮需要马上照看的菜,后面的(back burner)放只需小火慢炖、不用马上管的东西。", "html": "<p><strong>来源:</strong> 炉灶前后两个火眼的比喻——前面的(front burner)煮需要马上照看的菜,后面的(back burner)放只需小火慢炖、不用马上管的东西。</p><p><strong>释义:</strong> 把某件事<strong>降低优先级、先放一放</strong>,但<strong>打算以后再回来处理</strong>——比 shelve 语感更轻,不代表放弃。</p><p><strong>例句:</strong></p><ol class=\"ex\"><li><span class=\"en\">We&#x27;ve put the redesign project on the back burner while we focus on the bug fixes.</span><span class=\"zh\">我们先把这个改版项目放一放,现在专注处理这些 bug。</span></li><li><span class=\"en\">That idea has been on the back burner for months — maybe it&#x27;s time to revisit it.</span><span class=\"zh\">那个想法已经被搁置好几个月了——也许是时候重新拾起来看看了。</span></li></ol><p><strong>反义搭配:front burner = 当前最优先要处理的事</strong></p><ol class=\"ex\"><li><span class=\"en\">Fixing the payment bug is now the front burner issue.</span><span class=\"zh\">修复支付相关的 bug 现在是最优先要处理的事。</span></li></ol>", "level": "TERM"}, {"anchor": "postpone-family-quickref", "title": "\"推迟/暂缓\" 类词组一句话辨析速查", "ipa": "", "pos": "", "cefr": "", "gloss": "", "html": "<ul><li><strong>hold on</strong> = 等一下 / 坚持住(短暂等待,不是搁置计划)</li><li><strong>hold off (on)</strong> = 先别启动/先别做,等更合适的时机</li><li><strong>put off</strong> = 明确把一件事推迟到以后(最通用,常带拖延语感)</li><li><strong>postpone</strong> = 正式且中性的&quot;推迟&quot;(书面首选)</li><li><strong>defer</strong> = 制度化/官方场景的&quot;推迟&quot;(税、入学、判决);另有 defer to = 听从,勿混淆</li><li><strong>push back</strong> = 口语化的&quot;推迟&quot;(商务场合高频)</li><li><strong>put on hold</strong> = 暂停/搁置,接近 hold off</li><li><strong>hold up</strong> = 耽搁 / 打劫(两个不相关意思,勿与 hold on/off 混淆)</li><li><strong>table</strong> = 英美意思相反的坑(美:搁置;英:提出讨论)</li><li><strong>shelve</strong> = 无限期搁置/雪藏,暗示可能不会再捡起来</li><li><strong>stall</strong> = 故意拖延、拖时间,常带负面语感</li><li><strong>put sth on the back burner</strong> = 降低优先级但打算以后再处理,语感比 shelve 轻</li></ul>", "level": "TERM"}, {"anchor": "hand-wave", "title": "hand-wave", "ipa": "/ˈhænd weɪv/", "pos": "v.(由 \"wave one's hand\" 引申而来的技术/学术俚语)", "cefr": "非正式行话,不算标准 CEFR 词汇", "gloss": "释义: 字面是\"挥挥手\"这个动作,引申义是用一个模糊、不严谨的解释把某个细节/论证一带而过,不做深入证明或说明——常带批评色彩,指\"含糊其辞、蒙混过关\"的做法。", "html": "<p><strong>释义:</strong> 字面是&quot;挥挥手&quot;这个动作,引申义是用一个模糊、不严谨的解释把某个细节/论证一带而过,不做深入证明或说明——常带批评色彩,指&quot;含糊其辞、蒙混过关&quot;的做法。</p><p><strong>例句:</strong></p><ol class=\"ex\"><li><span class=\"en\">The reason people rate it so highly is the method: nothing is imported and hand-waved.</span><span class=\"zh\">大家给这个东西打高分的原因在于它的方法论——没有任何东西是&quot;直接引入却不讲清楚来龙去脉&quot;的。</span></li><li><span class=\"en\">The professor hand-waved the proof and moved on, leaving several students confused.</span><span class=\"zh\">教授把这个证明含糊带过就往下讲了,搞得好几个学生一头雾水。</span></li><li><span class=\"en\">I don&#x27;t want a hand-wavy explanation — walk me through exactly how this algorithm works.</span><span class=\"zh\">我不想要一个含糊其辞的解释——请一步步给我讲清楚这个算法到底是怎么运作的。(hand-wavy 是它的形容词形式)</span></li></ol>", "level": "TERM"}, {"anchor": "synonym-preposition", "title": "synonym / antonym / synonymous 的介词搭配", "ipa": "", "pos": "", "cefr": "", "gloss": "标准搭配:", "html": "<p><strong>标准搭配:</strong></p><ul><li><strong>synonym(s) for X</strong> —— 最常见、最自然的说法。</li></ul><p><em>What are some synonyms for &quot;immense&quot;?</em></p><ul><li><strong>synonym(s) of X</strong> —— 也正确,偏书面/词典式的表达。</li></ul><p><em>&quot;Huge&quot; is a synonym of &quot;immense&quot;.</em></p><ul><li><strong>antonym(s) for/of X</strong> —— 同理,antonym 也搭配 for 或 of。</li></ul><p><em>What&#x27;s the antonym for &quot;immense&quot;?</e
