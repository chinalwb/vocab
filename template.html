<script>
  // stamp the saved theme before paint so there's no flash of the wrong palette
  try {
    var t = localStorage.getItem("vk.theme");
    if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>

<style>

  --card-ink-2:#4a4944;
  --card-edge:rgba(31,31,30,.10);

  --a1-1:#dcecd4; --a1-2:#cde5c6; --a1-3:#e7f2e1;
  --a2-1:#cbe7e1; --a2-2:#bbdfd8; --a2-3:#dbefeb;
  --b1-1:#d2e3f4; --b1-2:#c1d9ef; --b1-3:#e0ecf8;
  --b2-1:#fbf0bd; --b2-2:#f7e8a4; --b2-3:#fdf6d4;
  --c1-1:#fbdcc0; --c1-2:#f7cea7; --c1-3:#fde9d6;
  --c2-1:#f7cfc9; --c2-2:#f2bab2; --c2-3:#fadfdb;
  --tm-1:#ddd9f2; --tm-2:#cec9ea; --tm-3:#e9e6f7;
  --gr-1:#f2d5e4; --gr-2:#ebc2d7; --gr-3:#f7e4ee;
  --sn-1:#e8d7c3; --sn-2:#dfcaaf; --sn-3:#f1e5d7;
  --st-1:#d6e0e6; --st-2:#c6d4dc; --st-3:#e4ecf0;

  --err:#c2412d; --warn:#b7791f; --mk:#ffffff; --tag:#ece9e0; --tag-ink:#4a4944;
  /* liquid glass (after iOS 26): frosted controls floating over the cards */
  --glass:rgba(247,246,242,.55); --glass-strong:rgba(247,246,242,.78);
  --glass-fill:rgba(255,255,255,.66); --glass-rim:rgba(255,255,255,.9); --glass-edge:rgba(31,31,30,.09);
  --glass-shadow:0 8px 28px rgba(31,31,30,.12), 0 1px 2px rgba(31,31,30,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --ground:#1b1b19;
    --ink:#eceae2;
    --ink-2:#c3c0b5;
    --ink-3:#928f84;
    --rule:#343330;
    --chip:#2a2926;
    --chip-on:#eceae2;
    --chip-on-ink:#1b1b19;
    --shadow:0 1px 2px rgba(0,0,0,.45), 0 1px 3px 1px rgba(0,0,0,.3);
    --shadow-lift:0 2px 8px rgba(0,0,0,.55), 0 10px 24px -6px rgba(0,0,0,.5);
    --scrim:rgba(0,0,0,.62);
    --card-ink:#efede6;
    --card-ink-2:#c9c6bb;
    --card-edge:rgba(255,255,255,.09);

    --a1-1:#2e4a2a; --a1-2:#375835; --a1-3:#263f23;
    --a2-1:#1d4a45; --a2-2:#245853; --a2-3:#173d39;
    --b1-1:#254460; --b1-2:#2c5273; --b1-3:#1e3950;
    --b2-1:#57501c; --b2-2:#665e22; --b2-3:#484216;
    --c1-1:#5a3a1d; --c1-2:#6b4623; --c1-3:#4a3017;
    --c2-1:#5b2b28; --c2-2:#6d3430; --c2-3:#4b2320;
    --tm-1:#3b3364; --tm-2:#473d76; --tm-3:#312a54;
    --gr-1:#562a44; --gr-2:#663251; --gr-3:#472238;
    --sn-1:#4a3626; --sn-2:#58402d; --sn-3:#3d2d20;
    --st-1:#2c3a43; --st-2:#34454f; --st-3:#253139;

    --err:#f08a78; --warn:#e6b35c; --mk:#242421; --tag:#35342f; --tag-ink:#d6d3c8;
  --glass:rgba(27,27,25,.55); --glass-strong:rgba(27,27,25,.8);
  --glass-fill:rgba(255,255,255,.06); --glass-rim:rgba(255,255,255,.14); --glass-edge:rgba(255,255,255,.08);
  --glass-shadow:0 10px 30px rgba(0,0,0,.45), 0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --ground:#1b1b19;
  --ink:#eceae2;
  --ink-2:#c3c0b5;
  --ink-3:#928f84;
  --rule:#343330;
  --chip:#2a2926;
  --chip-on:#eceae2;
  --chip-on-ink:#1b1b19;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 1px 3px 1px rgba(0,0,0,.3);
  --shadow-lift:0 2px 8px rgba(0,0,0,.55), 0 10px 24px -6px rgba(0,0,0,.5);
  --scrim:rgba(0,0,0,.62);
  --card-ink:#efede6;
  --card-ink-2:#c9c6bb;
  --card-edge:rgba(255,255,255,.09);

  --a1-1:#2e4a2a; --a1-2:#375835; --a1-3:#263f23;
  --a2-1:#1d4a45; --a2-2:#245853; --a2-3:#173d39;
  --b1-1:#254460; --b1-2:#2c5273; --b1-3:#1e3950;
  --b2-1:#57501c; --b2-2:#665e22; --b2-3:#484216;
  --c1-1:#5a3a1d; --c1-2:#6b4623; --c1-3:#4a3017;
  --c2-1:#5b2b28; --c2-2:#6d3430; --c2-3:#4b2320;
  --tm-1:#3b3364; --tm-2:#473d76; --tm-3:#312a54;
  --gr-1:#562a44; --gr-2:#663251; --gr-3:#472238;
  --sn-1:#4a3626; --sn-2:#58402d; --sn-3:#3d2d20;
  --st-1:#2c3a43; --st-2:#34454f; --st-3:#253139;

  --err:#f08a78; --warn:#e6b35c; --mk:#242421; --tag:#35342f; --tag-ink:#d6d3c8;
  --glass:rgba(27,27,25,.55); --glass-strong:rgba(27,27,25,.8);
  --glass-fill:rgba(255,255,255,.06); --glass-rim:rgba(255,255,255,.14); --glass-edge:rgba(255,255,255,.08);
  --glass-shadow:0 10px 30px rgba(0,0,0,.45), 0 1px 2px rgba(0,0,0,.3);
}

*{box-sizing:border-box}
body{
  background:var(--ground);
  color:var(--ink);
  font-family:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  font-size:15px;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
.wrap{padding-inline:16px;padding-block:0 64px;max-width:1500px;margin:0 auto}

/* ── header ─────────────────────────────── */
.top{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
  background:var(--glass);
  -webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6);
  border-bottom:1px solid var(--glass-edge);
  margin-inline:-16px;padding:14px 16px 12px;
}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.tabs{display:flex;gap:2px;margin:0 0 10px;border-bottom:1px solid var(--rule);overflow-x:auto}
.tab{
  font:inherit;font-size:14px;font-weight:500;color:var(--ink-3);
  background:none;border:0;border-bottom:2px solid transparent;
  padding:6px 12px 7px;margin-bottom:-1px;cursor:pointer;white-space:nowrap;
}
.tab .n{font-size:12px;opacity:.7;margin-left:4px;font-variant-numeric:tabular-nums}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tab:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
h1{
  font-family:Newsreader,Georgia,"Songti SC",serif;
  font-weight:600;font-size:26px;line-height:1.15;margin:0;letter-spacing:-.01em;
}
.tally{color:var(--ink-3);font-size:12.5px;letter-spacing:.04em}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search{
  flex:1 1 200px;min-width:0;max-width:320px;
  background:var(--glass-fill);color:var(--ink);
  border:1px solid var(--glass-edge);border-radius:999px;box-shadow:inset 0 1px 0 var(--glass-rim);
  padding:7px 14px;font:inherit;font-size:13.5px;
}
.search::placeholder{color:var(--ink-3)}
.search:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.fbtn{
  font:inherit;font-size:13px;font-weight:500;color:var(--ink-2);
  background:var(--glass-fill);border:1px solid var(--glass-edge);border-radius:999px;box-shadow:inset 0 1px 0 var(--glass-rim);
  padding:6px 13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
}
.fbtn[aria-expanded="true"],.fbtn.on{border-color:var(--ink-3);color:var(--ink)}
.fbtn:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.fb-n{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--chip-on);color:var(--chip-on-ink);font-size:11px;font-weight:600;display:inline-grid;place-items:center;font-variant-numeric:tabular-nums}
.fsum{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px;font-size:12px}
.fsum:empty{display:none}
.fchip{font:inherit;font-size:12px;color:var(--ink);background:var(--chip);border:1px solid var(--rule);border-radius:999px;padding:3px 6px 3px 11px;display:inline-flex;align-items:center;gap:4px;cursor:pointer}
.fchip span{opacity:.55;font-size:13px;line-height:1;padding:0 3px}
.fchip:hover span{opacity:1}
.fchip:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.fsum .cnt{margin-left:auto;color:var(--ink-3);font-variant-numeric:tabular-nums}
/* the panel: a bottom sheet on phones, a dropdown under 筛选 on wider screens */
.fback{position:fixed;inset:0;z-index:40;background:rgb(0 0 0 / .18)}
.fsheet{
  position:fixed;z-index:41;left:0;right:0;bottom:0;max-height:85vh;overflow:auto;
  background:var(--glass-strong);color:var(--ink);border-radius:20px 20px 0 0;
  -webkit-backdrop-filter:blur(24px) saturate(1.6);backdrop-filter:blur(24px) saturate(1.6);
  border-top:1px solid var(--glass-edge);
  box-shadow:inset 0 1px 0 var(--glass-rim), 0 -8px 30px rgb(0 0 0 / .18);
  padding:0 16px calc(12px + env(safe-area-inset-bottom,0px));
}
.fsh-head{position:sticky;top:0;display:flex;align-items:center;padding:14px 0 10px;font-size:15px}
.fsh-grab{position:absolute;top:6px;left:50%;width:36px;height:4px;margin-left:-18px;border-radius:2px;background:var(--rule)}
.fsh-head .fclear{margin-left:auto}
.filters{display:flex;flex-direction:column;gap:14px}
.frow{display:flex;flex-direction:column;gap:7px}
.fp{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.flab{font-size:11.5px;font-weight:600;letter-spacing:.08em;color:var(--ink-3)}
.fsh-foot{position:sticky;bottom:0;padding:14px 0 2px}
.fgo{width:100%;font:inherit;font-size:14px;font-weight:600;padding:10px;border-radius:999px;border:0;cursor:pointer;background:var(--chip-on);color:var(--chip-on-ink)}
.fgo:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
@media (min-width:640px){
  .fback{background:transparent}
  .fsheet{left:auto;right:auto;bottom:auto;width:440px;max-height:75vh;border-radius:18px;border:1px solid var(--glass-edge);box-shadow:inset 0 1px 0 var(--glass-rim), var(--glass-shadow);padding-bottom:12px}
  .fsh-grab{display:none}
  .fsh-foot{display:none}
}
.wr-box{
  font:inherit;font-size:12.5px;font-weight:500;letter-spacing:.03em;color:var(--ink-2);
  background:none;border:0;padding:4px 2px;cursor:pointer;
  display:inline-flex;align-items:center;gap:7px;
}
.wr-box .box{width:15px;height:15px;border:1.5px solid var(--ink-3);border-radius:4px;display:inline-grid;place-items:center}
.wr-box[aria-checked="true"] .box{background:var(--chip-on);border-color:var(--chip-on)}
.wr-box[aria-checked="true"] .box::after{content:"";width:7px;height:4px;border:2px solid var(--chip-on-ink);border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
.wr-box:focus-visible,.fclear:focus-visible{outline:2px solid var(--ink);outline-offset:1px;border-radius:6px}
.fclear{font:inherit;font-size:13px;color:var(--ink-3);background:none;border:0;padding:4px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.pill{
  font:inherit;font-size:12px;font-weight:500;letter-spacing:.03em;
  background:var(--chip);color:var(--ink-2);
  border:1px solid var(--rule);border-radius:999px;
  padding:5px 12px;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;
}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--sw)}
.pill[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink);border-color:var(--chip-on)}
.pill:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.theme{
  margin-left:auto;flex:0 0 auto;align-self:center;
  width:32px;height:32px;padding:0;
  display:inline-grid;place-items:center;
  background:var(--chip);color:var(--ink-2);
  border:1px solid var(--rule);border-radius:50%;cursor:pointer;
}
.theme:hover{color:var(--ink)}
.theme:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.theme svg{width:16px;height:16px;display:block}

/* ── sections ───────────────────────────── */
.sect{margin-top:34px}
.sect-head{display:flex;align-items:baseline;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.sect-head .badge{
  font-family:Newsreader,Georgia,serif;font-weight:600;font-size:17px;
  background:var(--sw);color:var(--card-ink);
  border:1px solid var(--card-edge);
  border-radius:8px;padding:2px 11px;letter-spacing:.02em;
}
.sect-head .nm{font-size:14px;color:var(--ink-2);font-weight:500}
.sect-head .ct{font-size:12px;color:var(--ink-3);letter-spacing:.04em}

.grid{columns:4 250px;column-gap:14px}
.card{
  break-inside:avoid;-webkit-column-break-inside:avoid;
  /* skip layout for off-screen cards; `auto` lets the browser remember each
     card's real height once measured, so the scrollbar stays stable */
  content-visibility:auto;contain-intrinsic-size:auto 190px;
  background:var(--sw);color:var(--card-ink);
  border:1px solid var(--card-edge);border-radius:10px;
  padding:13px 15px 12px;margin-bottom:14px;
  box-shadow:var(--shadow);cursor:pointer;text-align:left;width:100%;
  font:inherit;display:block;
  transition:box-shadow .16s ease, transform .16s ease;
}
.card:hover{box-shadow:var(--shadow-lift);transform:translateY(-1px)}
.card:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.hw{
  font-family:Newsreader,Georgia,"Songti SC",serif;
  font-weight:600;font-size:19px;line-height:1.25;margin:0 0 5px;
  letter-spacing:-.005em;text-wrap:balance;
}
.meta{display:flex;flex-wrap:wrap;gap:4px 8px;margin-bottom:7px;font-size:11.5px;color:var(--card-ink-2);line-height:1.45}
.card .meta{max-height:3.1em;overflow:hidden}
.meta .pos{font-weight:500}
.meta .ipa{font-variant-numeric:tabular-nums;opacity:.9}
.gloss{
  margin:0;font-size:13.5px;line-height:1.62;color:var(--card-ink-2);
  display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;
}
.foot{
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  margin-top:10px;padding-top:8px;border-top:1px solid var(--card-edge);
  font-size:11px;color:var(--card-ink-2);letter-spacing:.05em;
}
.foot .flv{font-weight:700}
.foot .no{font-variant-numeric:tabular-nums;opacity:.75;margin-right:6px}
.foot .dt{font-variant-numeric:tabular-nums;white-space:nowrap;opacity:.8}

.empty{color:var(--ink-3);font-size:14px;padding:48px 0;text-align:center}

/* ── modal ──────────────────────────────── */
.scrim{
  position:fixed;inset:0;z-index:50;background:var(--scrim);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  display:flex;align-items:flex-start;justify-content:center;
  padding:max(24px,env(safe-area-inset-top,0px)) 16px 40px;overflow-y:auto;
}
.sheet{
  background:var(--sw);color:var(--card-ink);
  border:1px solid var(--card-edge);border-radius:14px;
  box-shadow:var(--shadow-lift);
  width:min(680px,100%);padding:22px 24px 22px;position:relative;
  /* three bands like the app's entry page — the headword, the levels, and a card that takes the
     rest of the height and scrolls inside — so the sheet is as tall as the viewport */
  height:calc(100dvh - 64px);display:flex;flex-direction:column;overflow:hidden;box-sizing:border-box;
}
/* meta band: the title and one pill (type · 词性 · 音标 ›); the details unfold under it */
.mband{flex:none}
.mpill{font:inherit;font-size:12.5px;color:var(--card-ink);background:color-mix(in srgb, var(--card-ink) 8%, transparent);border:0;border-radius:999px;padding:5px 7px 5px 12px;display:inline-flex;align-items:center;gap:3px;max-width:100%;cursor:pointer;margin-top:2px}
.mpill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mpill svg{flex:none;width:16px;height:16px}
.mpill:focus-visible{outline:2px solid var(--card-ink);outline-offset:2px}
.mdet{margin:10px 0 0;font-size:13px;display:grid;grid-template-columns:auto 1fr;gap:5px 14px}
.mdet[hidden]{display:none}
.mdet b{font-weight:500;color:var(--card-ink-2)}
/* progress band, drawn as levels: three nodes on a track, filled up to the one the entry is at */
.lv{display:grid;grid-template-columns:repeat(var(--n,4),1fr);position:relative;margin:16px 0 12px;flex:none;--n:4;--k:0}
.lv::before,.lv::after{content:"";position:absolute;top:13px;left:calc(50% / var(--n));height:3px;border-radius:2px;background:var(--card-edge);width:calc(100% - 100% / var(--n))}
.lv::after{background:var(--card-ink);width:calc((100% - 100% / var(--n)) * var(--k) / (var(--n) - 1));transition:width .3s}
/* 朗读: the browser's own speech synthesis */
.spk{font:inherit;display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;border:0;background:transparent;color:var(--card-ink-2);cursor:pointer;vertical-align:middle;margin-left:4px;padding:0}
.spk svg{width:17px;height:17px}
.spk:hover{background:var(--card-edge)}
.spk:focus-visible{outline:2px solid var(--card-ink);outline-offset:1px}
.sheet h2 .spk{width:30px;height:30px}
.sheet h2 .spk svg{width:20px;height:20px}
.adv{display:flex;align-items:center;gap:10px;background:color-mix(in srgb, var(--card-ink) 6%, transparent);border-radius:12px;padding:6px 6px 6px 14px;margin:0 0 14px;font-size:13.5px}
.adv span{flex:1}
.lvl{font:inherit;font-size:12.5px;color:var(--card-ink-2);background:none;border:0;padding:0 0 2px;cursor:pointer;position:relative;display:grid;justify-items:center;gap:6px;border-radius:10px}
.lvl:disabled{cursor:default}
.lvl .node{width:28px;height:28px;border-radius:50%;border:2px solid var(--card-edge);background:var(--sw);display:grid;place-items:center;box-sizing:border-box;font-size:13px;font-weight:700}
.lvl.passed .node{background:var(--card-ink);border-color:var(--card-ink);color:var(--sw)}
.lvl.on .node{border-color:var(--card-ink)}
.lvl.on .node::after{content:"";width:16px;height:16px;border-radius:50%;background:var(--card-ink)}
.lvl.on{color:var(--card-ink);font-weight:600}
.lvl:focus-visible{outline:2px solid var(--card-ink);outline-offset:2px}
/* the card: two faces like a coin — the notes and, while in 自测, the quiz — turned over in 3D */
.ecard{flex:1;min-height:0;position:relative;perspective:1400px}
.ecard .inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .65s cubic-bezier(.4,0,.2,1)}
.ecard.flipped .inner{transform:rotateY(180deg)}
.face{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:flex;flex-direction:column;box-sizing:border-box;
  background:color-mix(in srgb, var(--card-ink) 6%, transparent);border:1px solid var(--card-edge);border-radius:18px;padding:14px 16px;
}
.face.bk{transform:rotateY(180deg)}
.fh{display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--card-ink-2);margin:0 0 10px;flex:none}
.fh .ln{flex:1;border-top:1px solid var(--card-edge)}
.fh button{font:inherit;font-size:12.5px;color:var(--card-ink-2);background:none;border:0;padding:2px 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.fh .full{text-decoration:none;display:grid;place-items:center;width:26px;height:26px;border-radius:7px;padding:0;margin-left:-4px}
.fh .full svg{width:16px;height:16px}
.fh button:focus-visible{outline:2px solid var(--card-ink);outline-offset:2px;border-radius:4px}
/* 选词: the 选词 | 打字 switch, the sentence being built, and the chips (ui/SelfTest.kt) */
.amode{display:inline-flex;gap:2px;padding:2px;border:1px solid var(--card-edge);border-radius:999px;flex:none}
.amode button,.fh .amode button{font:inherit;font-size:12px;line-height:1;padding:4px 10px;border-radius:999px;border:0;background:none;color:var(--card-ink-2);cursor:pointer;text-decoration:none}
.amode button[aria-pressed="true"]{background:var(--card-ink);color:var(--sw)}
.amode-row{display:flex;justify-content:flex-end;margin:8px 0 0}
.wb-ans{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:72px;box-sizing:border-box;padding:10px;margin-top:10px;border:1.5px solid var(--card-ink-2);border-radius:12px;background:color-mix(in srgb, var(--chip) 55%, transparent);position:relative}
.wb-ans:has(.wb-clear){padding-right:60px}
.wb-ph{color:var(--card-ink-2);font-size:14px;padding:4px}
.wchip{font-family:Newsreader,Georgia,serif;font-size:16px;line-height:1.2;padding:5px 10px;border-radius:10px;border:1px solid var(--card-edge);background:var(--chip);color:var(--card-ink);cursor:pointer}
.wb-ans .wchip{background:var(--card-ink);border-color:var(--card-ink);color:var(--sw)}
.wchip.used{background:color-mix(in srgb, var(--card-ink) 8%, transparent);border-color:transparent;color:transparent;cursor:default}
.wb-clear{position:absolute;top:6px;right:6px;font:inherit;font-size:12.5px;color:var(--card-ink-2);background:none;border:0;padding:6px 8px;cursor:pointer;border-radius:8px}
.wb-bank{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.wb-bank .wchip{font-size:17px;padding:8px 14px}
.wb-ans span.wchip{opacity:.75;cursor:default}
.wb-done{color:var(--card-ink-2);font-size:13px;padding:8px 0}
.face .cta .wb-bank{margin:0 0 10px}
.wchip:focus-visible,.wb-clear:focus-visible,.amode button:focus-visible{outline:2px solid var(--card-ink);outline-offset:2px}
.wb-ans[hidden],.wb-bank[hidden],textarea.draft[hidden]{display:none}
.face .body.fillb{display:flex;flex-direction:column;flex:1;min-height:0}
.face .scrollq{flex:1;min-height:0;overflow-y:auto;padding-top:2px}
.face .st-stats{margin-top:0}
.face .st-res{margin-top:4px}
.face .cta,.face .foot{flex:none;margin-top:10px}
.face .cta .btn{width:100%}
.face .st .st-prompt>:first-child{margin-top:0}
.st-title{display:none}
.sheet.full .st-title{display:block}
.sheet.full .mpill,.sheet.full .mdet,.sheet.full .lv{display:none}
.sheet.full h2{font-size:17px;margin:0 0 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-wrap:unset}
.sheet textarea.draft{border:1.5px solid var(--card-ink-2);background:color-mix(in srgb, var(--chip) 55%, transparent);margin-top:10px;border-radius:12px;color:var(--card-ink)}
.sheet textarea.draft:focus-visible{outline:none;border-color:var(--card-ink)}
/* examples in the sheet: every translated one is a 自测 question (number in a filled dot) unless
   I click it out (hollow dot, dimmed) */
.sheet .body ol.ex{counter-reset:ex;padding-left:24px}
.sheet .body ol.ex li{counter-increment:ex;list-style:none;position:relative}
.sheet .body ol.ex li::before{content:counter(ex);position:absolute;left:-24px;top:2px;font-size:12px;color:var(--card-ink-2)}
.sheet .body ol.ex li.qz{cursor:pointer}
.sheet .body ol.ex li.qz::before{width:16px;height:16px;border-radius:50%;background:var(--card-ink);color:var(--sw);font-size:10px;font-weight:600;display:grid;place-items:center;top:4px;left:-23px;box-sizing:border-box}
.sheet .body ol.ex li.qz.out{opacity:.45}
.sheet .body ol.ex li.qz.out::before{background:transparent;border:1.5px solid var(--card-ink-2);color:var(--card-ink-2)}
.qz-cap{font-size:11.5px;color:var(--card-ink-2);margin:-6px 0 12px 24px}
/* ⭐ on a starred example; the long-press menu (a bottom sheet over the entry sheet) */
.body ol.ex li .star::before{content:"⭐";font-size:.8em;margin-left:4px}
.sheet .body ol.ex > li[data-key]{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.exm-back{position:fixed;inset:0;z-index:70;background:var(--scrim)}
.exm{position:fixed;z-index:71;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;background:var(--ground);color:var(--ink);border-radius:20px 20px 0 0;box-shadow:var(--shadow-lift);padding:18px 0 calc(10px + env(safe-area-inset-bottom,0px))}
.exm-en{margin:0 24px;font-family:Newsreader,serif;font-size:18px;line-height:1.4}
.exm-zh{margin:4px 24px 0;font-size:14px;color:var(--ink-2)}
.exm button{display:block;width:100%;text-align:left;font:inherit;font-size:15px;color:inherit;background:none;border:0;padding:14px 24px;cursor:pointer}
.exm button:first-of-type{margin-top:10px;border-top:1px solid var(--rule)}
.exm button:hover,.exm button:focus-visible{background:var(--rule);outline:none}
.flash{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:var(--chip-on);color:var(--chip-on-ink);font-size:13px;padding:9px 16px;border-radius:999px;box-shadow:var(--shadow-lift);opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.flash.on{opacity:1}
.sheet h2{
  font-family:Newsreader,Georgia,"Songti SC",serif;
  font-weight:600;font-size:25px;line-height:1.2;margin:0 0 8px;padding-right:40px;
  text-wrap:balance;
}
.sheet .meta{font-size:12.5px;margin-bottom:16px}
.x{
  position:absolute;top:14px;right:14px;
  width:30px;height:30px;border-radius:50%;
  background:transparent;border:1px solid var(--card-edge);
  color:var(--card-ink-2);font:inherit;font-size:15px;line-height:1;cursor:pointer;
}
.x:hover{background:var(--card-edge)}
.nx{
  position:absolute;top:14px;right:52px;height:30px;padding:0 12px;border-radius:999px;
  background:var(--card-ink);color:var(--sw);border:0;font:inherit;font-size:12.5px;cursor:pointer;white-space:nowrap;
}
.nx:focus-visible{outline:2px solid var(--card-ink);outline-offset:2px}
.sheet.has-nx h2{padding-right:150px}
.sheet.has-nx .back{max-width:calc(100% - 190px)}
.x:focus-visible{outline:2px solid var(--card-ink);outline-offset:1px}
.back{
  display:inline-block;margin:0 0 10px;padding:3px 10px 3px 8px;
  background:var(--card-edge);color:var(--card-ink-2);
  border:1px solid var(--card-edge);border-radius:999px;
  font:inherit;font-size:12px;cursor:pointer;text-align:left;
  /* the sheet is a flex column: keep it its own width, clear of the ✕ at the top right */
  align-self:flex-start;max-width:calc(100% - 44px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.back:hover{color:var(--card-ink)}
.back:focus-visible{outline:2px solid var(--card-ink);outline-offset:1px}
.body{font-size:14px;color:var(--card-ink)}
.body p{margin:0 0 11px}
.body strong{font-weight:700}
.body code{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.9em;
  background:var(--card-edge);padding:1px 5px;border-radius:4px;
}
.body ul{margin:0 0 12px;padding-left:19px}
.body ul li{margin-bottom:5px}
.body ol.ex{margin:0 0 13px;padding-left:19px}
.body ol.ex li{margin-bottom:9px}
.body ol.ex .en{
  display:block;font-family:Newsreader,Georgia,serif;font-size:15.5px;line-height:1.45;
}
.body ol.ex .zh{display:block;font-size:13px;color:var(--card-ink-2);margin-top:2px}
.body del{opacity:.65}
.xref{
  color:inherit;text-decoration:underline;
  text-decoration-thickness:1px;text-underline-offset:2px;
  text-decoration-color:var(--card-ink-2);
  cursor:pointer;font-weight:500;
}
.xref:hover{text-decoration-thickness:2px}
.xref:focus-visible{outline:2px solid var(--card-ink);outline-offset:2px;border-radius:2px}
.xref[data-missing]{text-decoration-style:dotted;cursor:default;opacity:.75}
.body blockquote{
  margin:0 0 13px;padding:9px 14px;
  border-left:3px solid var(--card-ink-2);
  background:var(--card-edge);border-radius:0 7px 7px 0;
  font-family:Newsreader,Georgia,serif;font-size:15px;line-height:1.5;
}

/* ── 错题本 ─────────────────────────────── */
.mtag{
  display:inline-block;font-size:.78em;font-weight:500;line-height:1.5;
  background:var(--tag);color:var(--tag-ink);
  border-radius:4px;padding:0 5px;margin:0 2px;vertical-align:.08em;
}
.pill.mk-pill{border-style:dashed}
.pill.mk-pill[aria-pressed="true"]{border-style:solid}
.mk-intro{color:var(--ink-3);font-size:13px;margin:22px 0 0;max-width:62ch}
.mk-types{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.mk-types .pill .n{opacity:.6;font-variant-numeric:tabular-nums}
.mk-head .badge{background:var(--mk);color:var(--ink)}
.mk{
  break-inside:avoid;-webkit-column-break-inside:avoid;
  content-visibility:auto;contain-intrinsic-size:auto 150px;
  background:var(--mk);color:var(--ink);
  border:1px solid var(--rule);border-left:3px solid var(--sev);
  border-radius:8px;padding:11px 14px 10px;margin-bottom:12px;
  box-shadow:var(--shadow);cursor:pointer;text-align:left;width:100%;
  font:inherit;display:block;
  transition:box-shadow .16s ease, transform .16s ease;
}
.mk:hover{box-shadow:var(--shadow-lift);transform:translateY(-1px)}
.mk:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.mk.error{--sev:var(--err)}
.mk.warn{--sev:var(--warn)}
.mk .what{font-size:13.5px;line-height:1.6;margin:0}
.mk .what .sv{color:var(--sev);font-weight:700;margin-right:4px;font-size:12px}
.mk .orig{
  margin:8px 0 0;padding-left:10px;border-left:2px solid var(--rule);
  font-family:Newsreader,Georgia,serif;font-size:14px;line-height:1.45;color:var(--ink-2);
}
.mk .src{
  display:flex;justify-content:space-between;gap:8px;margin-top:9px;
  font-size:11px;color:var(--ink-3);letter-spacing:.03em;
}
.mk .src .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mk .src .dt{font-variant-numeric:tabular-nums;white-space:nowrap}
.mk code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.9em;background:var(--tag);padding:0 4px;border-radius:3px}
.mk del{opacity:.65}

/* ── 会写 marker / filter ─────────────── */
.foot .wr{font-weight:700;letter-spacing:.08em}

/* ── 发送前自检 ─────────────────────────── */
.check{
  margin-top:22px;background:var(--mk);border:1px solid var(--rule);border-radius:10px;
  padding:14px 16px 8px;max-width:820px;
}
.check h2{font-size:15px;margin:0 0 2px;font-weight:700}
.check .sub{font-size:12.5px;color:var(--ink-3);margin:0 0 8px}
.check ol{list-style:none;margin:0;padding:0}
.check li{border-top:1px solid var(--rule)}
.check li:first-child{border-top:0}
.check button{
  font:inherit;text-align:left;width:100%;background:none;border:0;color:var(--ink);
  display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:baseline;
  padding:8px 2px;cursor:pointer;
}
.check button:hover .q{text-decoration:underline;text-underline-offset:2px}
.check .q{font-size:13.5px;line-height:1.55}
.check .ex{grid-column:2;font-size:12px;color:var(--ink-3)}
.check .n{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}

/* ── 复习 / 练习 panes ─────────────────── */
.pane{max-width:720px;margin:26px auto 0}
.pane h2{font-family:Newsreader,Georgia,serif;font-weight:600;font-size:22px;margin:0 0 4px}
.pane .note{color:var(--ink-3);font-size:13px;margin:0 0 16px;max-width:62ch}
.sync{margin:28px 0 0;padding:14px 16px;border:1px solid var(--rule);border-radius:12px;background:var(--mk);max-width:62ch}
.sync h3{font-size:14px;margin:0 0 4px}
.sync p{font-size:12.5px;color:var(--ink-3);margin:0 0 10px;line-height:1.6}
.sync .st{font-size:13px;color:var(--ink-2)}
.sync .st.err{color:var(--err)}
.sync input{flex:1 1 220px;min-width:0;font:inherit;font-size:13px;background:var(--chip);color:var(--ink);border:1px solid var(--rule);border-radius:999px;padding:7px 14px}
.sync a{color:inherit}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0 0 16px}
.stat{background:var(--mk);border:1px solid var(--rule);border-radius:10px;padding:12px 14px}
.stat b{display:block;font-family:Newsreader,Georgia,serif;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--ink-3)}
.btn{
  font:inherit;font-size:14px;font-weight:500;cursor:pointer;
  background:var(--chip-on);color:var(--chip-on-ink);border:1px solid var(--chip-on);
  border-radius:999px;padding:9px 18px;
}
.btn[disabled]{opacity:.45;cursor:default}
.btn.ghost{background:var(--chip);color:var(--ink-2);border-color:var(--rule)}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.linkish{font:inherit;font-size:12.5px;background:none;border:0;color:var(--ink-3);cursor:pointer;text-decoration:underline;text-underline-offset:2px;padding:0}
.bar{height:4px;background:var(--rule);border-radius:2px;overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--ink)}
.rcard{
  background:var(--sw);color:var(--card-ink);border:1px solid var(--card-edge);
  border-radius:14px;box-shadow:var(--shadow);padding:20px 22px;margin:12px 0 14px;
}
.rcard .lab{font-size:12px;letter-spacing:.06em;color:var(--card-ink-2);margin:0 0 6px;font-weight:500}
.rcard .big{font-family:Newsreader,Georgia,"Songti SC",serif;font-weight:600;font-size:26px;line-height:1.2;margin:0 0 6px;text-wrap:balance}
.rcard .prompt{font-size:16px;line-height:1.6;margin:0 0 6px}
.rcard .hint{font-size:13px;color:var(--card-ink-2);margin:6px 0 0}
.rcard hr{border:0;border-top:1px solid var(--card-edge);margin:18px 0}
.rcard .mine{
  margin:0 0 14px;padding:9px 12px;border-radius:8px;background:var(--card-edge);
  font-family:Newsreader,Georgia,serif;font-size:15px;white-space:pre-wrap;
}
textarea.draft{
  width:100%;min-height:92px;resize:vertical;margin-top:12px;
  font:inherit;font-family:Newsreader,Georgia,serif;font-size:16px;line-height:1.5;
  background:var(--chip);color:var(--ink);border:1px solid var(--rule);border-radius:8px;padding:10px 12px;
}
textarea.draft:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.grades{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.grades .btn{padding:10px 0}
.task{background:var(--mk);border:1px solid var(--rule);border-radius:12px;padding:16px 18px;margin:0 0 16px}
.task h3{font-size:15px;margin:0 0 4px}
.task .meta2{font-size:12.5px;color:var(--ink-3);margin:0 0 8px}
.task .ask{font-size:14.5px;line-height:1.6;margin:0}
.task .ask .xref{color:inherit}
.task .foot2{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.task .wc{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 0}
.chips button{font:inherit;font-size:13px;background:var(--chip);color:var(--ink);border:1px solid var(--rule);border-radius:999px;padding:3px 11px;cursor:pointer}
.toast{font-size:12.5px;color:var(--ink-3)}

/* ── 自测 ──────────────────────────────── */
.st textarea.draft{background:var(--chip);margin-top:4px}
.st .row{margin-top:10px}
.st-res{margin:14px 0 16px;font-size:14px}
.st-res .verdict{font-weight:700;margin:0 0 8px}
.st-res .line{
  margin:0 0 8px;padding:8px 12px;border-radius:8px;background:var(--card-edge);
  font-family:Newsreader,Georgia,serif;font-size:16px;line-height:1.5;
}
.st-res .line b{font-family:"Noto Sans SC",system-ui,sans-serif;font-size:11.5px;font-weight:500;color:var(--card-ink-2);display:block}
.st-res .st-x{color:var(--err);text-decoration:line-through;text-decoration-thickness:1.5px}
.st-res .st-m{background:color-mix(in srgb, var(--warn) 30%, transparent);border-radius:3px;padding:0 2px}
.st-res .fine{font-size:12px;color:var(--card-ink-2);margin:0}
.st-stats{font-size:12.5px;color:var(--card-ink-2);margin:-6px 0 12px}
.st-hist{margin:0 0 16px;font-size:13px}
.st-hist summary{cursor:pointer;color:var(--card-ink-2);font-size:12.5px}
.st-hist ol{list-style:none;margin:8px 0 0;padding:0}
.st-hist li{display:grid;grid-template-columns:auto auto 1fr;gap:8px;padding:5px 0;border-top:1px solid var(--card-edge);align-items:baseline}
.st-hist .when{font-variant-numeric:tabular-nums;color:var(--card-ink-2);font-size:12px;white-space:nowrap}
.st-hist .txt{font-family:Newsreader,Georgia,serif;font-size:14.5px;overflow-wrap:anywhere}
.foot .stc{font-weight:500}

/* ── 进度:学习中 → 自测 → 已掌握 ─────────── */
.foot .stg{font-weight:700;letter-spacing:.04em}
.foot .stg.done{color:#2f7a3c}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .foot .stg.done{color:#8fd49a} }
:root[data-theme="dark"] .foot .stg.done{color:#8fd49a}
.pill .n{opacity:.6;font-variant-numeric:tabular-nums}
.stage{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;margin:-6px 0 16px;font-size:12.5px;color:var(--card-ink-2)}
.stage .steps{display:inline-flex;align-items:center;gap:6px}
.stage .step{opacity:.7}
.stage .step.on{opacity:1;font-weight:600;color:var(--card-ink);background:color-mix(in srgb, var(--card-ink) 9%, transparent);border-radius:7px;padding:2px 8px}
.stage .arr{opacity:.4}
.stage .moves{display:inline-flex;align-items:center;gap:10px}
.sheet .quiz{background:color-mix(in srgb, var(--card-ink) 6%, transparent);border-radius:14px;padding:14px 16px;margin:0 0 22px}
.sheet .quiz>:first-child{margin-top:0}
.sheet .quiz>:last-child,.sheet .quiz .st-res>:last-child{margin-bottom:0}
.btn.retry{margin-top:4px}
.notes-h{display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--card-ink-2);margin:0 0 12px}
.notes-h::after{content:"";flex:1;border-top:1px solid var(--card-edge)}
/* notes as a carousel: a tab per section, one card at a time; 全部展开 stacks them all */
.nv-h{display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--card-ink-2);margin:0 0 10px}
.nv-h .ln{flex:1;border-top:1px solid var(--card-edge)}
.nv-h button{font:inherit;font-size:12.5px;color:var(--card-ink-2);background:none;border:0;padding:2px 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.nv-h button:focus-visible{outline:2px solid var(--card-ink);outline-offset:2px;border-radius:4px}
.nv-tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -2px 10px;padding:2px}
.nv-tabs::-webkit-scrollbar{display:none}
.nv-tab{flex:none;font:inherit;font-size:12.5px;color:var(--card-ink-2);background:transparent;border:1px solid var(--card-edge);border-radius:999px;padding:4px 11px;cursor:pointer;white-space:nowrap}
.nv-tab[aria-selected="true"]{background:var(--card-ink);border-color:var(--card-ink);color:var(--sw, var(--ground))}
.nv-tab:focus-visible{outline:2px solid var(--card-ink);outline-offset:1px}
.nv-track{display:flex;align-items:flex-start;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;gap:12px;transition:height .2s ease;outline:none}
.nv-track::-webkit-scrollbar{display:none}
.nv-card{flex:0 0 100%;box-sizing:border-box;scroll-snap-align:start;scroll-snap-stop:always;background:var(--glass-fill);border:1px solid var(--card-edge);border-radius:14px;padding:14px 15px 3px}
.nv-card > p.lbl{display:none}
.nv-dots{display:flex;justify-content:center;gap:5px;margin:10px 0 2px}
.nv-dots i{width:5px;height:5px;border-radius:50%;background:var(--card-ink);opacity:.2;transition:opacity .2s,width .2s}
.nv-dots i.on{opacity:.65;width:14px;border-radius:3px}
.nv.all .nv-tabs,.nv.all .nv-dots{display:none}
.nv.all .nv-track{display:block;overflow:visible;height:auto!important}
.nv.all .nv-card{background:none;border:0;padding:0;border-radius:0}
.nv.all .nv-card > p.lbl{display:block}
/* on the entry card the notes fill the face: tabs on top, dots at the bottom, each page scrolling */
.nv.fill{display:flex;flex-direction:column;flex:1;min-height:0}
.nv.fill .nv-h{margin:0 0 10px}
.nv.fill .nv-tabs,.nv.fill .nv-dots{flex:none}
.nv.fill .nv-track{flex:1;min-height:0;align-items:stretch;height:auto!important;transition:none}
.nv.fill .nv-card{height:100%;overflow-y:auto;background:transparent;border:0;border-radius:0;padding:2px 2px 8px}
.nv.fill.all .nv-track{display:block;overflow-y:auto}
.nv.fill.all .nv-card{height:auto;overflow:visible}
.nv.fill .scrollq{padding:2px 2px 8px}
@media (prefers-reduced-motion: reduce){.nv-track{transition:none}}
.stage b{color:var(--card-ink)}
.stage .btn{font-size:12.5px;padding:5px 13px}
/* the 自测 quiz inside an entry borrows the review card's prompt styles */
.sheet .st .lab{font-size:12px;letter-spacing:.06em;color:var(--card-ink-2);margin:0 0 6px;font-weight:500}
.sheet .st .big{font-family:Newsreader,Georgia,"Songti SC",serif;font-weight:600;font-size:22px;line-height:1.2;margin:0 0 6px}
.sheet .st .prompt{font-size:16px;line-height:1.6;margin:0 0 6px}
.sheet .st .hint{font-size:13px;color:var(--card-ink-2);margin:6px 0 10px}
.st-res .lab{font-size:12px;color:var(--card-ink-2);margin:0 0 6px}
.st-res .mine{margin:0 0 8px;padding:9px 12px;border-radius:8px;background:var(--card-edge);font-family:Newsreader,Georgia,serif;font-size:15px;white-space:pre-wrap}

@media (max-width:640px){
  .grid{columns:2 150px;column-gap:10px}
  .card{margin-bottom:10px;padding:11px 13px}
  h1{font-size:22px}
  .sheet{padding:18px 17px 18px}
  .rcard{padding:16px 16px}
  .grades{grid-template-columns:repeat(2,minmax(0,1fr))}
}
.prac{margin-top:28px;border-top:1px solid var(--rule);padding-top:14px}
.prac>summary{cursor:pointer;font-weight:600;font-size:15px;list-style-position:outside;padding:4px 0}
.prac[open]>summary{margin-bottom:12px}
/* phones: the view tabs become a floating glass capsule at the bottom, like the app's */
.tabs.float{
  position:fixed;z-index:30;left:16px;right:16px;bottom:calc(12px + env(safe-area-inset-bottom,0px));
  margin:0;padding:5px;gap:4px;border:1px solid var(--glass-edge);border-radius:999px;overflow:visible;
  background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6);
  box-shadow:inset 0 1px 0 var(--glass-rim), var(--glass-shadow);
}
.tabs.float .tab{flex:1;margin:0;border:0;border-radius:999px;padding:9px 4px;font-size:13.5px}
.tabs.float .tab[aria-selected="true"]{background:color-mix(in srgb, var(--ink) 9%, transparent);font-weight:600}
.tabs.float .tab .n{display:none}
.tabs.float .tab:focus-visible{outline-offset:-3px;border-radius:999px}
@media (max-width:639px){ .wrap{padding-block-end:110px} }
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>

<!--/HEAD-->
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>词汇便签墙</h1>
      <span class="tally" id="tally"></span>
      <button class="theme" id="theme" type="button"></button>
    </div>
    <nav class="tabs" id="tabs" aria-label="视图"></nav>
    <div class="tools" id="tools">
      <input class="search" id="q" type="search" placeholder="搜索单词、释义、语法点,或输入编号 #12…" autocomplete="off" aria-label="搜索">
      <button class="fbtn" id="fbtn" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="fsheet">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg>筛选<span class="fb-n" id="fbn" hidden></span>
      </button>
    </div>
    <div class="fsum" id="fsum"></div>
  </header>
  <main id="board"></main>
  <section id="mistakes" hidden>
    <div class="check" id="check"></div>
    <p class="mk-intro">只收我自己写错的地方。<b style="color:var(--err)">❌</b> 是语法错误,<b style="color:var(--warn)">⚠️</b> 是能用但不是最常见的写法。点卡片打开原条目。</p>
    <div class="mk-types" id="mtypes"></div>
    <div id="mboard"></div>
  </section>
  <section id="review" class="pane" hidden></section>
  <section id="selftest" class="pane" hidden></section>
  <section id="done" class="pane" hidden></section>
  <section id="extras" class="pane" hidden></section>
  <div id="practice"></div>
  <p class="empty" id="empty" hidden>没有匹配的条目。</p>
  <div class="fback" id="fback" hidden></div>
  <div class="fsheet" id="fsheet" role="dialog" aria-modal="true" aria-labelledby="fsh-t" hidden>
    <div class="fsh-head"><span class="fsh-grab" aria-hidden="true"></span><b id="fsh-t">筛选</b><button class="fclear" id="freset" type="button">重置</button></div>
    <div class="filters" id="filters"></div>
    <div class="fsh-foot"><button class="fgo" id="fgo" type="button">显示</button></div>
  </div>
</div>

<script>
const DATA = /*__DATA__*/;
DATA.forEach(g => g.items.forEach(it => { it.html = it.slides.map(x => x[1]).join(""); }));
const MISTAKES = /*__MISTAKES__*/;

const LV = {
  A1:{nm:"入门",  sw:["--a1-1","--a1-2","--a1-3"]},
  A2:{nm:"基础",  sw:["--a2-1","--a2-2","--a2-3"]},
  B1:{nm:"进阶",  sw:["--b1-1","--b1-2","--b1-3"]},
  B2:{nm:"中高级",sw:["--b2-1","--b2-2","--b2-3"]},
  C1:{nm:"高级",  sw:["--c1-1","--c1-2","--c1-3"]},
  C2:{nm:"精通",  sw:["--c2-1","--c2-2","--c2-3"]},
  TERM:{nm:"术语与固定搭配(无 CEFR 分级)", sw:["--tm-1","--tm-2","--tm-3"]},
  GRAMMAR:{nm:"语法与语域笔记", sw:["--gr-1","--gr-2","--gr-3"]},
  SENTENCE:{nm:"整句订正:我的原句 → 更地道的说法", sw:["--sn-1","--sn-2","--sn-3"]},
  SELFTEST:{nm:"自测:简单高频,不复习也要能写对", sw:["--st-1","--st-2","--st-3"]}
};
const LABEL = {TERM:"术语", GRAMMAR:"语法", SENTENCE:"句子", SELFTEST:"自测题"};

// ── theme toggle ─────────────────────────
const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.4M12 19v2.4M21.4 12H19M5 12H2.6M18.6 5.4l-1.7 1.7M7.1 16.9l-1.7 1.7M18.6 18.6l-1.7-1.7M7.1 7.1L5.4 5.4"/></svg>';
const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.6A8.6 8.6 0 1 1 9.4 3.5a6.9 6.9 0 0 0 11.1 11.1Z"/></svg>';
const themeBtn = document.getElementById("theme");
const darkMQ = window.matchMedia("(prefers-color-scheme: dark)");
const effective = () => document.documentElement.dataset.theme || (darkMQ.matches ? "dark" : "light");
function paintTheme(){
  const isDark = effective() === "dark";
  themeBtn.innerHTML = isDark ? SUN : MOON;
  const label = isDark ? "切换到浅色主题" : "切换到深色主题";
  themeBtn.setAttribute("aria-label", label);
  themeBtn.title = label;
}
themeBtn.addEventListener("click", () => {
  const next = effective() === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("vk.theme", next); } catch(e){}
  paintTheme();
});
darkMQ.addEventListener("change", () => { if (!document.documentElement.dataset.theme) paintTheme(); });
paintTheme();

const board = document.getElementById("board");
const filters = document.getElementById("filters");
const q = document.getElementById("q");
const empty = document.getElementById("empty");
const total = DATA.reduce((n,g)=>n+g.items.length,0);
const mkTotal = MISTAKES.reduce((n,g)=>n+g.items.length,0);
const writeTotal = DATA.reduce((n,g)=>n+g.items.filter(it=>it.mastery==="write").length,0);
document.getElementById("tally").textContent = total + " 条 · 会写 " + writeTotal + " · 错题 " + mkTotal;
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : v; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch(e){} },
};

// ── 进度: 学习中 → 自测 → 已掌握, like 百词斩's 斩. I move entries along with the buttons;
// it stays in this browser (vk.stage), like the app's filesDir/stage.json. Only moves are
// stored: a 自测 entry starts in 自测, everything else in 学习中. 已掌握 is left out of 复习.
// An entry's lifecycle, one tab each: 学习中 (浏览) → 复习 → 考核 → 掌握. Same keys as review/StageStore.kt.
const STAGES = [["learn", "学习中"], ["review", "复习中"], ["test", "考核中"], ["done", "已掌握"]];
const STAGE_NAME = Object.fromEntries(STAGES);
const STAGE_TAB = { learn: "学习", review: "复习", test: "考核", done: "掌握" };
const nextStage = k => (STAGES[STAGES.findIndex(s => s[0] === k) + 1] || [])[0];
let stages = {}, stageT = {};               // stageT: when each move was made, for 同步
try { stages = JSON.parse(store.get("vk.stage", "{}")) || {}; } catch(e){}
try { stageT = JSON.parse(store.get("vk.stage.t", "{}")) || {}; } catch(e){}
const stageOf = (it, level) => stages[it.anchor] || (level === "SELFTEST" ? "test" : "learn");
function setStage(it, stage){
  stages[it.anchor] = stage;
  stageT[it.anchor] = Date.now();
  store.set("vk.stage", JSON.stringify(stages));
  store.set("vk.stage.t", JSON.stringify(stageT));
  refreshStages();
  syncSoon();
}
let stageF = store.get("vk.stagef", "");
if (!STAGE_NAME[stageF]) stageF = "";

// 筛选: two labelled rows — 类型 (with a CEFR sub-row under 单词) and 进度 + 只看会写.
// Each row is single-choice and starts at 全部; the rows narrow each other.
const CEFR = ["A1", "A2", "B1", "B2", "C1", "C2"];
const TYPES = [["ALL", "全部"], ["WORD", "单词"], ["TERM", "术语"], ["GRAMMAR", "语法"], ["SENTENCE", "句子"], ["SELFTEST", "自测题"]];
let typeF = store.get("vk.type", null), cefrF = store.get("vk.cefr", "");
if (typeF === null) {                       // from the old single row (vk.level)
  const old = store.get("vk.level", "ALL");
  typeF = CEFR.includes(old) ? "WORD" : TYPES.some(t => t[0] === old) ? old : "ALL";
  cefrF = CEFR.includes(old) ? old : "";
}
if (!TYPES.some(t => t[0] === typeF)) typeF = "ALL";
if (!CEFR.includes(cefrF)) cefrF = "";
const levelShown = lv => typeF === "ALL" || typeF === lv || (typeF === "WORD" && CEFR.includes(lv) && (!cefrF || cefrF === lv));
// the 错题本 used to be a level pill; it is a tab now
let view = store.get("vk.view", store.get("vk.level", "") === "MISTAKES" ? "mistakes" : "entries");
if (view === "practice") view = "review";
if (view === "mistakes") view = "more";
let writeOnly = store.get("vk.write", "0") === "1";
let favOnly = store.get("vk.fav", "0") === "1";             // entries with a ⭐ example

const pill = (text, on, click, cls = "") => {
  const b = document.createElement("button");
  b.className = "pill " + cls; b.type = "button";
  b.setAttribute("aria-pressed", String(on));
  b.innerHTML = text;
  b.addEventListener("click", click);
  return b;
};
const row = (label, cls = "") => {
  const r = document.createElement("div");
  r.className = "frow " + cls;
  r.innerHTML = `<span class="flab">${label}</span><div class="fp"></div>`;
  filters.append(r);
  return r.lastChild;                       // the pills go in here; the label keeps its own column
};
const typeRow = row("类型"), cefrRow = row("级别", "sub"), stageRow = row("进度"), optRow = row("选项");
const clearAll = () => { typeF = "ALL"; cefrF = ""; stageF = ""; writeOnly = false; favOnly = false; saveFilters(); };
const clearBtn = document.getElementById("freset");
clearBtn.addEventListener("click", clearAll);
const fbtn = document.getElementById("fbtn"), fbn = document.getElementById("fbn"), fsum = document.getElementById("fsum");
const fsheet = document.getElementById("fsheet"), fback = document.getElementById("fback"), fgo = document.getElementById("fgo");
function openFilters(){
  fsheet.hidden = fback.hidden = false;
  fbtn.setAttribute("aria-expanded", "true");
  if (matchMedia("(min-width:640px)").matches) {     // dropdown: hang it under the button, kept on screen
    const r = fbtn.getBoundingClientRect();
    fsheet.style.top = (r.bottom + 6) + "px";
    fsheet.style.left = Math.max(16, Math.min(r.left, innerWidth - fsheet.offsetWidth - 16)) + "px";
  } else fsheet.style.top = fsheet.style.left = "";
  (fsheet.querySelector('.pill[aria-pressed="true"]') || fsheet.querySelector(".pill")).focus();
}
function closeFilters(){
  if (fsheet.hidden) return;
  fsheet.hidden = fback.hidden = true;
  fbtn.setAttribute("aria-expanded", "false");
  fbtn.focus();
}
fbtn.addEventListener("click", () => fsheet.hidden ? openFilters() : closeFilters());
fback.addEventListener("click", closeFilters);
fgo.addEventListener("click", closeFilters);
document.addEventListener("keydown", e => { if (e.key === "Escape" && !fsheet.hidden) { e.stopPropagation(); closeFilters(); } }, true);
addEventListener("resize", () => { if (!fsheet.hidden) openFilters(); });

function saveFilters(){
  store.set("vk.type", typeF); store.set("vk.cefr", cefrF);
  store.set("vk.stagef", stageF); store.set("vk.write", writeOnly ? "1" : "0"); store.set("vk.fav", favOnly ? "1" : "0");
  paintFilters(); render();
}
function paintFilters(){
  typeRow.querySelectorAll(".pill").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.t === typeF)));
  cefrRow.parentNode.hidden = typeF !== "WORD";
  cefrRow.querySelectorAll(".pill").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.c === cefrF)));
  stageRow.querySelectorAll("[data-s]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.s === stageF)));
  wr.setAttribute("aria-checked", String(writeOnly));
  fv.setAttribute("aria-checked", String(favOnly));
  // what's on stays visible after the panel closes: a removable chip per filter, a count on the button
  const on = [];
  if (typeF !== "ALL") on.push([TYPES.find(t => t[0] === typeF)[1] + (cefrF ? " · " + cefrF : ""), () => { typeF = "ALL"; cefrF = ""; }]);
  if (stageF) on.push([STAGE_NAME[stageF], () => { stageF = ""; }]);
  if (writeOnly) on.push(["只看会写", () => { writeOnly = false; }]);
  if (favOnly) on.push(["⭐ 有收藏", () => { favOnly = false; }]);
  fbn.hidden = !on.length; fbn.textContent = on.length;
  fbtn.classList.toggle("on", on.length > 0);
  clearBtn.hidden = !on.length;
  fsum.replaceChildren(...on.map(([text, off]) => {
    const c = document.createElement("button");
    c.className = "fchip"; c.type = "button"; c.setAttribute("aria-label", "去掉筛选:" + text);
    c.innerHTML = `${text}<span aria-hidden="true">✕</span>`;
    c.addEventListener("click", () => { off(); saveFilters(); });
    return c;
  }));
  if (on.length) { fsumCount = document.createElement("span"); fsumCount.className = "cnt"; fsum.append(fsumCount); }
  else fsumCount = null;
}
let fsumCount = null;
TYPES.forEach(([key, text]) => {
  const sw = LV[key] && LV[key].sw[0];
  const b = pill((sw ? `<span class="dot" style="--sw:var(${sw})"></span>` : "") + text + ' <span class="n"></span>', false,
    () => { typeF = key; if (key !== "WORD") cefrF = ""; saveFilters(); });
  b.dataset.t = key;
  typeRow.append(b);
});
[["", "全部"], ...CEFR.map(c => [c, c])].forEach(([key, text]) => {
  const b = pill((key ? `<span class="dot" style="--sw:var(${LV[key].sw[0]})"></span>` : "") + text + ' <span class="n"></span>', false,
    () => { cefrF = key; saveFilters(); });
  b.dataset.c = key;
  cefrRow.append(b);
});
[["", "全部"], ...STAGES].forEach(([key, text]) => {
  const b = pill(`${text} <span class="n"></span>`, false, () => { stageF = key; saveFilters(); });
  b.dataset.s = key;
  stageRow.append(b);
});
// 会写 narrows whatever else is picked, so it looks like a checkbox, not another choice
const wr = document.createElement("button");
wr.className = "wr-box"; wr.type = "button"; wr.setAttribute("role", "checkbox");
wr.title = "只看标了「会写」的条目:这些要练到能自己写出来";
wr.innerHTML = '<span class="box" aria-hidden="true"></span>只看会写';
wr.addEventListener("click", () => { writeOnly = !writeOnly; saveFilters(); });
optRow.append(wr);
// ⭐: entries with a starred example sentence (long-press → 收藏); shown once there is one
const fv = document.createElement("button");
fv.className = "wr-box"; fv.type = "button"; fv.setAttribute("role", "checkbox");
fv.title = "只看有收藏例句的条目(在条目里长按例句收藏)";
fv.innerHTML = '<span class="box" aria-hidden="true"></span>⭐ 有收藏 <span class="n"></span>';
fv.addEventListener("click", () => { favOnly = !favOnly; saveFilters(); });
optRow.append(fv);
paintFilters();

// view tabs
const tabs = document.getElementById("tabs");
const tools = document.getElementById("tools");
// On phones they float at the bottom. They have to leave the header for that: its backdrop-filter
// makes it the containing block for anything position:fixed inside it.
const phoneMQ = matchMedia("(max-width:639px)");
const placeTabs = () => {
  if (phoneMQ.matches) { document.querySelector(".wrap").append(tabs); tabs.classList.add("float"); }
  else { tools.before(tabs); tabs.classList.remove("float"); }
};
phoneMQ.addEventListener("change", placeTabs);
placeTabs();
// 自测 took 练习's place (used far more); 练习 lives at the bottom of 复习 now
// the lifecycle left to right, then 更多 (错题本, 练习, 同步) — the app's ⋮ menu
const TABS = [["entries", "浏览", total], ["review", "复习"], ["selftest", "考核"], ["done", "掌握"], ["more", "更多"]];
TABS.forEach(([key, text, n]) => {
  const b = document.createElement("button");
  b.className = "tab"; b.type = "button"; b.dataset.k = key; b.setAttribute("role", "tab");
  b.innerHTML = text + (n !== undefined ? `<span class="n">${n}</span>` : "");
  b.addEventListener("click", () => setView(key));
  tabs.append(b);
});
function setView(key){
  view = key;
  store.set("vk.view", key);
  render();
  window.scrollTo(0, 0);
}

// anchor -> entry, so a cross-reference inside a note can open the note it points at
const byAnchor = {};

// build sections once
const sections = DATA.map(g => {
  const sec = document.createElement("section");
  sec.className = "sect"; sec.dataset.level = g.level;
  const head = document.createElement("div");
  head.className = "sect-head";
  head.style.setProperty("--sw", `var(${LV[g.level].sw[0]})`);
  head.innerHTML =
    `<span class="badge">${LABEL[g.level] || g.level}</span>` +
    `<span class="nm">${LV[g.level].nm}</span>` +
    `<span class="ct">${g.items.length} 条</span>`;
  const grid = document.createElement("div");
  grid.className = "grid";
  const cards = g.items.map((it, i) => {
    const c = document.createElement("button");
    c.className = "card"; c.type = "button"; c.dataset.anchor = it.anchor;
    c.style.setProperty("--sw", `var(${LV[g.level].sw[i % 3]})`);
    const n = (it.html.match(/<li><span class="en">/g) || []).length;
    const meta = [it.pos && `<span class="pos">${it.pos}</span>`, it.ipa && `<span class="ipa">${it.ipa}</span>`]
      .filter(Boolean).join("");
    const approx = it.date.startsWith("~");
    const wtag = it.mastery === "write" ? ' · <span class="wr" title="要练到能自己写出来">会写</span>' : "";
    c.innerHTML =
      `<h3 class="hw">${it.title}</h3>` +
      (meta ? `<div class="meta">${meta}</div>` : "") +
      (it.gloss ? `<p class="gloss">${it.gloss}</p>` : "") +
      `<div class="foot">` +
      `<span><span class="no">#${it.no}</span><span class="flv">${(it.cefr || "").match(/\b[ABC][12]\b/)?.[0] || LABEL[g.level] || g.level}</span>` +
      (g.level === "SELFTEST" ? ` · <span class="stc" data-anchor="${it.anchor}"></span>` : `${n ? " · " + n + " 例句" : ""}${wtag}<span class="stc" data-opt="1" data-anchor="${it.anchor}"></span>`) +
      `<span class="stg" data-anchor="${it.anchor}" data-level="${g.level}"></span></span>` +
      `<span class="dt"${approx ? ' title="近似日期:原始记录已不可考,按前后条目推断"' : ""}>${it.date}</span>` +
      `</div>`;
    c.addEventListener("click", () => open(it, g.level, i, listOf(c)));
    byAnchor[it.anchor] = { it, level: g.level, i };
    grid.append(c);
    return { el: c, it, no: it.no, write: it.mastery === "write", hay: (it.title + " " + it.gloss + " " + it.html).toLowerCase() };
  });
  sec.append(head, grid);
  board.append(sec);

// ── 自测 compare: word-level diff of my sentence against the answer (same as ui/SelfTest.kt).
// Case, punctuation and curly quotes are ignored; the diff is an LCS over the words.
const normWord = w => w.toLowerCase().replace(/[’‘]/g, "'").replace(/[^a-z0-9']/g, "");
function diffWords(mine, answer){
  const a = mine.split(/\s+/).filter(Boolean), b = answer.split(/\s+/).filter(Boolean);
  const na = a.map(normWord), nb = b.map(normWord);
  const L = Array.from({ length: a.length + 1 }, () => new Array(b.length + 1).fill(0));
  for (let x = a.length - 1; x >= 0; x--) for (let y = b.length - 1; y >= 0; y--)
    L[x][y] = na[x] && na[x] === nb[y] ? L[x + 1][y + 1] + 1 : Math.max(L[x + 1][y], L[x][y + 1]);
  const keepA = new Set(), keepB = new Set();
  for (let x = 0, y = 0; x < a.length && y < b.length;) {
    if (na[x] && na[x] === nb[y]) { keepA.add(x++); keepB.add(y++); }
    else if (L[x + 1][y] >= L[x][y + 1]) x++; else y++;

  return { a, b, keepA, keepB, same: na.filter(Boolean).join(" ") === nb.filter(Boolean).join(" ") };
}
// A 答案 quote may hold several acceptable answers, one per line: any match is ✅,
// otherwise diff against the closest one (most words in common).
function bestDiff(mine, answer){
  const ds = answer.split("\n").filter(a => a.trim()).map(a => diffWords(mine, a));
  return ds.find(d => d.same) || ds.sort((x, y) => y.keepB.size - x.keepB.size)[0] || diffWords(mine, "");
}

  }
  const d = bestDiff(mine, answer);

  if (d.same) return `<p class="verdict">✅ 和答案一致(大小写、标点不计)</p>` +
    `<p class="line"><b>我写的</b>${esc(mine.trim())}</p><p class="line"><b>答案</b>${esc(d.b.join(" "))}${say}</p><p>${again}</p>`;
  const show = (ws, keep, cls) => ws.map((w, k) => keep.has(k) ? esc(w) : `<span class="${cls}">${esc(w)}</span>`).join(" ");

    `<p class="line"><b>答案(高亮 = 我漏掉或写错的)</b>${show(d.b, d.keepB, "st-m")}${say}</p>` +
    `<p class="fine">逐词对照只看字面:意思对、换了说法也可能没问题,看看下面的要点。</p>` + (again ? `<p>${again}</p>` : "");

// ── 复习's schedule: SM-2, same rules as the app (review/ReviewStore.kt). The quiz grades it —
// a sentence answered right is 记得 (4), wrong is 忘了 (1) — so there are no grade buttons. ──
let rev;

if (!rev || !rev.cards) rev = { cards: {}, newDay: 0, newToday: 0 };
const saveRev = () => store.set("vk.review", JSON.stringify(rev));
function schedule(c, q, today){
  const ease = Math.max(1.3, c.ease + (0.1 - (5 - q) * (0.08 + (5 - q) * 0.02)));
  if (q < 3) return { ...c, ease, interval: 1, reps: 0, lapses: c.lapses + 1, due: today + 1 };
  const reps = c.reps + 1;
  const interval = reps === 1 ? 1 : reps === 2 ? (q === 5 ? 4 : 3) : Math.max(c.interval + 1, Math.round(c.interval * ease));
  return { ...c, ease, interval, reps, due: today + interval };
}
// Today's 复习 queue: what's due, then what was never scheduled (会写 first, then most recently
// 收录). What's in 复习 is my own choice, so there is no daily quota any more.
function planToday(){
  const today = dayNo();
  const live = ALL.filter(t => stageOf(t.it, t.level) === "review");
  const due = live.filter(t => rev.cards[t.it.anchor] && rev.cards[t.it.anchor].due <= today)
    .sort((a, b) => rev.cards[a.it.anchor].due - rev.cards[b.it.anchor].due);
  const fresh = live.filter(t => !rev.cards[t.it.anchor])
    .sort((a, b) => (b.it.mastery === "write") - (a.it.mastery === "write") || b.it.date.replace("~", "").localeCompare(a.it.date.replace("~", "")));
  return { due, fresh };
}
function scheduleReview(anchor, ok){
  const today = dayNo(), existing = rev.cards[anchor];
  rev.cards[anchor] = { ...schedule(existing || { ease: 2.5, interval: 0, reps: 0, lapses: 0, due: 0 }, ok ? 4 : 1, today), t: Date.now() };
  saveRev(); syncSoon();
}
// What the front of a card asks: 会写 entries — and anything I moved to 自测 — are produced
// (中→英); the other 认识 entries are recognised (英→中).
function kind(t){
  if (t.level === "SELFTEST") return "selftest";
  if (t.level === "SENTENCE" && t.it.original) return "sentence";
  if (t.it.title.startsWith("翻译")) return "translate";
  if (t.level === "GRAMMAR") return "grammar";
  return t.it.mastery === "write" || stageOf(t.it, t.level) !== "learn" ? "produce" : "recognize";
}
// A 中→英 prompt must not give the answer away: blank out the headword's English words.
function maskTitle(text, title){
  const ws = [...new Set((title.match(/[A-Za-z]{3,}/g) || []).map(w => w.toLowerCase()))];
  return ws.reduce((t, w) => t.replace(new RegExp("\\b" + w + "\\w*", "gi"), "＿＿"), text);
}
// The prompt side of a card; the 自测 quiz in an entry asks the same way.

// ── 同步: progress.json on the repo's orphan `progress` branch, read and written through the
// GitHub API with my own token — same format and merge rules as sync/ProgressSync.kt.
// Moves, review cards and 自测 results sync; what I typed in a 自测 never leaves the device.
const GH = "https://api.github.com/repos/chinalwb/vocab/contents/progress.json";
const ELSEWHERE = "(在另一台设备上写的)";               // a synced 自测 attempt: result only, no text
const ghToken = () => store.get("vk.gh", "");
let syncState = {}, syncing = null, syncAgain = false, syncTimer = 0;
try { syncState = JSON.parse(store.get("vk.sync", "{}")) || {}; } catch(e){}

// key order doesn't matter when comparing with what's on GitHub
const stable = v => JSON.stringify(v, (k, x) => x && typeof x === "object" && !Array.isArray(x)
  ? Object.fromEntries(Object.keys(x).sort().map(k2 => [k2, x[k2]])) : x);
const normProgress = r => ({ v: 1, stages: r.stages || {}, cards: r.cards || {}, newDay: r.newDay || 0,
  newToday: r.newToday || 0, resetAt: r.resetAt || 0, attempts: r.attempts || {}, favs: r.favs || {} });
function progressOut(){
  const st = {}, at = {};
  for (const a in stages) st[a] = { s: stages[a], t: stageT[a] || 0 };
  for (const a in stLog) at[a] = stLog[a].map(x => ({ t: x.t, ok: x.ok, peek: !x.text, via: x.via, ex: x.ex || "" }));
  return normProgress({ stages: st, cards: rev.cards, newDay: rev.newDay, newToday: rev.newToday, resetAt: rev.resetAt, attempts: at, favs });
}
// Newest wins per entry (per sentence for ⭐); a reset drops every card graded before it; 自测 attempts are a union.
function applyRemote(r){
  r = normProgress(r);
  const resetAt = Math.max(rev.resetAt || 0, r.resetAt);
  const cards = {};
  for (const a of new Set([...Object.keys(rev.cards), ...Object.keys(r.cards)])) {
    const l = rev.cards[a], o = r.cards[a];
    const c = !o || (l && (l.t || 0) >= (o.t || 0)) ? l : o;
    if ((c.t || 0) >= resetAt) cards[a] = c;
  }
  const day = r.newDay > rev.newDay ? r : rev.newDay > r.newDay ? rev : { newDay: rev.newDay, newToday: Math.max(rev.newToday, r.newToday) };
  rev = { cards, newDay: day.newDay, newToday: day.newToday, resetAt };
  saveRev();
  for (const a in r.stages) {
    const o = r.stages[a];
    if (STAGE_NAME[o.s] && o.t > (stageT[a] || 0)) { stages[a] = o.s; stageT[a] = o.t; }
  }
  store.set("vk.stage", JSON.stringify(stages));
  store.set("vk.stage.t", JSON.stringify(stageT));
  for (const a in r.attempts) {
    const list = stLog[a] || [], seen = new Set(list.map(x => x.t));
    r.attempts[a].forEach(x => { if (!seen.has(x.t)) list.push({ t: x.t, text: x.peek ? "" : ELSEWHERE, ok: x.ok, via: x.via, ex: x.ex || "" }); });
    list.sort((x, y) => x.t - y.t);
    stLog[a] = list.slice(-ST_MAX);
  }
  store.set("vk.selftest", JSON.stringify(stLog));
  for (const a in r.favs) for (const en in r.favs[a]) {
    const o = r.favs[a][en], m = favs[a] = favs[a] || {};
    if (o.t > ((m[en] || {}).t || 0)) m[en] = { on: !!o.on, t: o.t };
  }
  store.set("vk.favs", JSON.stringify(favs));
}
const b64 = t => btoa(unescape(encodeURIComponent(t)));
const unb64 = t => decodeURIComponent(escape(atob(t.replace(/\s/g, ""))));
async function gh(method, body){
  const r = await fetch(GH + (method === "GET" ? "?ref=progress" : ""), {
    method, cache: "no-store", body: body && JSON.stringify(body),
    headers: { Authorization: "Bearer " + ghToken(), Accept: "application/vnd.github+json" },
  });
  if (r.status === 409 || r.status === 422) return null;    // someone wrote first: pull again
  if (!r.ok) throw new Error(r.status === 401 ? "token 无效或已过期" :
    r.status === 403 || r.status === 404 ? "token 没有 chinalwb/vocab 的读写权限" : "GitHub 返回 " + r.status);
  return r.json();
}
function syncNow(){
  if (!ghToken()) return Promise.resolve();
  if (syncing) { syncAgain = true; return syncing; }
  clearTimeout(syncTimer); syncTimer = 0;
  syncState.busy = true; paintSync();
  syncing = (async () => {
    for (let k = 0; k < 3; k++) {
      const got = await gh("GET");
      const remote = JSON.parse(unb64(got.content));
      applyRemote(remote);
      const out = progressOut();
      if (stable(out) === stable(normProgress(remote))) return;
      if (await gh("PUT", { message: "sync: progress from web", branch: "progress", sha: got.sha,
        content: b64(JSON.stringify(out, null, 1) + "\n") })) return;
    }
    throw new Error("连续冲突,稍后再试");
  })().then(() => { syncState = { ok: Date.now() }; }, e => { syncState = { ok: syncState.ok, err: e.message || String(e) }; })
    .finally(() => {
      syncing = null;
      store.set("vk.sync", JSON.stringify(syncState));
      refreshStages(); refreshStCounts();
      if (view !== "review" || !session) render();   // never yank a card I'm answering
      if (syncAgain) { syncAgain = false; syncNow(); }
    });
  return syncing;
}
// changes are batched: one commit per burst of activity, not per tap
function syncSoon(){ if (!ghToken()) return; clearTimeout(syncTimer); syncTimer = setTimeout(syncNow, 15000); }
document.addEventListener("visibilitychange", () => {

      `<div class="row"><button class="btn" type="button" id="qz-start"${queue.length ? "" : " disabled"}>${queue.length ? "开始考核 " + queue.length + " 题" : "还没有考核中的条目"}</button></div>`;
  } else {
    head = `<h2>掌握</h2><p class="note">已掌握的条目不再进复习和考核。在条目里点进度条上的别的阶段,可以移回去。</p>` +
      `<div class="stats" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div class="stat"><b>${mine.length}</b><span>已掌握</span></div><div class="stat"><b>${total}</b><span>共</span></div></div>`;
  }
  el.innerHTML = head;
  const start = el.querySelector("#qz-start");
  if (start) start.addEventListener("click", () => {
    quiz = { stage, queue: quizQueue(stage), index: 0, studied: false, revealed: false, draft: "", done: 0, ok: 0, checked: 0, advanced: 0 };
    render(); window.scrollTo(0, 0);
  });
  el.append(stageListEl(stage));
  refreshStCounts(); refreshStages();
}
function wireXrefs(el){
  const t = quiz && quiz.queue[quiz.index];
  if (t) markExamples(el, t.it);                          // ⭐ on the notes shown with the card
  el.querySelectorAll(".rcard .xref").forEach(a => {
    const x = byAnchor[a.dataset.ref];
    if (!x) { a.dataset.missing = "1"; return; }
    a.addEventListener("click", e => { e.preventDefault(); open(x.it, x.level, x.i); });
  });
}
function renderQuizCard(el){
  const s = quiz, t = s.queue[s.index], it = t.it, k = kind(t), exam = t.level === "SELFTEST", stage = s.stage;
  if (!exam && s.ex === undefined) s.ex = quizEx(it);     // this card's example, fixed for the card
  const ex = exam ? null : s.ex;
  const pct = Math.round(s.index / s.queue.length * 100);
  const top = `<div class="row"><div class="bar"><i style="width:${pct}%"></i></div><span class="toast">${s.index + 1} / ${s.queue.length}</span>` +
    `<button class="linkish" type="button" id="qz-stop">结束</button></div>`;
  const stop = () => { quiz = null; render(); };
  if (stage === "review" && !s.studied) {                   // 复习: read it again first
    el.innerHTML = top +
      `<div class="rcard" style="--sw:var(${LV[t.level].sw[t.i % 3]})"><p class="lab">先看一遍</p><p class="big" style="font-size:21px">${it.title}</p><div class="body">${notesHtml(it)}</div></div>` +
      `<button class="btn" type="button" id="qz-studied" style="width:100%">看完了,做题</button>`;
    el.querySelector("#qz-stop").addEventListener("click", stop);
    el.querySelector("#qz-studied").addEventListener("click", () => { s.studied = true; renderQuizCard(el); window.scrollTo(0, 0); });
    wireXrefs(el);
    return;
  }
  const ready = s.revealed && advanceReady(it, t.level, stage);
  const qAns = s.revealed ? null : answerOf(it, t.level, ex), bankOn = chipsMode && !!qAns;   // 选词
  el.innerHTML = top +
    `<div class="rcard" style="--sw:var(${LV[t.level].sw[t.i % 3]})">${ex ? exPrompt(ex) : askHtml(t, k)}` +
    `<p class="st-stats">${stStatsLine(it.anchor, ex ? plainMd(ex.en) : null)}</p>` +
    (s.revealed
      ? `<hr>` + (exam
          ? `<div class="st-res">${compareHtml(s.draft, it.answer || "", false)}</div>`
          : `<div class="st-res">${movedHtml(ex, s.draft, s.graded)}</div>`) + stHistoryHtml(it.anchor, ex ? plainMd(ex.en) : null) +
        (ready ? advanceHtml(stage) : "") +
        `<p class="big" style="font-size:21px">${it.title}</p><div class="body">${notesHtml(it)}</div>`
      : (qAns ? `<div class="amode-row">${modeToggleHtml()}</div>` : "") +
        `<textarea class="draft" id="qz-draft" placeholder="不看笔记,写出英文…(⌘/Ctrl + Enter 显示答案)"${bankOn ? " hidden" : ""}>${esc(s.draft)}</textarea>` +
        (bankOn ? `<div class="wb-ans" id="wb-ans"></div><div class="wb-bank" id="wb-bank"></div>` : "")) +
    `</div>` +
    (s.revealed
      ? `<div class="grades" style="grid-template-columns:${ready ? "1fr 1fr" : "1fr"}">` +
        (ready ? `<button class="btn ghost" type="button" id="qz-adv">移到${STAGE_TAB[nextStage(stage)]}</button>` : "") +
        `<button class="btn" type="button" id="qz-next">${s.index + 1 < s.queue.length ? "下一题" : "完成"}</button></div>`
      : `<button class="btn" type="button" id="qz-reveal" style="width:100%">显示答案</button>`);
  const next = adv => {
    if (adv) { setStage(it, nextStage(stage)); s.advanced++; }
    s.index++; s.done++; s.revealed = false; s.draft = ""; s.graded = undefined; s.ex = undefined; s.studied = false; s.picks = undefined;
    render(); window.scrollTo(0, 0);
  };
  const via = stage;                                        // "review" / "test" in the history
  el.querySelectorAll(".st-res [data-ok]").forEach(b => b.addEventListener("click", () => {
    s.graded = b.dataset.ok === "1";
    logAttempt(it.anchor, s.draft, s.graded, via);
    if (stage === "review") scheduleReview(it.anchor, s.graded);
    s.checked++; if (s.graded) s.ok++;
    renderQuizCard(el);
  }));
  el.querySelector("#qz-stop").addEventListener("click", stop);
  const d = el.querySelector("#qz-draft");
  const reveal = () => {
    const tried = !!s.draft.trim();
    let ok = null;
    if (exam) { recordAttempt(it.anchor, s.draft, it.answer || "", via); ok = tried && bestDiff(s.draft, it.answer || "").same; }
    else if (ex) { recordAttempt(it.anchor, s.draft, plainMd(ex.en), via, plainMd(ex.en)); ok = tried && bestDiff(s.draft, plainMd(ex.en)).same; }
    else if (!tried) { logAttempt(it.anchor, "", false, via); ok = false; }
    if (ok !== null) { if (tried) { s.checked++; if (ok) s.ok++; } if (stage === "review") scheduleReview(it.anchor, ok); }
    s.revealed = true; renderQuizCard(el);
  };
  if (d) {
    d.addEventListener("input", () => { s.draft = d.value; });
    d.addEventListener("keydown", e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) reveal(); });
    if (bankOn) mountBank(el.querySelector("#wb-ans"), el.querySelector("#wb-bank"), d, qAns, othersOf(it, qAns), hashStr(it.anchor) + s.index, s.picks = s.picks || []);
    else d.focus();
  }
  const am = el.querySelector(".amode");
  if (am) am.addEventListener("click", e => {
    const b = e.target.closest("button[data-chips]");
    if (!b || (b.dataset.chips === "1") === chipsMode) return;
    setChipsMode(b.dataset.chips === "1");
    if (chipsMode) s.picks = [];                            // to 打字 keeps the sentence built so far
    renderQuizCard(el);
  });
  const rv = el.querySelector("#qz-reveal"); if (rv) rv.addEventListener("click", reveal);
  const nx = el.querySelector("#qz-next"); if (nx) { nx.addEventListener("click", () => next(false)); nx.focus(); }
  const ad = el.querySelector("#qz-adv"); if (ad) ad.addEventListener("click", () => next(true));
  const ab = el.querySelector("#adv"); if (ab) ab.addEventListener("click", () => next(true));
  wireXrefs(el);
}
// ── 更多: the 错题本 (above, its own section), 练习 and 同步 — what left the tabs ──
function renderExtras(){
  if (extrasEl.dataset.built) { paintSync(); renderPractice(); return; }
  extrasEl.dataset.built = "1";
  extrasEl.innerHTML =
    `<h2 style="margin-top:32px">练习</h2><details class="prac" id="prac"${store.get("vk.prac", "0") === "1" ? " open" : ""}><summary>今日仿写 / 本周段落</summary></details>` +
    `<h2 style="margin-top:32px">同步</h2><div class="sync" id="sync"></div>` +
    `<p style="margin-top:20px"><button class="linkish" type="button" id="rv-reset">重置复习排期</button></p>`;
  const prac = extrasEl.querySelector("#prac");
  prac.append(practiceEl);
  renderPractice();
  prac.addEventListener("toggle", () => store.set("vk.prac", prac.open ? "1" : "0"));
  paintSync();
  extrasEl.querySelector("#rv-reset").addEventListener("click", function(){
    if (!resetArmed) { resetArmed = true; this.textContent = "确定清空全部复习排期?再点一次确认"; return; }
    // resetAt tells the other devices to drop their older cards too
    resetArmed = false; rev = { cards: {}, newDay: 0, newToday: 0, resetAt: Date.now() }; saveRev(); syncSoon(); this.textContent = "重置复习排期";
  });
}

// ── 练习: a daily imitation task and a weekly paragraph. The app picks the same ones
// (ui/PracticeScreen.kt): pool = 会写 entries that aren't 句子 / 自测, sorted by anchor. ──
const POOL = ALL.filter(t => t.it.mastery === "write" && t.level !== "SENTENCE" && t.level !== "SELFTEST")
  .sort((a, b) => a.it.anchor < b.it.anchor ? -1 : a.it.anchor > b.it.anchor ? 1 : 0);
let skip = 0;                                             // 换一题 within this visit
const words = t => (t.match(/[A-Za-z]+(?:['’-][A-Za-z]+)*/g) || []).length;

function renderPractice(){
  if (!POOL.length) { practiceEl.innerHTML = `<p class="note">还没有标「会写」的条目。</p>`; return; }
  const day = dayNo(), week = Math.floor((day + 3) / 7);
  const daily = POOL[(day + skip) % POOL.length];
  const weekly = [0, 1, 2, 3, 4].map(k => POOL[(week * 5 + k) % POOL.length])
    .filter((t, i, a) => a.indexOf(t) === i);
  const dKey = "vk.draft.d." + day + "." + daily.it.anchor, wKey = "vk.draft.w." + week;
  const link = t => `<a class="xref" href="#${t.it.anchor}" data-ref="${t.it.anchor}">${t.it.title}</a>`;
  const dateStr = new Date().toLocaleDateString("zh-CN");
  practiceEl.innerHTML =
    `<p class="note">写完点「复制」,发到和 Claude 的对话里,按 ❌ / ⚠️ / ✅ 批改。草稿存在这个浏览器里。</p>` +
    `<div class="task"><h3>今日仿写</h3><p class="meta2">${dateStr} · 每天一题,从「会写」的条目里轮换</p>` +
    `<p class="ask">${daily.level === "GRAMMAR" ? "按 " + link(daily) + " 这条规则" : "用 " + link(daily) + " 里的表达"},写 3 句关于你自己工作或生活的<b>真实</b>句子。</p>` +
    `<textarea class="draft" id="pr-d" placeholder="1. …&#10;2. …&#10;3. …">${esc(store.get(dKey, ""))}</textarea>` +
    `<div class="foot2"><button class="linkish" type="button" id="pr-skip">换一题</button>` +
    `<button class="btn" type="button" id="pr-dc">复制去批改</button></div></div>` +
    `<div class="task"><h3>本周段落</h3><p class="meta2">每周一换 · 80–100 词</p>` +
    `<p class="ask">写一段 80–100 词的短文(工作近况、这周学到的东西都行),至少用上其中 3 个:</p>` +
    `<div class="chips">${weekly.map(t => `<button type="button" data-ref="${t.it.anchor}">${t.it.title}</button>`).join("")}</div>` +
    `<textarea class="draft" id="pr-w" style="min-height:150px" placeholder="…">${esc(store.get(wKey, ""))}</textarea>` +
    `<div class="foot2"><span class="wc" id="pr-wc"></span><button class="btn" type="button" id="pr-wcpy">复制去批改</button></div></div>`;
  const d = practiceEl.querySelector("#pr-d"), w = practiceEl.querySelector("#pr-w"), wc = practiceEl.querySelector("#pr-wc");
  const count = () => { const n = words(w.value); wc.textContent = n + " 词" + (n >= 80 && n <= 100 ? " ✓" : ""); };
  count();
  d.addEventListener("input", () => store.set(dKey, d.value));
  w.addEventListener("input", () => { store.set(wKey, w.value); count(); });
  practiceEl.querySelector("#pr-skip").addEventListener("click", () => { skip++; renderPractice(); });
  practiceEl.querySelector("#pr-dc").addEventListener("click", e => copyText(
    `【今日仿写 ${dateStr}】${daily.level === "GRAMMAR" ? "按" : "用"}「${daily.it.title}」写 3 句真实的句子,请按 ❌ / ⚠️ / ✅ 批改:\n\n${d.value.trim()}`, e.currentTarget));
  practiceEl.querySelector("#pr-wcpy").addEventListener("click", e => copyText(
    `【本周段落】目标表达:${weekly.map(t => t.it.title).join(" · ")}。请按 ❌ / ⚠️ / ✅ 批改,并说说段落衔接:\n\n${w.value.trim()}`, e.currentTarget));
  practiceEl.querySelectorAll(".xref, .chips [data-ref]").forEach(a => a.addEventListener("click", e => {
    e.preventDefault();
    const x = byAnchor[a.dataset.ref];
    if (x) open(x.it, x.level, x.i);
  }));
}

refreshStCounts();
refreshStages();
render();
syncNow();
</script>
