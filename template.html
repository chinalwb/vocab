<!--HEAD-->
<title>词汇便签墙</title>
<script>
  // stamp the saved theme before paint so there's no flash of the wrong palette
  try {
    var t = localStorage.getItem("vk.theme");
    if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
:root{
  color-scheme: light;
  /* Same as the App: Atkinson Hyperlegible for Latin; Chinese falls through to Noto Sans SC,
     the face Android draws Chinese in (Noto Sans CJK), so both read alike on every screen. */
  /* every font size is calc(Npx * var(--fs)): one knob for all text, like FONT_SCALE in the App */
  --fs:1.25;
  --font:"Atkinson Hyperlegible","Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --ground:#f3f4f6;
  --ink:#15171c;
  --ink-2:#4b5060;
  --ink-3:#6b7080;
  --rule:#e3e5ea;
  --chip:#ffffff;
  --chip-on:#15171c;
  --chip-on-ink:#f3f4f6;
  --shadow:0 1px 2px rgba(21,23,28,.10), 0 1px 3px 1px rgba(21,23,28,.07);
  --shadow-lift:0 2px 6px rgba(21,23,28,.14), 0 8px 20px -6px rgba(21,23,28,.18);
  --scrim:rgba(21,23,28,.42);
  --card-ink:#15171c;
  --card-ink-2:#4b5060;
  --card-edge:rgba(21,23,28,.10);

  --a1-1:#dcecd4; --a1-2:#cde5c6; --a1-3:#e7f2e1;
  --a2-1:#cbe7e1; --a2-2:#bbdfd8; --a2-3:#dbefeb;
  --b1-1:#d2e3f4; --b1-2:#c1d9ef; --b1-3:#e0ecf8;
  --b2-1:#fbf0bd; --b2-2:#f7e8a4; --b2-3:#fdf6d4;
  --c1-1:#fbdcc0; --c1-2:#f7cea7; --c1-3:#fde9d6;
  --c2-1:#f7cfc9; --c2-2:#f2bab2; --c2-3:#fadfdb;
  --tm-1:#ddd9f2; --tm-2:#cec9ea; --tm-3:#e9e6f7;
  --gr-1:#f2d5e4; --gr-2:#ebc2d7; --gr-3:#f7e4ee;
  --sn-1:#e8d7c3; --sn-2:#dfcaaf; --sn-3:#f1e5d7;
  --st-1:#d6e0e6; --st-2:#c6d4dc; --st-3:#e4ecf0;

  --accent:#2b4acb; --accent-ink:#ffffff; --st-learn:#8a8f9c; --st-test:#e0812f; --st-done:#3e9b5b;
  --err:#c2412d; --warn:#b7791f; --mk:#ffffff; --tag:#e9ebef; --tag-ink:#4b5060;
  /* liquid glass (after iOS 26): frosted controls floating over the cards */
  --glass:rgba(243,244,246,.72); --glass-strong:rgba(243,244,246,.86);
  --glass-fill:rgba(255,255,255,.66); --glass-rim:rgba(255,255,255,.9); --glass-edge:rgba(21,23,28,.09);
  --glass-shadow:0 8px 28px rgba(21,23,28,.12), 0 1px 2px rgba(21,23,28,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --ground:#14161a;
    --ink:#e8eaee;
    --ink-2:#b9bdc7;
    --ink-3:#8a8f9c;
    --rule:#2a2e36;
    --chip:#1e2127;
    --chip-on:#e8eaee;
    --chip-on-ink:#14161a;
    --shadow:0 1px 2px rgba(0,0,0,.45), 0 1px 3px 1px rgba(0,0,0,.3);
    --shadow-lift:0 2px 8px rgba(0,0,0,.55), 0 10px 24px -6px rgba(0,0,0,.5);
    --scrim:rgba(0,0,0,.62);
    --card-ink:#efede6;
    --card-ink-2:#c9c6bb;
    --card-edge:rgba(255,255,255,.09);

    --a1-1:#2e4a2a; --a1-2:#375835; --a1-3:#263f23;
    --a2-1:#1d4a45; --a2-2:#245853; --a2-3:#173d39;
    --b1-1:#254460; --b1-2:#2c5273; --b1-3:#1e3950;
    --b2-1:#57501c; --b2-2:#665e22; --b2-3:#484216;
    --c1-1:#5a3a1d; --c1-2:#6b4623; --c1-3:#4a3017;
    --c2-1:#5b2b28; --c2-2:#6d3430; --c2-3:#4b2320;
    --tm-1:#3b3364; --tm-2:#473d76; --tm-3:#312a54;
    --gr-1:#562a44; --gr-2:#663251; --gr-3:#472238;
    --sn-1:#4a3626; --sn-2:#58402d; --sn-3:#3d2d20;
    --st-1:#2c3a43; --st-2:#34454f; --st-3:#253139;

    --accent:#8ea2ff; --accent-ink:#10142a;
    --err:#f08a78; --warn:#e6b35c; --mk:#1b1e23; --tag:#2a2e36; --tag-ink:#cfd3db;
  --glass:rgba(20,22,26,.72); --glass-strong:rgba(20,22,26,.86);
  --glass-fill:rgba(255,255,255,.06); --glass-rim:rgba(255,255,255,.14); --glass-edge:rgba(255,255,255,.08);
  --glass-shadow:0 10px 30px rgba(0,0,0,.45), 0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --ground:#14161a;
  --ink:#e8eaee;
  --ink-2:#b9bdc7;
  --ink-3:#8a8f9c;
  --rule:#2a2e36;
  --chip:#1e2127;
  --chip-on:#e8eaee;
  --chip-on-ink:#14161a;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 1px 3px 1px rgba(0,0,0,.3);
  --shadow-lift:0 2px 8px rgba(0,0,0,.55), 0 10px 24px -6px rgba(0,0,0,.5);
  --scrim:rgba(0,0,0,.62);
  --card-ink:#efede6;
  --card-ink-2:#c9c6bb;
  --card-edge:rgba(255,255,255,.09);

  --a1-1:#2e4a2a; --a1-2:#375835; --a1-3:#263f23;
  --a2-1:#1d4a45; --a2-2:#245853; --a2-3:#173d39;
  --b1-1:#254460; --b1-2:#2c5273; --b1-3:#1e3950;
  --b2-1:#57501c; --b2-2:#665e22; --b2-3:#484216;
  --c1-1:#5a3a1d; --c1-2:#6b4623; --c1-3:#4a3017;
  --c2-1:#5b2b28; --c2-2:#6d3430; --c2-3:#4b2320;
  --tm-1:#3b3364; --tm-2:#473d76; --tm-3:#312a54;
  --gr-1:#562a44; --gr-2:#663251; --gr-3:#472238;
  --sn-1:#4a3626; --sn-2:#58402d; --sn-3:#3d2d20;
  --st-1:#2c3a43; --st-2:#34454f; --st-3:#253139;

  --accent:#8ea2ff; --accent-ink:#10142a;
  --err:#f08a78; --warn:#e6b35c; --mk:#1b1e23; --tag:#2a2e36; --tag-ink:#cfd3db;
  --glass:rgba(20,22,26,.72); --glass-strong:rgba(20,22,26,.86);
  --glass-fill:rgba(255,255,255,.06); --glass-rim:rgba(255,255,255,.14); --glass-edge:rgba(255,255,255,.08);
  --glass-shadow:0 10px 30px rgba(0,0,0,.45), 0 1px 2px rgba(0,0,0,.3);
}

*{box-sizing:border-box}
body{
  background:var(--ground);
  color:var(--ink);
  font-family:var(--font);
  font-size:calc(15px * var(--fs));
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
.wrap{padding-inline:16px;padding-block:0 64px;max-width:1500px;margin:0 auto}

/* ── header ─────────────────────────────── */
.top{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
  background:var(--glass);
  -webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6);
  border-bottom:1px solid var(--glass-edge);
  margin-inline:-16px;padding:14px 16px 12px;
  display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:16px;align-items:center;
  grid-template-areas:"brand hx" "tabs tabs" "tools tools" "fsum fsum";
}
.brand{grid-area:brand;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px;min-width:0}
.hx{grid-area:hx;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.tools{grid-area:tools}.fsum{grid-area:fsum}
.tabs{grid-area:tabs;display:flex;gap:2px;margin:0 0 10px;border-bottom:1px solid var(--rule);overflow-x:auto}
/* the header's right side: today's 复习 (accent) and the sync state */
.today{font:inherit;font-size:calc(13.5px * var(--fs));font-weight:700;height:34px;padding:0 14px;border-radius:999px;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer;white-space:nowrap}
.today.idle{background:var(--chip);color:var(--ink-2);border:1px solid var(--rule);font-weight:500}
.syncdot{font:inherit;font-size:calc(12.5px * var(--fs));color:var(--ink-2);background:none;border:0;padding:4px 6px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;border-radius:8px}
.syncdot i{width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.syncdot.ok i{background:var(--st-done)}.syncdot.err i{background:var(--err)}.syncdot.busy i{background:var(--accent)}
.today:focus-visible,.syncdot:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
@media (max-width:639px){ .today,.syncdot{display:none} }
/* off 浏览 the search row is hidden: the tab rule is then the header's only line */
.top:has(#tools[hidden]){border-bottom-color:transparent;padding-bottom:0}
.top:has(#tools[hidden]) .tabs{margin-bottom:0}
.tab{
  font:inherit;font-size:calc(14px * var(--fs));font-weight:500;color:var(--ink-3);
  background:none;border:0;border-bottom:2px solid transparent;
  padding:6px 12px 7px;margin-bottom:-1px;cursor:pointer;white-space:nowrap;
}
.tab .n{font-size:calc(12px * var(--fs));opacity:.7;margin-left:4px;font-variant-numeric:tabular-nums}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tab:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
h1{
  font-family:var(--font);
  font-weight:600;font-size:calc(26px * var(--fs));line-height:1.15;margin:0;letter-spacing:-.01em;
}
.tally{color:var(--ink-3);font-size:calc(12.5px * var(--fs));letter-spacing:.04em}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search{
  flex:1 1 200px;min-width:0;max-width:320px;
  background:var(--glass-fill);color:var(--ink);
  border:1px solid var(--glass-edge);border-radius:999px;box-shadow:inset 0 1px 0 var(--glass-rim);
  padding:7px 14px;font:inherit;font-size:calc(13.5px * var(--fs));
}
.search::placeholder{color:var(--ink-3)}
.search:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.fbtn{
  font:inherit;font-size:calc(13px * var(--fs));font-weight:500;color:var(--ink-2);
  background:var(--glass-fill);border:1px solid var(--glass-edge);border-radius:999px;box-shadow:inset 0 1px 0 var(--glass-rim);
  padding:6px 13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
}
.fbtn[aria-expanded="true"],.fbtn.on{border-color:var(--ink-3);color:var(--ink)}
.fbtn:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.fb-n{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--chip-on);color:var(--chip-on-ink);font-size:calc(11px * var(--fs));font-weight:600;display:inline-grid;place-items:center;font-variant-numeric:tabular-nums}
.fsum{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px;font-size:calc(12px * var(--fs))}
.fsum:empty{display:none}
.fchip{font:inherit;font-size:calc(12px * var(--fs));color:var(--ink);background:var(--chip);border:1px solid var(--rule);border-radius:999px;padding:3px 6px 3px 11px;display:inline-flex;align-items:center;gap:4px;cursor:pointer}
.fchip span{opacity:.55;font-size:calc(13px * var(--fs));line-height:1;padding:0 3px}
.fchip:hover span{opacity:1}
.fchip:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.fsum .cnt{margin-left:auto;color:var(--ink-3);font-variant-numeric:tabular-nums}
/* the panel: a bottom sheet on phones, a dropdown under 筛选 on wider screens */
.fback{position:fixed;inset:0;z-index:40;background:rgb(0 0 0 / .18)}
.fsheet{
  position:fixed;z-index:41;left:0;right:0;bottom:0;max-height:85vh;overflow:auto;
  background:var(--glass-strong);color:var(--ink);border-radius:20px 20px 0 0;
  -webkit-backdrop-filter:blur(24px) saturate(1.6);backdrop-filter:blur(24px) saturate(1.6);
  border-top:1px solid var(--glass-edge);
  box-shadow:inset 0 1px 0 var(--glass-rim), 0 -8px 30px rgb(0 0 0 / .18);
  padding:0 16px calc(12px + env(safe-area-inset-bottom,0px));
}
.fsh-head{position:sticky;top:0;display:flex;align-items:center;padding:14px 0 10px;font-size:calc(15px * var(--fs))}
.fsh-grab{position:absolute;top:6px;left:50%;width:36px;height:4px;margin-left:-18px;border-radius:2px;background:var(--rule)}
.fsh-head .fclear{margin-left:auto}
.filters{display:flex;flex-direction:column;gap:14px}
.frow{display:flex;flex-direction:column;gap:7px}
.fp{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.flab{font-size:calc(11.5px * var(--fs));font-weight:600;letter-spacing:.08em;color:var(--ink-3)}
.fsh-foot{position:sticky;bottom:0;padding:14px 0 2px}
.fgo{width:100%;font:inherit;font-size:calc(14px * var(--fs));font-weight:600;padding:10px;border-radius:999px;border:0;cursor:pointer;background:var(--chip-on);color:var(--chip-on-ink)}
.fgo:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
@media (min-width:640px){
  .fback{background:transparent}
  .fsheet{left:auto;right:auto;bottom:auto;width:440px;max-height:75vh;border-radius:18px;border:1px solid var(--glass-edge);box-shadow:inset 0 1px 0 var(--glass-rim), var(--glass-shadow);padding-bottom:12px}
  .fsh-grab{display:none}
  .fsh-foot{display:none}
}
.wr-box{
  font:inherit;font-size:calc(12.5px * var(--fs));font-weight:500;letter-spacing:.03em;color:var(--ink-2);
  background:none;border:0;padding:4px 2px;cursor:pointer;
  display:inline-flex;align-items:center;gap:7px;
}
.wr-box .box{width:15px;height:15px;border:1.5px solid var(--ink-3);border-radius:4px;display:inline-grid;place-items:center}
.wr-box[aria-checked="true"] .box{background:var(--chip-on);border-color:var(--chip-on)}
.wr-box[aria-checked="true"] .box::after{content:"";width:7px;height:4px;border:2px solid var(--chip-on-ink);border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
.wr-box:focus-visible,.fclear:focus-visible{outline:2px solid var(--ink);outline-offset:1px;border-radius:6px}
.fclear{font:inherit;font-size:calc(13px * var(--fs));color:var(--ink-3);background:none;border:0;padding:4px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.pill{
  font:inherit;font-size:calc(12px * var(--fs));font-weight:500;letter-spacing:.03em;
  background:var(--chip);color:var(--ink-2);
  border:1px solid var(--rule);border-radius:999px;
  padding:5px 12px;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;
}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--sw)}
.pill[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink);border-color:var(--chip-on)}
.pill:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.theme{
  flex:0 0 auto;align-self:center;
  width:32px;height:32px;padding:0;
  display:inline-grid;place-items:center;
  background:var(--chip);color:var(--ink-2);
  border:1px solid var(--rule);border-radius:50%;cursor:pointer;
}
.theme:hover{color:var(--ink)}
.theme:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.theme svg{width:16px;height:16px;display:block}

/* ── sections ───────────────────────────── */
.sect{margin-top:34px}
.sect-head{display:flex;align-items:baseline;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.sect-head .badge{
  font-family:var(--font);font-weight:600;font-size:calc(17px * var(--fs));
  background:var(--sw);color:var(--card-ink);
  border:1px solid var(--card-edge);
  border-radius:8px;padding:2px 11px;letter-spacing:.02em;
}
.sect-head .nm{font-size:calc(14px * var(--fs));color:var(--ink-2);font-weight:500}
.sect-head .ct{font-size:calc(12px * var(--fs));color:var(--ink-3);letter-spacing:.04em}

.grid{columns:4 250px;column-gap:14px}
.card{
  break-inside:avoid;-webkit-column-break-inside:avoid;
  /* skip layout for off-screen cards; `auto` lets the browser remember each
     card's real height once measured, so the scrollbar stays stable */
  content-visibility:auto;contain-intrinsic-size:auto 190px;
  background:var(--sw);color:var(--card-ink);
  border:1px solid var(--card-edge);border-radius:10px;
  padding:13px 15px 12px;margin-bottom:14px;
  box-shadow:var(--shadow);cursor:pointer;text-align:left;width:100%;
  font:inherit;display:block;
  transition:box-shadow .16s ease, transform .16s ease;
}
.card:hover{box-shadow:var(--shadow-lift);transform:translateY(-1px)}
.card:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.hw{
  font-family:var(--font);
  font-weight:600;font-size:calc(19px * var(--fs));line-height:1.25;margin:0 0 5px;
  letter-spacing:-.005em;text-wrap:balance;
}
.meta{display:flex;flex-wrap:wrap;gap:4px 8px;margin-bottom:7px;font-size:calc(11.5px * var(--fs));color:var(--card-ink-2);line-height:1.45}
.card .meta{max-height:3.1em;overflow:hidden}
.meta .pos{font-weight:500}
.meta .ipa{font-variant-numeric:tabular-nums;opacity:.9}
.gloss{
  margin:0;font-size:calc(13.5px * var(--fs));line-height:1.62;color:var(--card-ink-2);
  display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;
}
.foot{
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  margin-top:10px;padding-top:8px;border-top:1px solid var(--card-edge);
  font-size:calc(11px * var(--fs));color:var(--card-ink-2);letter-spacing:.05em;
}
.foot .flv{font-weight:700}
.foot .no{font-variant-numeric:tabular-nums;opacity:.75;margin-right:6px}
.foot .dt{font-variant-numeric:tabular-nums;white-space:nowrap;opacity:.8}

.empty{color:var(--ink-3);font-size:calc(14px * var(--fs));padding:48px 0;text-align:center}

/* ── modal ──────────────────────────────── */
.scrim{
  position:fixed;inset:0;z-index:50;background:var(--scrim);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  display:flex;align-items:flex-start;justify-content:center;
  padding:max(24px,env(safe-area-inset-top,0px)) 16px 40px;overflow-y:auto;
}
.sheet{
  background:var(--sw);color:var(--card-ink);
  border:1px solid var(--card-edge);border-radius:14px;
  box-shadow:var(--shadow-lift);
  width:min(680px,100%);padding:22px 24px 22px;position:relative;
  /* three bands like the app's entry page — the headword, the levels, and a card that takes the
     rest of the height and scrolls inside — so the sheet is as tall as the viewport */
  height:calc(100dvh - 64px);display:flex;flex-direction:column;overflow:hidden;box-sizing:border-box;
}
/* meta band: the title and one pill (type · 词性 · 音标 ›); the details unfold under it */
.mband{flex:none}
.mpill{font:inherit;font-size:calc(12.5px * var(--fs));color:var(--card-ink);background:color-mix(in srgb, var(--card-ink) 8%, transparent);border:0;border-radius:999px;padding:5px 7px 5px 12px;display:inline-flex;align-items:center;gap:3px;max-width:100%;cursor:pointer;margin-top:2px}
.mpill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mpill svg{flex:none;width:16px;height:16px}
.mpill:focus-visible{outline:2px solid var(--card-ink);outline-offset:2px}
.mdet{margin:10px 0 0;font-size:calc(13px * var(--fs));display:grid;grid-template-columns:auto 1fr;gap:5px 14px}
.mdet[hidden]{display:none}
.mdet b{font-weight:500;color:var(--card-ink-2)}
/* progress band, drawn as levels: three nodes on a track, filled up to the one the entry is at */
.lv{display:grid;grid-template-columns:repeat(var(--n,4),1fr);position:relative;margin:16px 0 12px;flex:none;--n:4;--k:0}
.lv::before,.lv::after{content:"";position:absolute;top:13px;left:calc(50% / var(--n));height:3px;border-radius:2px;background:var(--card-edge);width:calc(100% - 100% / var(--n))}
.lv::after{background:var(--card-ink);width:calc((100% - 100% / var(--n)) * var(--k) / (var(--n) - 1));transition:width .3s}
/* 朗读: the browser's own speech synthesis */
.spk{font:inherit;display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;border:0;background:transparent;color:var(--card-ink-2);cursor:pointer;vertical-align:middle;margin-left:4px;padding:0}
.spk svg{width:17px;height:17px}
.spk:hover{background:var(--card-edge)}
.spk:focus-visible{outline:2px solid var(--card-ink);outline-offset:1px}
.sheet h2 .spk{width:30px;height:30px}
.sheet h2 .spk svg{width:20px;height:20px}
.adv{display:flex;align-items:center;gap:10px;background:color-mix(in srgb, var(--card-ink) 6%, transparent);border-radius:12px;padding:6px 6px 6px 14px;margin:0 0 14px;font-size:calc(13.5px * var(--fs))}
.adv span{flex:1}
.lvl{font:inherit;font-size:calc(12.5px * var(--fs));color:var(--card-ink-2);background:none;border:0;padding:0 0 2px;cursor:pointer;position:relative;display:grid;justify-items:center;gap:6px;border-radius:10px}
.lvl:disabled{cursor:default}
.lvl .node{width:28px;height:28px;border-radius:50%;border:2px solid var(--card-edge);background:var(--sw);display:grid;place-items:center;box-sizing:border-box;font-size:calc(13px * var(--fs));font-weight:700}
.lvl.passed .node{background:var(--card-ink);border-color:var(--card-ink);color:var(--sw)}
.lvl.on .node{border-color:var(--card-ink)}
.lvl.on .node::after{content:"";width:16px;height:16px;border-radius:50%;background:var(--card-ink)}
.lvl.on{color:var(--card-ink);font-weight:600}
.lvl:focus-visible{outline:2px solid var(--card-ink);outline-offset:2px}
/* the card: two faces like a coin — the notes and, while in 自测, the quiz — turned over in 3D */
.ecard{flex:1;min-height:0;position:relative;perspective:1400px}
.ecard .inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .65s cubic-bezier(.4,0,.2,1)}
.ecard.flipped .inner{transform:rotateY(180deg)}
.face{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:flex;flex-direction:column;box-sizing:border-box;
  background:color-mix(in srgb, var(--card-ink) 6%, transparent);border:1px solid var(--card-edge);border-radius:18px;padding:14px 16px;
}
.face.bk{transform:rotateY(180deg)}
.fh{display:flex;align-items:center;gap:12px;font-size:calc(12.5px * var(--fs));color:var(--card-ink-2);margin:0 0 10px;flex:none}
.fh .ln{flex:1;border-top:1px solid var(--card-edge)}
.fh button{font:inherit;font-size:calc(12.5px * var(--fs));color:var(--card-ink-2);background:none;border:0;padding:2px 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.fh .full{text-decoration:none;display:grid;place-items:center;width:26px;height:26px;border-radius:7px;padding:0;margin-left:-4px}
.fh .full svg{width:16px;height:16px}
.fh button:focus-visible{outline:2px solid var(--card-ink);outline-offset:2px;border-radius:4px}
/* 选词: the 选词 | 打字 switch, the sentence being built, and the chips (ui/SelfTest.kt) */
.amode{display:inline-flex;gap:2px;padding:2px;border:1px solid var(--card-edge);border-radius:999px;flex:none}
.amode button,.fh .amode button{font:inherit;font-size:calc(12px * var(--fs));line-height:1;padding:4px 10px;border-radius:999px;border:0;background:none;color:var(--card-ink-2);cursor:pointer;text-decoration:none}
.amode button[aria-pressed="true"]{background:var(--card-ink);color:var(--sw)}
.amode button:disabled{opacity:.4;cursor:default}
.amode-row{display:flex;justify-content:flex-end;margin:8px 0 0}
.wb-ans{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:72px;box-sizing:border-box;padding:10px;margin-top:10px;border:1.5px solid var(--card-ink-2);border-radius:12px;background:color-mix(in srgb, var(--chip) 55%, transparent);position:relative}
.wb-ans:has(.wb-clear){padding-right:60px}
.wb-ph{color:var(--card-ink-2);font-size:calc(14px * var(--fs));padding:4px}
.wchip{font-family:var(--font);font-size:calc(16px * var(--fs));line-height:1.2;padding:5px 10px;border-radius:10px;border:1px solid var(--card-edge);background:var(--chip);color:var(--card-ink);cursor:pointer}
.wb-ans .wchip{background:var(--card-ink);border-color:var(--card-ink);color:var(--sw)}
.wchip.used{background:color-mix(in srgb, var(--card-ink) 8%, transparent);border-color:transparent;color:transparent;cursor:default}
.wb-clear{position:absolute;top:6px;right:6px;font:inherit;font-size:calc(12.5px * var(--fs));color:var(--card-ink-2);background:none;border:0;padding:6px 8px;cursor:pointer;border-radius:8px}
.wb-bank{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.wb-bank .wchip{font-size:calc(17px * var(--fs));padding:8px 14px}
.wb-ans span.wchip{opacity:.75;cursor:default}
.wb-done{color:var(--card-ink-2);font-size:calc(13px * var(--fs));padding:8px 0}
.face .cta .wb-bank{margin:0 0 10px}
.wchip:focus-visible,.wb-clear:focus-visible,.amode button:focus-visible{outline:2px solid var(--card-ink);outline-offset:2px}
.wb-ans[hidden],.wb-bank[hidden],textarea.draft[hidden]{display:none}
.face .body.fillb{display:flex;flex-direction:column;flex:1;min-height:0}
.face .scrollq{flex:1;min-height:0;overflow-y:auto;padding-top:2px}
.face .st-stats{margin-top:0}
.face .st-res{margin-top:4px}
.face .cta,.face .foot{flex:none;margin-top:10px}
.face .cta .btn{width:100%}
.face .st .st-prompt>:first-child{margin-top:0}
.st-title{display:none}
.sheet.full .st-title{display:block}
.sheet.full .mpill,.sheet.full .mdet,.sheet.full .lv{display:none}
/* ⤢ 全屏: the card takes the whole screen it has, not the sheet's reading width */
.scrim:has(.sheet.full){padding:8px}
.sheet.full{width:100%;height:calc(100dvh - 16px)}
.sheet.full h2{font-size:calc(17px * var(--fs));margin:0 0 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-wrap:unset}
.sheet textarea.draft{border:1.5px solid var(--card-ink-2);background:color-mix(in srgb, var(--chip) 55%, transparent);margin-top:10px;border-radius:12px;color:var(--card-ink)}
.sheet textarea.draft:focus-visible{outline:none;border-color:var(--card-ink)}
/* examples in the sheet: every translated one is a 自测 question (number in a filled dot) unless
   I click it out (hollow dot, dimmed) */
.sheet .body ol.ex{counter-reset:ex;padding-left:24px}
.sheet .body ol.ex li{counter-increment:ex;list-style:none;position:relative}
.sheet .body ol.ex li::before{content:counter(ex);position:absolute;left:-24px;top:2px;font-size:calc(12px * var(--fs));color:var(--card-ink-2)}
.sheet .body ol.ex li.qz{cursor:pointer}
.sheet .body ol.ex li.qz::before{width:16px;height:16px;border-radius:50%;background:var(--card-ink);color:var(--sw);font-size:calc(10px * var(--fs));font-weight:600;display:grid;place-items:center;top:4px;left:-23px;box-sizing:border-box}
.sheet .body ol.ex li.qz.out{opacity:.45}
.sheet .body ol.ex li.qz.out::before{background:transparent;border:1.5px solid var(--card-ink-2);color:var(--card-ink-2)}
.qz-cap{font-size:calc(11.5px * var(--fs));color:var(--card-ink-2);margin:-6px 0 12px 24px}
/* ⭐ on a starred example; the long-press menu (a bottom sheet over the entry sheet) */
.body ol.ex li .star::before{content:"⭐";font-size:.8em;margin-left:4px}
.sheet .body ol.ex > li[data-key]{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.exm-back{position:fixed;inset:0;z-index:70;background:var(--scrim)}
.exm{position:fixed;z-index:71;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;background:var(--ground);color:var(--ink);border-radius:20px 20px 0 0;box-shadow:var(--shadow-lift);padding:18px 0 calc(10px + env(safe-area-inset-bottom,0px))}
.exm-en{margin:0 24px;font-family:var(--font);font-size:calc(18px * var(--fs));line-height:1.4}
.exm-zh{margin:4px 24px 0;font-size:calc(14px * var(--fs));color:var(--ink-2)}
.exm button{display:block;width:100%;text-align:left;font:inherit;font-size:calc(15px * var(--fs));color:inherit;background:none;border:0;padding:14px 24px;cursor:pointer}
.exm button:first-of-type{margin-top:10px;border-top:1px solid var(--rule)}
.exm button:hover,.exm button:focus-visible{background:var(--rule);outline:none}
.flash{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:var(--chip-on);color:var(--chip-on-ink);font-size:calc(13px * var(--fs));padding:9px 16px;border-radius:999px;box-shadow:var(--shadow-lift);opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.flash.on{opacity:1}
.sheet h2{
  font-family:var(--font);
  font-weight:600;font-size:calc(25px * var(--fs));line-height:1.2;margin:0 0 8px;padding-right:40px;
  text-wrap:balance;
}
.sheet .meta{font-size:calc(12.5px * var(--fs));margin-bottom:16px}
.x{
  position:absolute;top:14px;right:14px;
  width:30px;height:30px;border-radius:50%;
  background:transparent;border:1px solid var(--card-edge);
  color:var(--card-ink-2);font:inherit;font-size:calc(15px * var(--fs));line-height:1;cursor:pointer;
}
.x:hover{background:var(--card-edge)}
.nx{
  position:absolute;top:14px;right:52px;height:30px;padding:0 12px;border-radius:999px;
  background:var(--card-ink);color:var(--sw);border:0;font:inherit;font-size:calc(12.5px * var(--fs));cursor:pointer;white-space:nowrap;
}
.nx:focus-visible{outline:2px solid var(--card-ink);outline-offset:2px}
.sheet.has-nx h2{padding-right:150px}
.sheet.has-nx .back{max-width:calc(100% - 190px)}
.x:focus-visible{outline:2px solid var(--card-ink);outline-offset:1px}
.back{
  display:inline-block;margin:0 0 10px;padding:3px 10px 3px 8px;
  background:var(--card-edge);color:var(--card-ink-2);
  border:1px solid var(--card-edge);border-radius:999px;
  font:inherit;font-size:calc(12px * var(--fs));cursor:pointer;text-align:left;
  /* the sheet is a flex column: keep it its own width, clear of the ✕ at the top right */
  align-self:flex-start;max-width:calc(100% - 44px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.back:hover{color:var(--card-ink)}
.back:focus-visible{outline:2px solid var(--card-ink);outline-offset:1px}
.body{font-size:calc(14px * var(--fs));color:var(--card-ink)}
.body p{margin:0 0 11px}
.body strong{font-weight:700}
.body code{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.9em;
  background:var(--card-edge);padding:1px 5px;border-radius:4px;
}
.body ul{margin:0 0 12px;padding-left:19px}
.body ul li{margin-bottom:5px}
.body ol.ex{margin:0 0 13px;padding-left:19px}
.body ol.ex li{margin-bottom:9px}
.body ol.ex .en{
  display:block;font-family:var(--font);font-size:calc(15.5px * var(--fs));line-height:1.45;
}
.body ol.ex .zh{display:block;font-size:calc(13px * var(--fs));color:var(--card-ink-2);margin-top:2px}
.body del{opacity:.65}
.xref{
  color:inherit;text-decoration:underline;
  text-decoration-thickness:1px;text-underline-offset:2px;
  text-decoration-color:var(--card-ink-2);
  cursor:pointer;font-weight:500;
}
.xref:hover{text-decoration-thickness:2px}
.xref:focus-visible{outline:2px solid var(--card-ink);outline-offset:2px;border-radius:2px}
.xref[data-missing]{text-decoration-style:dotted;cursor:default;opacity:.75}
.body blockquote{
  margin:0 0 13px;padding:9px 14px;
  border-left:3px solid var(--card-ink-2);
  background:var(--card-edge);border-radius:0 7px 7px 0;
  font-family:var(--font);font-size:calc(15px * var(--fs));line-height:1.5;
}

/* ── 错题本 ─────────────────────────────── */
.mtag{
  display:inline-block;font-size:.78em;font-weight:500;line-height:1.5;
  background:var(--tag);color:var(--tag-ink);
  border-radius:4px;padding:0 5px;margin:0 2px;vertical-align:.08em;
}
.pill.mk-pill{border-style:dashed}
.pill.mk-pill[aria-pressed="true"]{border-style:solid}
.mk-intro{color:var(--ink-3);font-size:calc(13px * var(--fs));margin:22px 0 0;max-width:62ch}
.mk-types{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.mk-types .pill .n{opacity:.6;font-variant-numeric:tabular-nums}
.mk-head .badge{background:var(--mk);color:var(--ink)}
.mk{
  break-inside:avoid;-webkit-column-break-inside:avoid;
  content-visibility:auto;contain-intrinsic-size:auto 150px;
  background:var(--mk);color:var(--ink);
  border:1px solid var(--rule);border-left:3px solid var(--sev);
  border-radius:8px;padding:11px 14px 10px;margin-bottom:12px;
  box-shadow:var(--shadow);cursor:pointer;text-align:left;width:100%;
  font:inherit;display:block;
  transition:box-shadow .16s ease, transform .16s ease;
}
.mk:hover{box-shadow:var(--shadow-lift);transform:translateY(-1px)}
.mk:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.mk.error{--sev:var(--err)}
.mk.warn{--sev:var(--warn)}
.mk .what{font-size:calc(13.5px * var(--fs));line-height:1.6;margin:0}
.mk .what .sv{color:var(--sev);font-weight:700;margin-right:4px;font-size:calc(12px * var(--fs))}
.mk .orig{
  margin:8px 0 0;padding-left:10px;border-left:2px solid var(--rule);
  font-family:var(--font);font-size:calc(14px * var(--fs));line-height:1.45;color:var(--ink-2);
}
.mk .src{
  display:flex;justify-content:space-between;gap:8px;margin-top:9px;
  font-size:calc(11px * var(--fs));color:var(--ink-3);letter-spacing:.03em;
}
.mk .src .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mk .src .dt{font-variant-numeric:tabular-nums;white-space:nowrap}
.mk code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.9em;background:var(--tag);padding:0 4px;border-radius:3px}
.mk del{opacity:.65}

/* ── 会写 marker / filter ─────────────── */
.foot .wr{font-weight:700;letter-spacing:.08em}

/* ── 发送前自检 ─────────────────────────── */
.check{
  margin-top:22px;background:var(--mk);border:1px solid var(--rule);border-radius:10px;
  padding:14px 16px 8px;max-width:820px;
}
.check h2{font-size:calc(15px * var(--fs));margin:0 0 2px;font-weight:700}
.check .sub{font-size:calc(12.5px * var(--fs));color:var(--ink-3);margin:0 0 8px}
.check ol{list-style:none;margin:0;padding:0}
.check li{border-top:1px solid var(--rule)}
.check li:first-child{border-top:0}
.check button{
  font:inherit;text-align:left;width:100%;background:none;border:0;color:var(--ink);
  display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:baseline;
  padding:8px 2px;cursor:pointer;
}
.check button:hover .q{text-decoration:underline;text-underline-offset:2px}
.check .q{font-size:calc(13.5px * var(--fs));line-height:1.55}
.check .ex{grid-column:2;font-size:calc(12px * var(--fs));color:var(--ink-3)}
.check .n{font-size:calc(12px * var(--fs));color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}

/* ── 复习 / 练习 panes ─────────────────── */
.pane{max-width:720px;margin:26px auto 0}
.pane h2{font-family:var(--font);font-weight:600;font-size:calc(22px * var(--fs));margin:0 0 4px}
.pane .note{color:var(--ink-3);font-size:calc(13px * var(--fs));margin:0 0 16px;max-width:62ch}
.sync{margin:28px 0 0;padding:14px 16px;border:1px solid var(--rule);border-radius:12px;background:var(--mk);max-width:62ch}
.sync h3{font-size:calc(14px * var(--fs));margin:0 0 4px}
.sync p{font-size:calc(12.5px * var(--fs));color:var(--ink-3);margin:0 0 10px;line-height:1.6}
.sync .st{font-size:calc(13px * var(--fs));color:var(--ink-2)}
.sync .st.err{color:var(--err)}
.sync input{flex:1 1 220px;min-width:0;font:inherit;font-size:calc(13px * var(--fs));background:var(--chip);color:var(--ink);border:1px solid var(--rule);border-radius:999px;padding:7px 14px}
.sync a{color:inherit}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0 0 16px}
.stat{background:var(--mk);border:1px solid var(--rule);border-radius:10px;padding:12px 14px}
.stat b{display:block;font-family:var(--font);font-size:calc(30px * var(--fs));line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:calc(12.5px * var(--fs));color:var(--ink-3)}
.btn{
  font:inherit;font-size:calc(14px * var(--fs));font-weight:500;cursor:pointer;
  background:var(--chip-on);color:var(--chip-on-ink);border:1px solid var(--chip-on);
  border-radius:999px;padding:9px 18px;
}
.btn[disabled]{opacity:.45;cursor:default}
.btn.ghost{background:var(--chip);color:var(--ink-2);border-color:var(--rule)}
.btn.go{background:#8fd19e;color:#1f1f1e;border-color:transparent}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.linkish{font:inherit;font-size:calc(12.5px * var(--fs));background:none;border:0;color:var(--ink-3);cursor:pointer;text-decoration:underline;text-underline-offset:2px;padding:0}
.bar{height:4px;background:var(--rule);border-radius:2px;overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--ink)}
.rcard{
  background:var(--sw);color:var(--card-ink);border:1px solid var(--card-edge);
  border-radius:14px;box-shadow:var(--shadow);padding:20px 22px;margin:12px 0 14px;
}
.rcard .lab{font-size:calc(12px * var(--fs));letter-spacing:.06em;color:var(--card-ink-2);margin:0 0 6px;font-weight:500}
.rcard .big{font-family:var(--font);font-weight:600;font-size:calc(26px * var(--fs));line-height:1.2;margin:0 0 6px;text-wrap:balance}
.rcard .prompt{font-size:calc(16px * var(--fs));line-height:1.6;margin:0 0 6px}
.rcard .hint{font-size:calc(13px * var(--fs));color:var(--card-ink-2);margin:6px 0 0}
.rcard hr{border:0;border-top:1px solid var(--card-edge);margin:18px 0}
.rcard .mine{
  margin:0 0 14px;padding:9px 12px;border-radius:8px;background:var(--card-edge);
  font-family:var(--font);font-size:calc(15px * var(--fs));white-space:pre-wrap;
}
textarea.draft{
  width:100%;min-height:92px;resize:vertical;margin-top:12px;
  font:inherit;font-family:var(--font);font-size:calc(16px * var(--fs));line-height:1.5;
  background:var(--chip);color:var(--ink);border:1px solid var(--rule);border-radius:8px;padding:10px 12px;
}
textarea.draft:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.grades{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.grades .btn{padding:10px 0}
.task{background:var(--mk);border:1px solid var(--rule);border-radius:12px;padding:16px 18px;margin:0 0 16px}
.task h3{font-size:calc(15px * var(--fs));margin:0 0 4px}
.task .meta2{font-size:calc(12.5px * var(--fs));color:var(--ink-3);margin:0 0 8px}
.task .ask{font-size:calc(14.5px * var(--fs));line-height:1.6;margin:0}
.task .ask .xref{color:inherit}
.task .foot2{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.task .wc{font-size:calc(12px * var(--fs));color:var(--ink-3);font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 0}
.chips button{font:inherit;font-size:calc(13px * var(--fs));background:var(--chip);color:var(--ink);border:1px solid var(--rule);border-radius:999px;padding:3px 11px;cursor:pointer}
.toast{font-size:calc(12.5px * var(--fs));color:var(--ink-3)}

/* ── 自测 ──────────────────────────────── */
.st textarea.draft{background:var(--chip);margin-top:4px}
.st .row{margin-top:10px}
.st-res{margin:14px 0 16px;font-size:calc(14px * var(--fs))}
.st-res .verdict{font-weight:700;margin:0 0 8px}
.st-res .line{
  margin:0 0 8px;padding:8px 12px;border-radius:8px;background:var(--card-edge);
  font-family:var(--font);font-size:calc(16px * var(--fs));line-height:1.5;
}
.st-res .line b{font-family:var(--font);font-size:calc(11.5px * var(--fs));font-weight:500;color:var(--card-ink-2);display:block}
.st-res .st-x{color:var(--err);text-decoration:line-through;text-decoration-thickness:1.5px}
.st-res .st-m{background:color-mix(in srgb, var(--warn) 30%, transparent);border-radius:3px;padding:0 2px}
.st-res .fine{font-size:calc(12px * var(--fs));color:var(--card-ink-2);margin:0}
.st-stats{font-size:calc(12.5px * var(--fs));color:var(--card-ink-2);margin:-6px 0 12px}
.st-hist{margin:0 0 16px;font-size:calc(13px * var(--fs))}
.st-hist summary{cursor:pointer;color:var(--card-ink-2);font-size:calc(12.5px * var(--fs))}
.st-hist ol{list-style:none;margin:8px 0 0;padding:0}
.st-hist li{display:grid;grid-template-columns:auto auto 1fr;gap:8px;padding:5px 0;border-top:1px solid var(--card-edge);align-items:baseline}
.st-hist .when{font-variant-numeric:tabular-nums;color:var(--card-ink-2);font-size:calc(12px * var(--fs));white-space:nowrap}
.st-hist .txt{font-family:var(--font);font-size:calc(14.5px * var(--fs));overflow-wrap:anywhere}
.foot .stc{font-weight:500}

/* ── 进度:学习中 → 自测 → 已掌握 ─────────── */
.foot .stg{font-weight:700;letter-spacing:.04em}
.foot .stg.done{color:#2f7a3c}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .foot .stg.done{color:#8fd49a} }
:root[data-theme="dark"] .foot .stg.done{color:#8fd49a}
.pill .n{opacity:.6;font-variant-numeric:tabular-nums}
.stage{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;margin:-6px 0 16px;font-size:calc(12.5px * var(--fs));color:var(--card-ink-2)}
.stage .steps{display:inline-flex;align-items:center;gap:6px}
.stage .step{opacity:.7}
.stage .step.on{opacity:1;font-weight:600;color:var(--card-ink);background:color-mix(in srgb, var(--card-ink) 9%, transparent);border-radius:7px;padding:2px 8px}
.stage .arr{opacity:.4}
.stage .moves{display:inline-flex;align-items:center;gap:10px}
.sheet .quiz{background:color-mix(in srgb, var(--card-ink) 6%, transparent);border-radius:14px;padding:14px 16px;margin:0 0 22px}
.sheet .quiz>:first-child{margin-top:0}
.sheet .quiz>:last-child,.sheet .quiz .st-res>:last-child{margin-bottom:0}
.btn.retry{margin-top:4px}
.notes-h{display:flex;align-items:center;gap:12px;font-size:calc(12.5px * var(--fs));color:var(--card-ink-2);margin:0 0 12px}
.notes-h::after{content:"";flex:1;border-top:1px solid var(--card-edge)}
/* notes as a carousel: a tab per section, one card at a time; 全部展开 stacks them all */
.nv-h{display:flex;align-items:center;gap:12px;font-size:calc(12.5px * var(--fs));color:var(--card-ink-2);margin:0 0 10px}
.nv-h .ln{flex:1;border-top:1px solid var(--card-edge)}
.nv-h button{font:inherit;font-size:calc(12.5px * var(--fs));color:var(--card-ink-2);background:none;border:0;padding:2px 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.nv-h button:focus-visible{outline:2px solid var(--card-ink);outline-offset:2px;border-radius:4px}
.nv-tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -2px 10px;padding:2px}
.nv-tabs::-webkit-scrollbar{display:none}
.nv-tab{flex:none;font:inherit;font-size:calc(12.5px * var(--fs));color:var(--card-ink-2);background:transparent;border:1px solid var(--card-edge);border-radius:999px;padding:4px 11px;cursor:pointer;white-space:nowrap}
.nv-tab[aria-selected="true"]{background:var(--card-ink);border-color:var(--card-ink);color:var(--sw, var(--ground))}
.nv-tab:focus-visible{outline:2px solid var(--card-ink);outline-offset:1px}
.nv-track{display:flex;align-items:flex-start;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;gap:12px;transition:height .2s ease;outline:none}
.nv-track::-webkit-scrollbar{display:none}
.nv-card{flex:0 0 100%;box-sizing:border-box;scroll-snap-align:start;scroll-snap-stop:always;background:var(--glass-fill);border:1px solid var(--card-edge);border-radius:14px;padding:14px 15px 3px}
.nv-card > p.lbl{display:none}
.nv-dots{display:flex;justify-content:center;gap:5px;margin:10px 0 2px}
.nv-dots i{width:5px;height:5px;border-radius:50%;background:var(--card-ink);opacity:.2;transition:opacity .2s,width .2s}
.nv-dots i.on{opacity:.65;width:14px;border-radius:3px}
.nv.all .nv-tabs,.nv.all .nv-dots{display:none}
.nv.all .nv-track{display:block;overflow:visible;height:auto!important}
.nv.all .nv-card{background:none;border:0;padding:0;border-radius:0}
.nv.all .nv-card > p.lbl{display:block}
/* on the entry card the notes fill the face: tabs on top, dots at the bottom, each page scrolling */
.nv.fill{display:flex;flex-direction:column;flex:1;min-height:0}
.nv.fill .nv-h{margin:0 0 10px}
.nv.fill .nv-tabs,.nv.fill .nv-dots{flex:none}
.nv.fill .nv-track{flex:1;min-height:0;align-items:stretch;height:auto!important;transition:none}
.nv.fill .nv-card{height:100%;overflow-y:auto;background:transparent;border:0;border-radius:0;padding:2px 2px 8px}
.nv.fill.all .nv-track{display:block;overflow-y:auto}
.nv.fill.all .nv-card{height:auto;overflow:visible}
.nv.fill .scrollq{padding:2px 2px 8px}
@media (prefers-reduced-motion: reduce){.nv-track{transition:none}}
.stage b{color:var(--card-ink)}
.stage .btn{font-size:calc(12.5px * var(--fs));padding:5px 13px}
/* the 自测 quiz inside an entry borrows the review card's prompt styles */
.sheet .st .lab{font-size:calc(12px * var(--fs));letter-spacing:.06em;color:var(--card-ink-2);margin:0 0 6px;font-weight:500}
.sheet .st .big{font-family:var(--font);font-weight:600;font-size:calc(22px * var(--fs));line-height:1.2;margin:0 0 6px}
.sheet .st .prompt{font-size:calc(16px * var(--fs));line-height:1.6;margin:0 0 6px}
.sheet .st .hint{font-size:calc(13px * var(--fs));color:var(--card-ink-2);margin:6px 0 10px}
.st-res .lab{font-size:calc(12px * var(--fs));color:var(--card-ink-2);margin:0 0 6px}
.st-res .mine{margin:0 0 8px;padding:9px 12px;border-radius:8px;background:var(--card-edge);font-family:var(--font);font-size:calc(15px * var(--fs));white-space:pre-wrap}

@media (max-width:640px){
  .grid{columns:2 150px;column-gap:10px}
  .card{margin-bottom:10px;padding:11px 13px}
  h1{font-size:calc(22px * var(--fs))}
  .sheet{padding:18px 17px 18px}
  .rcard{padding:16px 16px}
  .grades{grid-template-columns:repeat(2,minmax(0,1fr))}
}
.prac{margin-top:28px;border-top:1px solid var(--rule);padding-top:14px}
.prac>summary{cursor:pointer;font-weight:600;font-size:calc(15px * var(--fs));list-style-position:outside;padding:4px 0}
.prac[open]>summary{margin-bottom:12px}
/* phones: the view tabs become a floating glass capsule at the bottom, like the app's */
.tabs.float{
  position:fixed;z-index:30;left:16px;right:16px;bottom:calc(12px + env(safe-area-inset-bottom,0px));
  margin:0;padding:5px;gap:4px;border:1px solid var(--glass-edge);border-radius:999px;overflow:visible;
  background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6);
  box-shadow:inset 0 1px 0 var(--glass-rim), var(--glass-shadow);
}
.tabs.float .tab{flex:1;margin:0;border:0;border-radius:999px;padding:9px 4px;font-size:calc(13.5px * var(--fs))}
.tabs.float .tab[aria-selected="true"]{background:color-mix(in srgb, var(--ink) 9%, transparent);font-weight:600}
.tabs.float .tab .n{display:none}
.tabs.float .tab:focus-visible{outline-offset:-3px;border-radius:999px}
@media (max-width:639px){ .wrap{padding-block-end:110px} }
/* ── V2 (分支 ui/claude-code-v2,用户 2026-10-14),和 App 一样:条目在中性底上,笔记在级别色卡片里;
   自测和复习 / 考核做题是同一张答题纸(题目卡 + 下面拼接的词块面板)── */
:root{--well:rgba(255,255,255,.62);--panel:#ffffff;--key:#d5d8df;--sum-bg:#15171c;--sum-fg:#f3f4f6}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){--well:rgba(0,0,0,.24);--panel:#1e2127;--key:#3a3f48;--sum-bg:#1e2127;--sum-fg:#e8eaee} }
:root[data-theme="dark"]{--well:rgba(0,0,0,.24);--panel:#1e2127;--key:#3a3f48;--sum-bg:#1e2127;--sum-fg:#e8eaee}
.sheet{background:var(--ground);color:var(--ink);padding:16px 12px 12px}
.sheet .mband,.sheet .back{margin-left:8px;margin-right:8px}
.sheet .lv{margin:14px 8px 12px}
.sheet .lvl .node{background:var(--ground)}
.sheet .lvl.passed .node{color:var(--ground)}
.nx{background:var(--chip);color:var(--ink-3);border:1px solid var(--rule)}
.nx b{color:var(--ink);font-weight:700}
.sheet.quizzing .mpill,.sheet.quizzing .mdet,.sheet.quizzing .lv{display:none}
.sheet.quizzing h2{font-size:calc(17px * var(--fs));margin:0 0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-wrap:unset}
/* the card: the notes on the level colour; tabs, 卡片/全部 and ⤢ in its own top row */
.face{background:var(--sw);color:var(--card-ink);border:0;border-radius:24px;padding:0;overflow:hidden}
.face.fr .body.fillb{padding:0}
.nv-bar{display:flex;align-items:center;gap:2px;padding:6px 4px 0 10px;flex:none}
/* the tabs take the row, so 卡片/全部 and ⤢ sit at its right end (.nv.fill .nv-tabs would pin them at flex:none) */
.nv-bar .nv-tabs,.nv.fill .nv-bar .nv-tabs{flex:1 1 auto;min-width:0;margin:0;padding:4px 2px;gap:4px}
.nv-bar .nv-tab{border:0;padding:8px 13px;font-size:calc(13.5px * var(--fs));color:color-mix(in srgb,var(--card-ink) 76%,transparent)}
.nv-bar .nv-tab[aria-selected="true"]{background:var(--card-ink);color:var(--sw);font-weight:700}
.nv.v2.all .nv-bar .nv-tabs{display:flex;visibility:hidden}
.nv.v2 .nv-card{padding:12px 20px 16px}
.nv.v2.all .nv-track{padding:12px 20px 16px}
.nv.v2.all .nv-card+.nv-card{margin-top:22px}
.nv.v2 .scrollq{flex:1;min-height:0;overflow-y:auto;padding:12px 20px 16px}
.ib{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:none;color:color-mix(in srgb,var(--card-ink) 76%,transparent);display:grid;place-items:center;cursor:pointer;padding:0}
.ib svg{width:20px;height:20px}
.ib:hover{background:color-mix(in srgb,var(--card-ink) 8%,transparent)}
.ib:focus-visible{outline:2px solid var(--card-ink);outline-offset:1px}
.card-foot{display:flex;align-items:center;gap:8px;padding:6px 10px 10px 18px;flex:none}
.card-foot .hint{flex:1;min-width:0;font-size:calc(12.5px * var(--fs));color:color-mix(in srgb,var(--card-ink) 76%,transparent)}
.card-foot .btn{padding:12px 18px;font-weight:700}
/* the answer sheet */
.face.bk{background:transparent;border-radius:0;overflow:visible;display:flex;flex-direction:column}
.qsheet{flex:1;min-height:0;display:flex;flex-direction:column}
.qcard{flex:1;min-height:0;overflow-y:auto;background:var(--sw);color:var(--card-ink);border-radius:24px 24px 0 0;padding:16px 18px 18px 20px;display:flex;flex-direction:column;gap:12px}
.qcard [hidden]{display:none!important}
.qmeta{display:flex;align-items:center;gap:8px;font-size:calc(12.5px * var(--fs));font-weight:700;color:color-mix(in srgb,var(--card-ink) 76%,transparent)}
.qmeta>span:first-child{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qmeta .amode{background:color-mix(in srgb,var(--card-ink) 8%,transparent);border:0;padding:3px}
.qmeta .amode button{padding:7px 14px;font-size:calc(13px * var(--fs))}
.qcard .st{display:flex;flex-direction:column;gap:12px}
.qprompt{font-size:calc(22px * var(--fs));line-height:1.5;font-weight:700;margin:0}
.qcard .st-prompt>:last-child{margin-bottom:0}
.qstats{display:flex;align-items:center;gap:12px;font-size:calc(12.5px * var(--fs));color:color-mix(in srgb,var(--card-ink) 76%,transparent)}
.qstats .linkish{color:var(--card-ink);font-size:calc(13px * var(--fs))}
.ybox{border-radius:16px;background:var(--well);border:1.5px solid transparent;padding:4px 10px 12px 14px;min-height:140px;box-sizing:border-box;display:flex;flex-direction:column;gap:6px}
.ybox.typing{border-color:var(--card-ink)}
.ybox-h{display:flex;align-items:center;min-height:30px;font-size:calc(12px * var(--fs));color:color-mix(in srgb,var(--card-ink) 76%,transparent)}
.ybox-h span{flex:1}
.ybox-h button{font:inherit;font-size:calc(13px * var(--fs));color:inherit;background:none;border:0;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:4px 6px;border-radius:6px}
.sheet .ybox textarea.draft,.ybox textarea.draft{border:0;background:transparent;margin:0;padding:0;min-height:76px;resize:none;font-size:calc(19px * var(--fs));line-height:28px;color:var(--card-ink);outline:none;border-radius:0}
.ybox textarea.draft::placeholder{color:color-mix(in srgb,var(--card-ink) 60%,transparent)}
.ybox .wb-ans{border:0;background:none;margin:0;padding:0;min-height:0;gap:6px}
.ybox .wb-ans .wchip{background:var(--panel);color:var(--card-ink);border:0;box-shadow:0 1px 0 var(--key);font-size:calc(17px * var(--fs));padding:7px 12px;opacity:1}
.ybox .wb-ans .wchip.last{box-shadow:inset 0 0 0 2px var(--card-ink)}
.ybox .wb-ans .caret{display:inline-block;width:2px;height:24px;background:var(--card-ink);margin-left:2px}
.ybox .wb-ph{color:color-mix(in srgb,var(--card-ink) 70%,transparent);padding:6px 0}
.ybox-hint{font-size:calc(11.5px * var(--fs));margin:0;color:color-mix(in srgb,var(--card-ink) 76%,transparent)}
.qpanel{flex:none;background:var(--panel);color:var(--ink);border-radius:0 0 24px 24px;border-top:1px solid var(--rule);padding:14px;display:flex;flex-direction:column;gap:12px}
.qpanel [hidden]{display:none!important}
.qpanel .btn{width:100%;padding:14px;font-size:calc(16px * var(--fs));font-weight:700}
.wb-keys{display:flex;gap:8px}
.wb-keys .wb-bank{flex:1;min-width:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:0}
.wb-keys .wb-bank .wchip,.wb-bs{height:54px;border-radius:14px;border:1px solid var(--key);border-bottom-width:3px;background:var(--panel);color:var(--ink);font-size:calc(19px * var(--fs));padding:0 6px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wb-bs{flex:none;width:56px;height:116px;display:grid;place-items:center}
.wb-bs svg{width:24px;height:24px}
.wb-bs:disabled{opacity:.4;cursor:default}
.wb-keys .wb-done{grid-column:1/-1;height:116px;display:grid;place-items:center;text-align:center;color:var(--ink-3);font-size:calc(14px * var(--fs));padding:0}
.row2{display:flex;gap:10px}
.row2 .btn{flex:1;width:auto}
.row2 .btn.ghost{background:transparent;color:var(--ink);border-color:var(--key)}
/* the reveal */
.qcard .st-res{margin:0;display:flex;flex-direction:column;gap:12px;font-size:calc(14px * var(--fs))}
.qquiet{margin:0;font-size:calc(15px * var(--fs));color:color-mix(in srgb,var(--card-ink) 76%,transparent)}
.vbar{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--ink);color:var(--ground)}
.vbar .dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#1f1f1e;font-weight:700;flex:none}
.vbar .dot.good{background:#8fd19e}.vbar .dot.warn{background:#f2a65a}.vbar .dot.peek{background:#b9b6ac}
.vbar b{display:block;font-size:calc(15px * var(--fs));line-height:1.35}
.vbar small{display:block;font-size:calc(12px * var(--fs));opacity:.75}
.steps{margin:0;padding:8px 12px;border-radius:10px;background:color-mix(in srgb,#f2a65a 22%,transparent);font-size:calc(14px * var(--fs));line-height:1.45}
.steps.ok{background:color-mix(in srgb,#8fd19e 30%,transparent)}
#qz-nextk small{font-weight:400;opacity:.75}
.vl{display:block;font-size:calc(12px * var(--fs));font-weight:700;color:color-mix(in srgb,var(--card-ink) 76%,transparent)}
.vmine p,.vwell p{margin:2px 0 0;font-family:var(--font);font-size:calc(18px * var(--fs));line-height:1.55}
.vwell{display:flex;align-items:center;gap:4px;background:var(--well);border-radius:16px;padding:10px 6px 12px 14px}
.vwell>div{flex:1;min-width:0}
.st-res .fine{font-size:calc(12px * var(--fs));color:color-mix(in srgb,var(--card-ink) 76%,transparent);margin:0}
.nfq{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--card-edge);padding-top:12px}
.nfq-h{display:flex;align-items:center;gap:10px;font-size:calc(12px * var(--fs));font-weight:700;color:color-mix(in srgb,var(--card-ink) 76%,transparent)}
.nfq-h span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nfq-h .linkish{color:inherit;font-size:calc(13px * var(--fs))}
.nfq .body>p.lbl{display:none}
.body ol.ex li.lit{background:var(--well);border-radius:12px;padding:6px 8px;margin-left:-8px;margin-right:-8px}
/* a 复习 / 考核 run: the whole screen, nothing else */
body.running{overflow:hidden}
.run{position:fixed;inset:0;z-index:45;background:var(--ground);color:var(--ink);display:flex;flex-direction:column;padding:max(6px,env(safe-area-inset-top,0px)) 8px max(12px,env(safe-area-inset-bottom,0px));box-sizing:border-box}
.run>*{width:min(680px,100%);margin-inline:auto;box-sizing:border-box}
.runbar{display:flex;align-items:center;gap:10px;height:52px;flex:none;padding-right:8px;font-size:calc(13px * var(--fs));color:var(--ink-3)}
.runbar .bar{height:8px;border-radius:4px}
.x2{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:none;color:var(--ink);font:inherit;font-size:calc(18px * var(--fs));cursor:pointer}
.x2:hover{background:var(--rule)}
.scard{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--sw);color:var(--card-ink);border-radius:24px;overflow:hidden}
.shead{padding:16px 20px 0;flex:none}
.shead .lab{font-size:calc(12.5px * var(--fs));margin:0;color:color-mix(in srgb,var(--card-ink) 72%,transparent)}
.shead .big{font-family:var(--font);font-weight:700;font-size:calc(28px * var(--fs));line-height:1.2;margin:2px 0}
.shead .ipa{font-size:calc(13px * var(--fs));margin:0;color:color-mix(in srgb,var(--card-ink) 72%,transparent)}
.scard .body.fillb{flex:1;min-height:0;display:flex;flex-direction:column}
.sfoot{padding:0 10px 10px;flex:none}
.sfoot .btn{width:100%;padding:14px;font-size:calc(16px * var(--fs));font-weight:700}
.run-done{padding:24px}
/* a stage's tab: one summary card, the offer to move on, the entries grouped, a line each */
.ssum{background:var(--sum-bg);color:var(--sum-fg);border-radius:24px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:12px;margin:4px 0 8px}
.ssum-n{display:flex;align-items:flex-end;gap:10px}
.ssum-n b{font-size:calc(52px * var(--fs));line-height:.9;font-weight:700}
.ssum-n span{font-size:calc(16px * var(--fs));padding-bottom:4px}
.ssum-c{display:flex;gap:6px;flex-wrap:wrap}
.ssum-c span{font-size:calc(13px * var(--fs));padding:5px 10px;border-radius:12px;background:color-mix(in srgb,var(--sum-fg) 12%,transparent)}
.ssum-bar{display:flex;gap:3px;height:10px}
.ssum-bar i{display:block;border-radius:5px}
.ssum-lg{display:flex;gap:14px;flex-wrap:wrap;font-size:calc(13px * var(--fs))}
.ssum-lg span{display:inline-flex;align-items:center;gap:6px}
.ssum-lg i{display:inline-block;width:8px;height:8px;border-radius:50%}
.ssum .b0{background:color-mix(in srgb,var(--sum-fg) 22%,transparent)}.ssum .b1{background:#f2a65a}.ssum .b2{background:var(--sum-fg)}
.ssum .btn{background:var(--sum-fg);color:var(--sum-bg);border-color:var(--sum-fg);padding:14px;font-size:calc(16px * var(--fs));font-weight:700}
.ssum-note{font-size:calc(12.5px * var(--fs));margin:0;opacity:.72}
.ready{display:flex;align-items:center;gap:10px;width:100%;text-align:left;font:inherit;font-size:calc(14px * var(--fs));color:var(--ink);background:var(--chip);border:1px solid var(--rule);border-radius:16px;padding:12px 14px;cursor:pointer;margin:0 0 8px}
.ready .ck{width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--ground);display:grid;place-items:center;flex:none;font-weight:700}
.ready .t{flex:1}
.ready svg{width:18px;height:18px;flex:none}
.grp-h{font-size:calc(13px * var(--fs));font-weight:700;color:var(--ink-3);margin:14px 8px 6px}

  .col{min-width:0;padding:0 32px 64px}

    background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none;padding:20px 28px 24px;overflow:hidden;display:block}

      </button>

        <div class="check" id="check"></div>
        <p class="mk-intro">只收我自己写错的地方。<b style="color:var(--err)">❌</b> 是语法错误,<b style="color:var(--warn)">⚠️</b> 是能用但不是最常见的写法。点卡片打开原条目。</p>

    <div class="filters" id="filters"></div>

<script>
const DATA = /*__DATA__*/;
DATA.forEach(g => g.items.forEach(it => { it.html = it.slides.map(x => x[1]).join(""); }));
const MISTAKES = /*__MISTAKES__*/;

const LV = {
  A1:{nm:"入门",  sw:["--a1-1","--a1-2","--a1-3"]},
  A2:{nm:"基础",  sw:["--a2-1","--a2-2","--a2-3"]},
  B1:{nm:"进阶",  sw:["--b1-1","--b1-2","--b1-3"]},
  B2:{nm:"中高级",sw:["--b2-1","--b2-2","--b2-3"]},
  C1:{nm:"高级",  sw:["--c1-1","--c1-2","--c1-3"]},
  C2:{nm:"精通",  sw:["--c2-1","--c2-2","--c2-3"]},
  TERM:{nm:"术语与固定搭配(无 CEFR 分级)", sw:["--tm-1","--tm-2","--tm-3"]},
  GRAMMAR:{nm:"语法与语域笔记", sw:["--gr-1","--gr-2","--gr-3"]},
  SENTENCE:{nm:"整句订正:我的原句 → 更地道的说法", sw:["--sn-1","--sn-2","--sn-3"]},
  SELFTEST:{nm:"自测:简单高频,不复习也要能写对", sw:["--st-1","--st-2","--st-3"]}
};
const LABEL = {TERM:"术语", GRAMMAR:"语法", SENTENCE:"句子", SELFTEST:"自测题"};

// ── theme toggle ─────────────────────────
const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.4M12 19v2.4M21.4 12H19M5 12H2.6M18.6 5.4l-1.7 1.7M7.1 16.9l-1.7 1.7M18.6 18.6l-1.7-1.7M7.1 7.1L5.4 5.4"/></svg>';
const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.6A8.6 8.6 0 1 1 9.4 3.5a6.9 6.9 0 0 0 11.1 11.1Z"/></svg>';
const themeBtn = document.getElementById("theme");
const darkMQ = window.matchMedia("(prefers-color-scheme: dark)");
const effective = () => document.documentElement.dataset.theme || (darkMQ.matches ? "dark" : "light");
function paintTheme(){
  const isDark = effective() === "dark";
  themeBtn.innerHTML = isDark ? SUN : MOON;
  const label = isDark ? "切换到浅色主题" : "切换到深色主题";
  themeBtn.setAttribute("aria-label", label);
  themeBtn.title = label;
}
themeBtn.addEventListener("click", () => {
  const next = effective() === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("vk.theme", next); } catch(e){}
  paintTheme();
});
darkMQ.addEventListener("change", () => { if (!document.documentElement.dataset.theme) paintTheme(); });
paintTheme();

const board = document.getElementById("board");
const filters = document.getElementById("filters");
const q = document.getElementById("q");
const empty = document.getElementById("empty");
const total = DATA.reduce((n,g)=>n+g.items.length,0);
const mkTotal = MISTAKES.reduce((n,g)=>n+g.items.length,0);
const writeTotal = DATA.reduce((n,g)=>n+g.items.filter(it=>it.mastery==="write").length,0);
document.getElementById("tally").textContent = total + " 条 · 会写 " + writeTotal + " · 错题 " + mkTotal;
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : v; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch(e){} },
};

// ── 进度: 学习中 → 自测 → 已掌握, like 百词斩's 斩. I move entries along with the buttons;
// it stays in this browser (vk.stage), like the app's filesDir/stage.json. Only moves are
// stored: a 自测 entry starts in 自测, everything else in 学习中. 已掌握 is left out of 复习.
// An entry's lifecycle, one tab each: 学习中 (浏览) → 复习 → 考核 → 掌握. Same keys as review/StageStore.kt.
const STAGES = [["learn", "学习中"], ["review", "复习中"], ["test", "考核中"], ["done", "已掌握"]];
const STAGE_NAME = Object.fromEntries(STAGES);
const STAGE_TAB = { learn: "学习", review: "复习", test: "考核", done: "掌握" };
const nextStage = k => (STAGES[STAGES.findIndex(s => s[0] === k) + 1] || [])[0];
let stages = {}, stageT = {};               // stageT: when each move was made, for 同步
try { stages = JSON.parse(store.get("vk.stage", "{}")) || {}; } catch(e){}
try { stageT = JSON.parse(store.get("vk.stage.t", "{}")) || {}; } catch(e){}
const stageOf = (it, level) => stages[it.anchor] || (level === "SELFTEST" ? "test" : "learn");
function setStage(it, stage){
  stages[it.anchor] = stage;
  stageT[it.anchor] = Date.now();
  store.set("vk.stage", JSON.stringify(stages));
  store.set("vk.stage.t", JSON.stringify(stageT));
  refreshStages();
  syncSoon();
}
let stageF = store.get("vk.stagef", "");
if (!STAGE_NAME[stageF]) stageF = "";

// 筛选: two labelled rows — 类型 (with a CEFR sub-row under 单词) and 进度 + 只看会写.
// Each row is single-choice and starts at 全部; the rows narrow each other.
const CEFR = ["A1", "A2", "B1", "B2", "C1", "C2"];
const TYPES = [["ALL", "全部"], ["WORD", "单词"], ["TERM", "术语"], ["GRAMMAR", "语法"], ["SENTENCE", "句子"], ["SELFTEST", "自测题"]];
let typeF = store.get("vk.type", null), cefrF = store.get("vk.cefr", "");
if (typeF === null) {                       // from the old single row (vk.level)
  const old = store.get("vk.level", "ALL");
  typeF = CEFR.includes(old) ? "WORD" : TYPES.some(t => t[0] === old) ? old : "ALL";
  cefrF = CEFR.includes(old) ? old : "";
}
if (!TYPES.some(t => t[0] === typeF)) typeF = "ALL";
if (!CEFR.includes(cefrF)) cefrF = "";
const levelShown = lv => typeF === "ALL" || typeF === lv || (typeF === "WORD" && CEFR.includes(lv) && (!cefrF || cefrF === lv));
// the 错题本 used to be a level pill; it is a tab now
let view = store.get("vk.view", store.get("vk.level", "") === "MISTAKES" ? "mistakes" : "entries");
if (view === "practice") view = "review";
let writeOnly = store.get("vk.write", "0") === "1";
let favOnly = store.get("vk.fav", "0") === "1";             // entries with a ⭐ example

const pill = (text, on, click, cls = "") => {
  const b = document.createElement("button");
  b.className = "pill " + cls; b.type = "button";
  b.setAttribute("aria-pressed", String(on));
  b.innerHTML = text;
  b.addEventListener("click", click);
  return b;
};
const row = (label, cls = "") => {
  const r = document.createElement("div");
  r.className = "frow " + cls;
  r.innerHTML = `<span class="flab">${label}</span><div class="fp"></div>`;
  filters.append(r);
  return r.lastChild;                       // the pills go in here; the label keeps its own column
};
const typeRow = row("类型"), cefrRow = row("级别", "sub"), stageRow = row("进度"), optRow = row("选项");
const clearAll = () => { typeF = "ALL"; cefrF = ""; stageF = ""; writeOnly = false; favOnly = false; saveFilters(); };
const clearBtn = document.getElementById("freset");
clearBtn.addEventListener("click", clearAll);
const fbtn = document.getElementById("fbtn"), fbn = document.getElementById("fbn"), fsum = document.getElementById("fsum");
const fsheet = document.getElementById("fsheet"), fback = document.getElementById("fback"), fgo = document.getElementById("fgo");
function openFilters(){
  fsheet.hidden = fback.hidden = false;
  fbtn.setAttribute("aria-expanded", "true");
  if (matchMedia("(min-width:640px)").matches) {     // dropdown: hang it under the button, kept on screen
    const r = fbtn.getBoundingClientRect();
    fsheet.style.top = (r.bottom + 6) + "px";
    fsheet.style.left = Math.max(16, Math.min(r.left, innerWidth - fsheet.offsetWidth - 16)) + "px";
  } else fsheet.style.top = fsheet.style.left = "";
  (fsheet.querySelector('.pill[aria-pressed="true"]') || fsheet.querySelector(".pill")).focus();
}
function closeFilters(){
  if (fsheet.hidden) return;
  fsheet.hidden = fback.hidden = true;
  fbtn.setAttribute("aria-expanded", "false");
  fbtn.focus();
}
fbtn.addEventListener("click", () => fsheet.hidden ? openFilters() : closeFilters());
fback.addEventListener("click", closeFilters);
fgo.addEventListener("click", closeFilters);
document.addEventListener("keydown", e => { if (e.key === "Escape" && !fsheet.hidden) { e.stopPropagation(); closeFilters(); } }, true);
addEventListener("resize", () => { if (!fsheet.hidden) openFilters(); });

function saveFilters(){
  store.set("vk.type", typeF); store.set("vk.cefr", cefrF);
  store.set("vk.stagef", stageF); store.set("vk.write", writeOnly ? "1" : "0"); store.set("vk.fav", favOnly ? "1" : "0");
  paintFilters(); render();
}
function paintFilters(){
  typeRow.querySelectorAll(".pill").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.t === typeF)));
  cefrRow.parentNode.hidden = typeF !== "WORD";
  cefrRow.querySelectorAll(".pill").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.c === cefrF)));
  stageRow.querySelectorAll("[data-s]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.s === stageF)));
  wr.setAttribute("aria-checked", String(writeOnly));
  fv.setAttribute("aria-checked", String(favOnly));
  // what's on stays visible after the panel closes: a removable chip per filter, a count on the button
  const on = [];
  if (typeF !== "ALL") on.push([TYPES.find(t => t[0] === typeF)[1] + (cefrF ? " · " + cefrF : ""), () => { typeF = "ALL"; cefrF = ""; }]);

// ── 自测 compare: word-level diff of my sentence against the answer (same as ui/SelfTest.kt).
// Case, punctuation and curly quotes are ignored; the diff is an LCS over the words.
const normWord = w => w.toLowerCase().replace(/[’‘]/g, "'").replace(/[^a-z0-9']/g, "");
function diffWords(mine, answer){
  const a = mine.split(/\s+/).filter(Boolean), b = answer.split(/\s+/).filter(Boolean);
  const na = a.map(normWord), nb = b.map(normWord);
  const L = Array.from({ length: a.length + 1 }, () => new Array(b.length + 1).fill(0));
  for (let x = a.length - 1; x >= 0; x--) for (let y = b.length - 1; y >= 0; y--)
    L[x][y] = na[x] && na[x] === nb[y] ? L[x + 1][y + 1] + 1 : Math.max(L[x + 1][y], L[x][y + 1]);
  const keepA = new Set(), keepB = new Set();
  for (let x = 0, y = 0; x < a.length && y < b.length;) {
    if (na[x] && na[x] === nb[y]) { keepA.add(x++); keepB.add(y++); }
    else if (L[x + 1][y] >= L[x][y + 1]) x++; else y++;
  }
  return { a, b, keepA, keepB, same: na.filter(Boolean).join(" ") === nb.filter(Boolean).join(" ") };
}
// A 答案 quote may hold several acceptable answers, one per line: any match is ✅,
// otherwise diff against the closest one (most words in common).
function bestDiff(mine, answer){
  const ds = answer.split("\n").filter(a => a.trim()).map(a => diffWords(mine, a));
  return ds.find(d => d.same) || ds.sort((x, y) => y.keepB.size - x.keepB.size)[0] || diffWords(mine, "");
}
function verdictHtml(mine, answer, stats){

  const mineP = (label, html) => `<div class="vmine"><span class="vl">${label}</span><p>${html}</p></div>`;
  if (!mine.trim()) {                                     // a peek still gets the answer — that's what the button promised
    const lines = answer.split("\n").map(l => l.trim()).filter(Boolean);
    return bar("peek", "–", "没写就看了答案") + lines.map(l => well("答案", esc(l), l)).join("");
  }

// words, shuffled with a few strays, are chips; tapping them in order builds the sentence, which
// goes into the (hidden) text box, so 显示答案 checks it exactly like typed text. 打字 is a

  if (!nv.classList.contains("all") && !nv.classList.contains("fill")) track.style.height = cards[k].offsetHeight ? cards[k].offsetHeight + "px" : "";
}
function nvGo(nv, k){
  const track = nv.querySelector(".nv-track");
  k = Math.max(0, Math.min(track.children.length - 1, k));
  track.scrollTo({ left: k * (track.clientWidth + 12), behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  nvPaint(nv, k);
}
function nvInit(nv){
  nv._init = true;
  if (!nv.querySelector(".nv-track")) return;            // one section: nothing to page through
  nv.querySelectorAll(".nv-card").forEach(card => {
    // a card's tab already names it: hide a heading that is only the label ("**常见搭配:**")
    const p = card.firstElementChild;
    if (p && p.tagName === "P" && p.children.length === 1 && p.firstElementChild.tagName === "STRONG" &&
        p.textContent.trim() === p.firstElementChild.textContent.trim() && /[:：]$/.test(p.textContent.trim())) p.classList.add("lbl");
  });
  nvPaint(nv, 0);
  // the notes may start hidden (behind 显示答案) and fonts load late: refit when a card resizes

new MutationObserver(() => { document.querySelectorAll(".nv").forEach(nv => { if (!nv._init) nvInit(nv); }); addSpeakButtons(); })
  .observe(document.body, { childList: true, subtree: true });
document.addEventListener("click", e => {
  const nv = e.target.closest(".nv");
  if (!nv) return;
  const tab = e.target.closest(".nv-tab");
  if (tab) nvGo(nv, +tab.dataset.k);
  else if (e.target.closest(".nv-all")) {
    notesAll = !notesAll;
    try { localStorage.setItem("vk.notesAll", notesAll ? "1" : "0"); } catch {}
    document.querySelectorAll(".nv").forEach(n => {
      n.classList.toggle("all", notesAll);
      const b = n.querySelector(".nv-all"), track = n.querySelector(".nv-track");
      if (b && b.classList.contains("ib")) { b.innerHTML = notesAll ? ICON_CARDS : ICON_LIST; b.setAttribute("aria-label", notesAll ? "分卡显示" : "全部展开"); }
      else if (b) b.textContent = notesAll ? "分卡显示" : "全部展开";

document.addEventListener("scroll", e => {
  const t = e.target;
  if (!(t instanceof Element) || !t.classList.contains("nv-track")) return;
  clearTimeout(t._st);
  t._st = setTimeout(() => { const nv = t.closest(".nv"); if (nvIndex(t) !== nv._k) nvPaint(nv, nvIndex(t)); }, 60);
}, true);
document.addEventListener("keydown", e => {
  const t = e.target;
