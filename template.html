// ── V2 (ui/claude-code-v2, 用户 2026-10-14), the same layout as the app's: the entry on the plain
// ground, its notes on a card in the level colour; 自测 and the 复习 / 考核 runs on one answer sheet
// (AnswerSheet.kt) — the question card joined to a panel with the chips and 显示答案. The 你的句子 box
// sits under the question in both 选词 and 打字, the same size in the same place.
const stTitle = it => it.title.replace(/^自测[::]/, "");
const textOf = h => { const d = document.createElement("div"); d.innerHTML = h; return d.textContent; };
const lvShort = level => CEFR.includes(level) ? level : LABEL[level] || level;
const wireXrefsIn = (root, go) => root.querySelectorAll(".xref").forEach(a => {
  const t = byAnchor[a.dataset.ref];
  if (!t) { a.dataset.missing = "1"; return; }
  a.addEventListener("click", e => { e.preventDefault(); go(t); });
});
// the card's foot: how many sentences are still to be answered right before the next stage
function progressHint(it, level, stage){
  const nx = nextStage(stage);
  if (!nx) return "已掌握,不再进复习和考核";
  const since = stageT[it.anchor] || 0, log = stLog[it.anchor] || [];
  const qs = level === "SELFTEST" ? [""] : quizExamples(it).map(x => plainMd(x.en));
  const left = qs.filter(q => !log.some(a => a.t >= since && a.ok && (a.ex || "") === q)).length;
  if (stage === "review") {                               // and the SM-2 streak; then a run moves it
    const more = PROMOTE_REPS - repsOf(it.anchor);
    const todo = [left ? (level === "SELFTEST" ? "答对这道题" : `再答对 ${left} 句`) : "", more > 0 ? `复习里再连续答对 ${more} 次` : ""].filter(Boolean);
    return todo.length ? todo.join(",") + `,就自动移到${STAGE_TAB[nx]}` : `都做到了,可以移到${STAGE_TAB[nx]}`;
  }
  if (!qs.length) return `可以手动移到${STAGE_TAB[nx]}`;
  return !left ? `题都答对过了,可以移到${STAGE_TAB[nx]}` : level === "SELFTEST" ? `答对这道题可移到${STAGE_TAB[nx]}` : `再答对 ${left} 句可移到${STAGE_TAB[nx]}`;
}
// the answer sheet's markup; [o.extra] goes after the stats line (看笔记)
function qsheetHtml(o){
  return `<div class="qcard"><div class="qmeta"><span>${esc(o.meta)}</span>${o.toggle || ""}</div>` +
    `<div class="st" id="q-ask"><div class="st-prompt">${o.prompt}</div>` +
    `<div class="qstats"><span id="q-stats">${esc(o.stats)}</span>${o.extra || ""}</div>` +
    `<div class="ybox" id="ybox"><div class="ybox-h"><span>你的句子</span><button type="button" id="yb-clear" hidden>清空</button></div>` +
    `<textarea class="draft" id="q-in" aria-label="你的英文" placeholder="不看答案,写出英文…(⌘/Ctrl + Enter 显示答案)">${esc(o.draft || "")}</textarea>` +
    `<div class="wb-ans" id="wb-ans" hidden></div><p class="ybox-hint" id="yb-hint" hidden>点最后一个词或右下角的 ⌫ 撤回</p></div></div>` +
    `<div class="st-res" id="q-res" hidden></div></div>` +
    `<div class="qpanel"><div class="wb-keys" id="wb-keys" hidden><div class="wb-bank" id="wb-bank"></div>` +
    `<button type="button" class="wb-bs" id="wb-bs" aria-label="撤回最后一个词">${ICON_BS}</button></div>` +
    `<button class="btn" type="button" id="q-show">显示答案</button><div class="row2" id="q-after" hidden></div></div>`;
}
// The 你的句子 box. [a]: {answer (null: typing only), step (1: chips only; 2: typing, chips as a hint
// while a.help), others, seed, picks and typed (kept by the caller), onReveal, onInput}. The chips
// write into the (hidden) text box, so a reveal reads one place; back to 打字 restores a.typed.
function wireAnswer(root, a){
  const input = root.querySelector("#q-in"), ansEl = root.querySelector("#wb-ans"), keys = root.querySelector("#wb-keys"),
    bank = root.querySelector("#wb-bank"), bs = root.querySelector("#wb-bs"), clear = root.querySelector("#yb-clear"),
    hint = root.querySelector("#yb-hint"), box = root.querySelector("#ybox"), mode = root.querySelector(".qmeta .amode");
  a.typed = a.typed || "";
  const chips = () => !!a.answer && (a.step === 1 || !!a.help);
  const apply = () => {
    const on = chips();
    input.hidden = on; ansEl.hidden = keys.hidden = !on;
    box.classList.toggle("typing", !on);
    if (mode) mode.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", (b.dataset.chips === "1") === on));
    if (on) mountBank(ansEl, bank, input, a.answer, a.others, a.seed, a.picks, { clear, bs, hint });
    else {
      if (a.answer) { input.value = a.typed; input.dispatchEvent(new Event("input")); }
      hint.hidden = true; clear.hidden = !input.value;
      clear.onclick = () => { input.value = ""; input.dispatchEvent(new Event("input")); input.focus(); };
    }
  };
  input.addEventListener("input", () => { if (!chips()) { a.typed = input.value; clear.hidden = !input.value; } if (a.onInput) a.onInput(input.value); });
  input.addEventListener("keydown", e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) a.onReveal(); });
  if (mode) mode.addEventListener("click", e => {
    const b = e.target.closest("button[data-chips]");
    if (!b || b.disabled || a.step === 1 || (b.dataset.chips === "1") === !!a.help) return;
    a.help = b.dataset.chips === "1";
    if (a.help) a.picks.length = 0;                       // a fresh hint each time
    apply();
    if (!a.help) input.focus();
  });
  root.querySelector("#q-show").addEventListener("click", () => a.onReveal());
  apply();
  return { input, apply };
}
// Under a reveal: the notes for what was just asked — the section its example comes from, that
// sentence highlighted (decorateNotes) — or all of them for a 自测题 or an entry without one.
function notesForQuestionHtml(it, ex){
  let label = "笔记", html = it.html;
  if (ex) {
    const k = exKey(ex.en);
    for (const [l, h] of it.slides) {
      const d = document.createElement("div"); d.innerHTML = h;
      if ([...d.querySelectorAll("ol.ex > li .en")].some(e => exKey(e.textContent) === k)) { label = "笔记里的这一句 · " + l; html = h; break; }
    }
  }
  return `<div class="nfq"><div class="nfq-h"><span>${esc(label)}</span><button type="button" class="linkish" data-allnotes>全部笔记 ›</button></div><div class="body">${html}</div></div>`;
}
function decorateNotes(root, it, ex, go, onAll){
  const box = root.querySelector(".nfq");
  if (!box) return;
  const p = box.querySelector(".body").firstElementChild;
  if (p && p.tagName === "P" && p.children.length === 1 && p.firstElementChild.tagName === "STRONG" &&
      p.textContent.trim() === p.firstElementChild.textContent.trim() && /[:：]$/.test(p.textContent.trim())) p.classList.add("lbl");
  markExamples(box, it);
  if (ex) box.querySelectorAll("ol.ex > li[data-key]").forEach(li => li.classList.toggle("lit", li.dataset.key === plainMd(ex.en)));
  wireXrefsIn(box, go);
  const all = box.querySelector("[data-allnotes]");
  if (onAll) all.addEventListener("click", onAll); else all.remove();
}

// [o.from]: the side the card showed before a move (it turns over to the new one);
// [o.face]: "front" / "back" to re-render on that side without turning.
// [o.ex]: which example to ask (再试一次 keeps it, 下一句 adds one); by default the next by attempt count.
// [o.step]: 2 = the sentence's ② 打字, with [o.bankOk] how its ① 选词 went.
function show(it, level, i, o = {}){
  if (scrim) scrim.remove();
  scrim = document.createElement("div");
  // wide screens, 浏览: docked in the column next to the list instead of over the page
  const docked = dockable() && !document.body.classList.contains("running");
  scrim.className = "scrim" + (docked ? " docked" : "");
  const sheet = document.createElement("div");
  sheet.setAttribute("role", "dialog");
  sheet.setAttribute("aria-modal", String(!docked));
  sheet.setAttribute("aria-label", it.title);
  sheet.style.setProperty("--sw", `var(${LV[level].sw[i % 3]})`);
  const back = trail[trail.length - 1];
  const stage = stageOf(it, level);
  const selfTest = level === "SELFTEST";
  const wantBack = stage === "test";                    // 考核 opens on the 自测 side, the rest on the notes
  let ex = selfTest ? null : o.ex !== undefined ? quizEx(it, o.ex) : quizEx(it);   // fixed before this try is logged
  const lvName = CEFR.includes(level) ? level : (TYPES.find(t => t[0] === level) || [, level])[1];
  // meta band: the headword and a pill; the rest of the facts unfold under it
  const pill = [lvName, (it.pos || "").split(/[((]/)[0].trim(), it.ipa].filter(Boolean).join(" · ");
  const rows = [["类型", lvName], ["编号", it.no ? "#" + it.no : ""], ["音标", it.ipa], ["词性", it.pos], ["CEFR", it.cefr],
    ["掌握", it.mastery === "write" ? "会写" : "认识"], ["收录", it.date]].filter(r => r[1]);
  // the four stages on a track; a click on another one moves the entry there (only moves)
  const idx = STAGES.findIndex(st => st[0] === stage);
  const levels = `<div class="lv" style="--n:${STAGES.length};--k:${idx}">` + STAGES.map(([k, name], j) => {
    return `<button type="button" class="lvl${j < idx ? " passed" : j === idx ? " on" : ""}" data-to="${k}"${j === idx ? " disabled" : ""}>` +
      `<span class="node">${j < idx ? "✓" : ""}</span><span>${name}</span></button>`;
  }).join("") + `</div>`;
  const curEx = () => ex ? plainMd(ex.en) : null;      // stats and history are this sentence's own
  let step = o.step || 1;
  const qMeta = () => (selfTest ? "自测题 · 中译英" : ex ? `例句 ${ex.k + 1} / ${ex.of} · 中译英` : "回想并写出来") +
    (answerOf(it, level, ex) ? stepLabel(step) : "");
  const promptHtml = () => selfTest ? `<p class="qprompt">${esc(stTitle(it))}</p>`
    : ex ? `<p class="qprompt">${esc(plainMd(ex.zh))}</p>` : askHtml({ it, level, i }, kind({ it, level, i }));
  // the card: the notes on the front, with what's left in this stage and 自测这条 at its foot; the
  // answer sheet on the back. 学习中 / 复习 may look at the notes first; 考核 only after answering.
  const front = `<div class="face fr"><div class="body fillb">${notesHtml(it, true)}</div>` +
    `<div class="card-foot"><span class="hint" id="cf-hint">${esc(progressHint(it, level, stage))}</span>` +
    `<button class="btn" type="button" id="to-quiz">${selfTest ? "自测一下" : "自测这条"} →</button></div></div>`;
  const backFace = `<div class="face bk">` + qsheetHtml({
    meta: qMeta(), toggle: answerOf(it, level, ex) ? modeToggleHtml(step) : "", prompt: promptHtml(),
    stats: stStatsLine(it.anchor, curEx()),
    extra: stage !== "test" ? `<button type="button" class="linkish" id="to-notes-pre">看笔记</button>` : "",
  }) + `</div>`;
  const startBack = o.from !== undefined ? o.from : o.face ? o.face === "back" : wantBack;
  // while the answer sheet shows, the pill and the track fold away, as on the app's 自测
  sheet.className = "sheet" + (cardFull ? " full" : "") + (startBack ? " quizzing" : "");
  const nextT = nextInList(), pos = openList.indexOf(openAt);
  if (nextT) sheet.classList.add("has-nx");
  sheet.innerHTML =
    `<button class="x" type="button" aria-label="关闭">✕</button>` +
    (nextT ? `<button class="nx" type="button" title="下一个:${esc(plainMd(nextT.it.title))}"><span>${pos + 1} / ${openList.length}</span> <b>下一个</b> ›</button>` : "") +
    (back ? `<button class="back" type="button">← 返回 ${back.it.title}</button>` : "") +
    `<div class="mband"><h2>${it.title}${spkBtn(speakText(it, level))}</h2>` +
    `<button type="button" class="mpill" aria-expanded="false"><span>${esc(pill)}</span>${ICON_CHEV}</button>` +
    `<div class="mdet" hidden>${rows.map(([k, v]) => `<b>${k}</b><span>${esc(String(v))}</span>`).join("")}</div></div>` +
    levels +
    `<div class="ecard${startBack ? " flipped" : ""}"><div class="inner">${front}${backFace}</div></div>`;
  scrim._entry = { it, level, i };
  scrim.append(sheet);
  document.body.append(scrim);
  markSel(docked ? it.anchor : "");
  const card = sheet.querySelector(".ecard");
  const flip = toQuiz => { card.classList.toggle("flipped", toQuiz); sheet.classList.toggle("quizzing", toQuiz); };
  if (o.from !== undefined && o.from !== wantBack) requestAnimationFrame(() => requestAnimationFrame(() => flip(wantBack)));
  markQuizExamples(sheet, it);
  markExamples(sheet, it);
  // a cross-reference opens the note it points at, keeping a trail to come back
  wireXrefsIn(sheet, follow);
  if (back) sheet.querySelector(".back").addEventListener("click", goBack);
  const mpill = sheet.querySelector(".mpill"), mdet = sheet.querySelector(".mdet");
  mpill.addEventListener("click", () => { mdet.hidden = !mdet.hidden; mpill.setAttribute("aria-expanded", !mdet.hidden); });
  // moving re-renders the sheet, turning the card over if the 自测 side comes or goes
  sheet.querySelectorAll(".lvl[data-to]").forEach(b => b.addEventListener("click", () => {
    const was = card.classList.contains("flipped");
    setStage(it, b.dataset.to);
    render();
    show(it, level, i, { from: was });
  }));
  sheet.querySelectorAll(".full").forEach(b => b.addEventListener("click", () => {
    cardFull = !cardFull;
    sheet.classList.toggle("full", cardFull);
    sheet.querySelectorAll(".full").forEach(f => { f.innerHTML = cardFull ? ICON_UNFULL : ICON_FULL; f.setAttribute("aria-label", cardFull ? "退出全屏" : "全屏"); });
  }));
  sheet.querySelector("#to-quiz").addEventListener("click", () => flip(true));
  const pre = sheet.querySelector("#to-notes-pre");
  if (pre) pre.addEventListener("click", () => flip(false));

  // the answer sheet
  const res = sheet.querySelector("#q-res"), after = sheet.querySelector("#q-after");
  let revealed = false;
  const cfg = { answer: answerOf(it, level, ex), step, seed: hashStr(it.anchor) + (stLog[it.anchor] || []).length, picks: [], onReveal: () => reveal() };
  cfg.others = othersOf(it, cfg.answer);
  const api = wireAnswer(sheet.querySelector(".face.bk"), cfg), input = api.input;
  // a click on an example toggles it in or out of 自测; an unanswered question follows
  const toggleLi = li => {
    if (!toggleQuizEx(it, li.dataset.en)) return;
    li.classList.toggle("out");
    if (revealed || input.value) return;
    ex = quizEx(it);
    sheet.querySelector(".st-prompt").innerHTML = promptHtml();
    sheet.querySelector(".qmeta span").textContent = qMeta();
    sheet.querySelector("#q-stats").textContent = stStatsLine(it.anchor, curEx());
    cfg.answer = answerOf(it, level, ex); cfg.others = othersOf(it, cfg.answer); cfg.picks.length = 0;
    if (step === 2) { show(it, level, i, { face: "back" }); return; }   // a new sentence starts at ①
    api.apply();
  };
  // long-press: 复制 / 收藏 / 加入或移出自测
  const afterLongPress = wireExMenu(sheet, it, toggleLi);
  sheet.addEventListener("click", e => {
    if (afterLongPress()) return;
    const li = e.target.closest("li.qz");
    if (!li || e.target.closest("a")) return;
    toggleLi(li);
  });
  const adv = () => advanceReady(it, level, stage) ? advanceHtml(stage) : "";
  const quiet = () => selfTest ? stTitle(it) : ex ? plainMd(ex.zh) : "";
  const paint = verdict => {                             // the verdict, the notes it comes from, the history
    res.innerHTML = (quiet() ? `<p class="qquiet">${esc(quiet())}</p>` : "") + verdict + adv() +
      notesForQuestionHtml(it, selfTest ? null : ex) + stHistoryHtml(it.anchor, curEx());
    decorateNotes(res, it, selfTest ? null : ex, follow, () => flip(false));
    res.querySelectorAll("[data-ok]").forEach(b => b.addEventListener("click", () => {   // graded by me
      const ok = b.dataset.ok === "1";
      logAttempt(it.anchor, input.value, ok, "entry");
      paint(movedHtml(null, input.value, ok));
    }));
    // 移到 X moves and goes on to the next one in the list; a move on the track stays put
    const ab = res.querySelector("#adv");
    if (ab) ab.addEventListener("click", () => { setStage(it, nextStage(stage)); render(); if (nextInList()) goNext(); else show(it, level, i, { from: true }); });
    sheet.querySelector("#cf-hint").textContent = progressHint(it, level, stage);
  };
  const reveal = () => {
    if (revealed) return;
    revealed = true;
    const v = input.value, stats = () => stStatsLine(it.anchor, curEx());
    const ans = selfTest ? it.answer || "" : ex ? plainMd(ex.en) : null;
    res.hidden = false;
    sheet.querySelector("#q-ask").hidden = sheet.querySelector("#wb-keys").hidden = sheet.querySelector("#q-show").hidden = true;
    const mode = sheet.querySelector(".qmeta .amode");
    if (mode) mode.hidden = true;
    if (ans !== null && step === 1) {                    // ① checked, not logged: on to ② 打字
      const bankOk = !!v.trim() && bestDiff(v, ans).same;
      res.innerHTML = (quiet() ? `<p class="qquiet">${esc(quiet())}</p>` : "") + verdictHtml(v, ans, STEP1_NOTE);
      after.innerHTML = `<button class="btn" type="button" id="st-step2">下一步:打字 ›</button>`;
      after.hidden = false;
      const b = after.querySelector("#st-step2");
      b.addEventListener("click", () => show(it, level, i, { face: "back", ex: ex ? ex.k : undefined, step: 2, bankOk }));
      b.focus();
      return;
    }
    if (ans !== null) {                                   // ②: right only if ① was too
      const typedOk = !cfg.help && !!v.trim() && bestDiff(v, ans).same;
      logAttempt(it.anchor, v, !!o.bankOk && typedOk, "entry", ex ? plainMd(ex.en) : "");
      paint(stepsHtml(!!o.bankOk, typedOk, !!cfg.help) + verdictHtml(v, ans, stats()));
    }
    else { if (!v.trim()) logAttempt(it.anchor, "", false, "entry"); paint(movedHtml(null, v)); }
    // 再试一次 asks the same sentence again; with more than one, 下一句 goes on to the next
    after.innerHTML = `<button class="btn ghost" type="button" id="st-again">↻ 再试一次</button>` +
      (ex && ex.of > 1 ? `<button class="btn" type="button" id="st-nextex">下一句 ›</button>` : `<button class="btn" type="button" id="to-notes">看笔记</button>`);
    after.hidden = false;
    after.querySelector("#st-again").addEventListener("click", () => show(it, level, i, { face: "back", ex: ex && ex.k }));
    const nx = after.querySelector("#st-nextex");
    if (nx) nx.addEventListener("click", () => show(it, level, i, { face: "back", ex: ex.k + 1 }));
    const tn = after.querySelector("#to-notes");
    if (tn) tn.addEventListener("click", () => flip(false));
    sheet.querySelector("#to-quiz").textContent = "回到自测 →";
  };

  sheet.querySelector(".x").addEventListener("click", close);
  if (nextT) sheet.querySelector(".nx").addEventListener("click", goNext);
  scrim.addEventListener("click", e => { if (e.target === scrim && !docked) close(); });
  if (!o.noFocus) (startBack && !input.hidden ? input : sheet.querySelector(".x")).focus();
}
function close(){
  if (!scrim) return;
  scrim.remove(); scrim = null; trail = []; openList = [];
  markSel("");
  if (lastFocus) lastFocus.focus();
}
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { if (scrim) close(); else if (document.activeElement === q) { q.value = ""; render(); } }
});

// ── 发送前自检: the mistake types, most frequent first, each with its question ──
(function buildCheck(){
  const el = document.getElementById("check");
  if (!MISTAKES.length) { el.hidden = true; return; }
  const firstBold = t => (t.match(/\*\*(.+?)\*\*/) || [, t])[1];
  const rows = [...MISTAKES].sort((a, b) => b.items.length - a.items.length).map(g =>
    `<li><button type="button" data-type="${g.type}">` +

// ── 复习's schedule: SM-2, same rules as the app (review/ReviewStore.kt). The quiz grades it —
// a sentence answered right is 记得 (4), wrong is 忘了 (1) — so there are no grade buttons. ──
let rev;
try { rev = JSON.parse(store.get("vk.review", "")) } catch(e){}
if (!rev || !rev.cards) rev = { cards: {}, newDay: 0, newToday: 0 };
const saveRev = () => store.set("vk.review", JSON.stringify(rev));
function schedule(c, q, today){
  const ease = Math.max(1.3, c.ease + (0.1 - (5 - q) * (0.08 + (5 - q) * 0.02)));
  if (q < 3) return { ...c, ease, interval: 1, reps: 0, lapses: c.lapses + 1, due: today + 1 };
  const reps = c.reps + 1;
  const interval = reps === 1 ? 1 : reps === 2 ? (q === 5 ? 4 : 3) : Math.max(c.interval + 1, Math.round(c.interval * ease));
  return { ...c, ease, interval, reps, due: today + interval };
}
// Today's 复习 queue: what's due, then what was never scheduled (会写 first, then most recently
// 收录). What's in 复习 is my own choice, so there is no daily quota any more.
function planToday(){
  const today = dayNo();
  const live = ALL.filter(t => stageOf(t.it, t.level) === "review");
  const due = live.filter(t => rev.cards[t.it.anchor] && rev.cards[t.it.anchor].due <= today)
    .sort((a, b) => rev.cards[a.it.anchor].due - rev.cards[b.it.anchor].due);
  const fresh = live.filter(t => !rev.cards[t.it.anchor])
    .sort((a, b) => (b.it.mastery === "write") - (a.it.mastery === "write") || b.it.date.replace("~", "").localeCompare(a.it.date.replace("~", "")));
  return { due, fresh };
}
// 复习 → 考核 by itself: right answers in a row on the SM-2 card first — right on days 0, +1 and +3
// (the intervals above) = still remembered after a three-day gap. Same as PROMOTE_REPS in ReviewStore.kt.
const PROMOTE_REPS = 3;
const repsOf = anchor => (rev.cards[anchor] || {}).reps || 0;
function scheduleReview(anchor, ok){
  const today = dayNo(), existing = rev.cards[anchor];
  rev.cards[anchor] = { ...schedule(existing || { ease: 2.5, interval: 0, reps: 0, lapses: 0, due: 0 }, ok ? 4 : 1, today), t: Date.now() };
  saveRev(); syncSoon();
}
// What the front of a card asks: 会写 entries — and anything I moved to 自测 — are produced
// (中→英); the other 认识 entries are recognised (英→中).
function kind(t){
  if (t.level === "SELFTEST") return "selftest";
  if (t.level === "SENTENCE" && t.it.original) return "sentence";
  if (t.it.title.startsWith("翻译")) return "translate";
  if (t.level === "GRAMMAR") return "grammar";
  return t.it.mastery === "write" || stageOf(t.it, t.level) !== "learn" ? "produce" : "recognize";
}
// A 中→英 prompt must not give the answer away: blank out the headword's English words.
function maskTitle(text, title){
  const ws = [...new Set((title.match(/[A-Za-z]{3,}/g) || []).map(w => w.toLowerCase()))];
  return ws.reduce((t, w) => t.replace(new RegExp("\\b" + w + "\\w*", "gi"), "＿＿"), text);
}

// ── 同步: progress.json on the repo's orphan `progress` branch, read and written through the
// GitHub API with my own token — same format and merge rules as sync/ProgressSync.kt.
// Moves, review cards and 自测 results sync; what I typed in a 自测 never leaves the device.
const GH = "https://api.github.com/repos/chinalwb/vocab/contents/progress.json";
const ELSEWHERE = "(在另一台设备上写的)";               // a synced 自测 attempt: result only, no text
const ghToken = () => store.get("vk.gh", "");
let syncState = {}, syncing = null, syncAgain = false, syncTimer = 0;
try { syncState = JSON.parse(store.get("vk.sync", "{}")) || {}; } catch(e){}

// key order doesn't matter when comparing with what's on GitHub
const stable = v => JSON.stringify(v, (k, x) => x && typeof x === "object" && !Array.isArray(x)
  ? Object.fromEntries(Object.keys(x).sort().map(k2 => [k2, x[k2]])) : x);
const normProgress = r => ({ v: 1, stages: r.stages || {}, cards: r.cards || {}, newDay: r.newDay || 0,
  newToday: r.newToday || 0, resetAt: r.resetAt || 0, attempts: r.attempts || {}, favs: r.favs || {} });
function progressOut(){
  const st = {}, at = {};
  for (const a in stages) st[a] = { s: stages[a], t: stageT[a] || 0 };
  for (const a in stLog) at[a] = stLog[a].map(x => ({ t: x.t, ok: x.ok, peek: !x.text, via: x.via, ex: x.ex || "" }));
  return normProgress({ stages: st, cards: rev.cards, newDay: rev.newDay, newToday: rev.newToday, resetAt: rev.resetAt, attempts: at, favs });
}
// Newest wins per entry (per sentence for ⭐); a reset drops every card graded before it; 自测 attempts are a union.
function applyRemote(r){
  r = normProgress(r);
  const resetAt = Math.max(rev.resetAt || 0, r.resetAt);
  const cards = {};
  for (const a of new Set([...Object.keys(rev.cards), ...Object.keys(r.cards)])) {
    const l = rev.cards[a], o = r.cards[a];
    const c = !o || (l && (l.t || 0) >= (o.t || 0)) ? l : o;
    if ((c.t || 0) >= resetAt) cards[a] = c;
  }
  const day = r.newDay > rev.newDay ? r : rev.newDay > r.newDay ? rev : { newDay: rev.newDay, newToday: Math.max(rev.newToday, r.newToday) };
  rev = { cards, newDay: day.newDay, newToday: day.newToday, resetAt };
  saveRev();
  for (const a in r.stages) {
    const o = r.stages[a];
    if (STAGE_NAME[o.s] && o.t > (stageT[a] || 0)) { stages[a] = o.s; stageT[a] = o.t; }
  }
  store.set("vk.stage", JSON.stringify(stages));
  store.set("vk.stage.t", JSON.stringify(stageT));
  for (const a in r.attempts) {
    const list = stLog[a] || [], seen = new Set(list.map(x => x.t));
    r.attempts[a].forEach(x => { if (!seen.has(x.t)) list.push({ t: x.t, text: x.peek ? "" : ELSEWHERE, ok: x.ok, via: x.via, ex: x.ex || "" }); });
    list.sort((x, y) => x.t - y.t);
    stLog[a] = list.slice(-ST_MAX);
  }
  store.set("vk.selftest", JSON.stringify(stLog));
  for (const a in r.favs) for (const en in r.favs[a]) {
    const o = r.favs[a][en], m = favs[a] = favs[a] || {};
    if (o.t > ((m[en] || {}).t || 0)) m[en] = { on: !!o.on, t: o.t };
  }
  store.set("vk.favs", JSON.stringify(favs));
}
const b64 = t => btoa(unescape(encodeURIComponent(t)));
const unb64 = t => decodeURIComponent(escape(atob(t.replace(/\s/g, ""))));
async function gh(method, body){
  const r = await fetch(GH + (method === "GET" ? "?ref=progress" : ""), {
    method, cache: "no-store", body: body && JSON.stringify(body),
    headers: { Authorization: "Bearer " + ghToken(), Accept: "application/vnd.github+json" },
  });
  if (r.status === 409 || r.status === 422) return null;    // someone wrote first: pull again
  if (!r.ok) throw new Error(r.status === 401 ? "token 无效或已过期" :
    r.status === 403 || r.status === 404 ? "token 没有 chinalwb/vocab 的读写权限" : "GitHub 返回 " + r.status);
  return r.json();
}
function syncNow(){
  if (!ghToken()) return Promise.resolve();
  if (syncing) { syncAgain = true; return syncing; }
  clearTimeout(syncTimer); syncTimer = 0;
  syncState.busy = true; paintSync();
  syncing = (async () => {
    for (let k = 0; k < 3; k++) {
      const got = await gh("GET");
      const remote = JSON.parse(unb64(got.content));
      applyRemote(remote);
      const out = progressOut();
      if (stable(out) === stable(normProgress(remote))) return;
      if (await gh("PUT", { message: "sync: progress from web", branch: "progress", sha: got.sha,
        content: b64(JSON.stringify(out, null, 1) + "\n") })) return;
    }
    throw new Error("连续冲突,稍后再试");
  })().then(() => { syncState = { ok: Date.now() }; }, e => { syncState = { ok: syncState.ok, err: e.message || String(e) }; })
    .finally(() => {
      syncing = null;
      store.set("vk.sync", JSON.stringify(syncState));
      refreshStages(); refreshStCounts();
      if (view !== "review" || !session) render();   // never yank a card I'm answering
      if (syncAgain) { syncAgain = false; syncNow(); }
    });
  return syncing;
}
// changes are batched: one commit per burst of activity, not per tap
function syncSoon(){ if (!ghToken()) return; clearTimeout(syncTimer); syncTimer = setTimeout(syncNow, 15000); }
document.addEventListener("visibilitychange", () => {

// ── 复习 / 考核 / 掌握 tabs: a stage's entries, listed like 浏览, under a header that starts a run
// through them (掌握 just lists). 复习 shows the notes first, then asks; 考核 asks first. One run
// at a time, in `quiz`. Same order and rules as ui/QuizScreen.kt. ──
let quiz = null, resetArmed = false;
const newest = (a, b) => b.it.date.replace("~", "").localeCompare(a.it.date.replace("~", "")) || b.it.no - a.it.no;
const inStage = k => ALL.filter(t => stageOf(t.it, t.level) === k).sort(newest);
function quizQueue(stage){
  if (stage === "review") { const p = planToday(); return [...p.due, ...p.fresh]; }
  // never tried first, then wrong or peeked last time, then oldest attempt
  const rank = t => { const last = stSummary(t.it.anchor).last; return [!last ? 0 : !last.text || !last.ok ? 1 : 2, last ? last.t : t.it.no]; };
  return inStage(stage).map(t => [rank(t), t]).sort((a, b) => a[0][0] - b[0][0] || a[0][1] - b[0][1]).map(x => x[1]);
}

// Moving on: once every question of an entry has been answered right since it entered its stage —
// each example still in 自测, or a 自测题's one answer — the next stage is offered (advanceReady()
// in ui/SelfTest.kt). Entries with nothing to check against move only by hand.
// 复习 → 考核 also needs the SM-2 card to have PROMOTE_REPS right answers in a row — remembered
// across a gap of days, not just on the day; then a 复习 run moves it by itself, and entries graded
// by me qualify on that alone.
function advanceReady(it, level, stage){
  if (!nextStage(stage)) return false;
  const since = stageT[it.anchor] || 0;
  const qs = level === "SELFTEST" ? [""] : quizExamples(it).map(x => plainMd(x.en));
  const log = stLog[it.anchor] || [];
  const all = qs.every(q => log.some(a => a.t >= since && a.ok && (a.ex || "") === q));
  if (stage === "review") return repsOf(it.anchor) >= PROMOTE_REPS && all;

}
const advanceHtml = stage => `<div class="adv"><span>这一阶段的题都答对过了</span><button class="btn go" type="button" id="adv">移到${STAGE_TAB[nextStage(stage)]}</button></div>`;

    `<div class="ssum-lg">${["没做过", "上次没对", "上次答对"].map((l, k) => `<span><i class="b${k}"></i>${l} ${bar[k]}</span>`).join("")}</div>` : "") +
  `<button class="btn" type="button" id="qz-start"${enabled ? "" : " disabled"}>${btn}${enabled ? " →" : ""}</button>` +

    // 没做过 / 上次没对 (wrong or peeked) / 上次答对, in the order the run takes them
    const grp = t => { const l = stSummary(t.it.anchor).last; return !l ? 0 : !l.text || !l.ok ? 1 : 2; };
    const by = [0, 1, 2].map(g => queue.filter(t => grp(t) === g));
    groups = [["没做过", by[0], gloss], ["上次没对", by[1], t => tried(t) || gloss(t)], ["上次答对", by[2], t => tried(t) || gloss(t)]];
    sum = summaryHtml(mine.length, "条考核中", [], by.map(x => x.length), queue.length ? `开始考核 ${queue.length} 题` : "还没有考核中的条目", queue.length > 0, "");
  }
  groups = groups.filter(g => g[1].length);
  const order = groups.flatMap(g => g[1].map(t => t.it.anchor));
  el.innerHTML = sum +
    (ready.length ? `<button type="button" class="ready" id="qz-ready"><span class="ck" aria-hidden="true">✓</span><span class="t">${ready.length} 条的题都答对过了,可以移到${STAGE_TAB[nextStage(stage)]}</span>${ICON_CHEV}</button>` : "") +
    groups.map(([title, list, sub]) => `<h3 class="grp-h">${title} · ${list.length}</h3><div class="srows">` +
      list.map(t => `<button type="button" class="srow" data-anchor="${t.it.anchor}" style="--sw:var(${LV[t.level].sw[t.i % 3]})">` +
        `<span class="t"><b>${stTitle(t.it)}</b><small>${esc(sub(t))}</small></span><span class="tg">${lvShort(t.level)}</span></button>`).join("") + `</div>`).join("");
  const start = el.querySelector("#qz-start");
  if (start) start.addEventListener("click", () => {
    quiz = { stage, queue: quizQueue(stage), index: 0, studied: false, revealed: false, draft: "", done: 0, ok: 0, checked: 0, advanced: 0, missed: false, promoted: [], demoted: [], k: 0, step: 1, entryOk: true };
    render(); window.scrollTo(0, 0);
  });
  const rd = el.querySelector("#qz-ready");
  if (rd) rd.addEventListener("click", () => { const t = ready[0]; open(t.it, t.level, t.i, ready.map(x => x.it.anchor)); });
  el.querySelectorAll(".srow").forEach(b => b.addEventListener("click", () => { const t = byAnchor[b.dataset.anchor]; open(t.it, t.level, t.i, order); }));
}
// One card of a run: ✕, the progress bar and "3 / 32" on top, then 复习's notes (翻面做题) or the
// answer sheet; after the reveal, the verdict, the notes the sentence comes from, and 下一题 — with
// the move to the next stage offered once it's earned.
// An entry asks every one of its sentences (用户 2026-10-15, same as nextQuiz() in VocabViewModel.kt),
// s.k in turn, each ① 选词 then ② 打字 (s.step); the entry is right only if all of them are
// (s.entryOk) — that grades the SM-2 card and decides the moves, once, after its last sentence.
function renderQuizCard(el){
  const s = quiz, t = s.queue[s.index], it = t.it, k = kind(t), exam = t.level === "SELFTEST", stage = s.stage;
  if (!exam && s.ex === undefined) s.ex = quizEx(it, s.k);  // this sentence, fixed for it
  const ex = exam ? null : s.ex, exEn = ex ? plainMd(ex.en) : null;
  const qAns = answerOf(it, t.level, ex), step = qAns ? s.step : 2;
  const lastQ = exam || !ex || ex.k + 1 >= ex.of;           // the entry's last sentence
  const final = s.revealed && step === 2 && lastQ;           // the entry is done
  const pct = Math.round((s.index + (final ? 1 : 0)) / s.queue.length * 100);
  const sw = `var(${LV[t.level].sw[t.i % 3]})`;
  const top = `<div class="runbar"><button type="button" class="x2" id="qz-stop" aria-label="结束这一轮">✕</button>` +
    `<div class="bar" role="img" aria-label="进度 ${s.index + 1} / ${s.queue.length}"><i style="width:${pct}%"></i></div><span>${s.index + 1} / ${s.queue.length}</span></div>`;
  const stop = () => { quiz = null; render(); };
  const go = x => open(x.it, x.level, x.i);
  if (stage === "review" && !s.studied) {                   // 复习: read it again first
    el.innerHTML = `<div class="run">${top}<div class="scard" style="--sw:${sw}"><div class="shead"><p class="lab">${lvShort(t.level)} · 先看一遍</p>` +
      `<p class="big">${it.title}</p>${it.ipa ? `<p class="ipa">${it.ipa}</p>` : ""}</div>` +
      `<div class="body fillb">${notesHtml(it, true, false)}</div><div class="sfoot"><button class="btn" type="button" id="qz-studied">翻面做题</button></div></div></div>`;
    el.querySelector("#qz-stop").addEventListener("click", stop);
    el.querySelector("#qz-studied").addEventListener("click", () => { s.studied = true; renderQuizCard(el); });
    markExamples(el, it); wireXrefsIn(el, go);
    return;
  }
  const ready = final && advanceReady(it, t.level, stage);
  // 复习 → 考核 happens by itself on 下一题; 考核 sends a miss back to 复习 — say so, no button
  const auto = ready && stage === "review", back = final && stage === "test" && s.missed && !ready;
  const meta = (exam ? "自测题" : plainMd(textOf(it.title))) + (ex ? ` · 例句 ${ex.k + 1} / ${ex.of}` : "") + " · 中译英" + (qAns ? stepLabel(step) : "");
  const prompt = exam ? `<p class="qprompt">${esc(stTitle(it))}</p>` : ex ? `<p class="qprompt">${esc(plainMd(ex.zh))}</p>` : askHtml(t, k);
  el.innerHTML = `<div class="run">${top}<div class="qsheet" style="--sw:${sw}">` +
    qsheetHtml({ meta, toggle: qAns && !s.revealed ? modeToggleHtml(step) : "", prompt, stats: stStatsLine(it.anchor, exEn), draft: s.draft }) + `</div></div>`;
  el.querySelector("#qz-stop").addEventListener("click", stop);
  const via = stage;                                        // "review" / "test" in the history
  // 下一题: the move I tapped, or the one the run makes by itself (see nextQuiz() in VocabViewModel.kt)
  const next = adv => {
    if (adv || auto) { setStage(it, nextStage(stage)); s.advanced++; if (stage === "review") s.promoted.push(it.anchor); }
    else if (back) { setStage(it, "review"); scheduleReview(it.anchor, false); s.demoted.push(it.anchor); }
    s.index++; s.done++; s.revealed = false; s.draft = ""; s.graded = undefined; s.ex = undefined; s.studied = false; s.picks = undefined; s.missed = false;
    s.k = 0; s.step = 1; s.entryOk = true; s.ans = undefined;
    render(); window.scrollTo(0, 0);
  };
  // within the entry: ① → ②, then its next sentence
  const onward = nextK => {
    if (nextK) { s.k++; s.ex = undefined; s.step = 1; } else s.step = 2;
    s.revealed = false; s.draft = ""; s.picks = undefined; s.ans = undefined;
    renderQuizCard(el); window.scrollTo(0, 0);
  };
  const reveal = () => {
    const tried = !!s.draft.trim(), ans = exam ? it.answer || "" : exEn;
    if (qAns && step === 1) { s.bankOk = tried && bestDiff(s.draft, ans).same; s.revealed = true; renderQuizCard(el); return; }
    let ok = null;
    if (qAns) {                                             // ②: right only if ① was too
      s.typedOk = !s.ans.help && tried && bestDiff(s.draft, ans).same; s.helped = !!s.ans.help;
      ok = s.bankOk && s.typedOk;
      logAttempt(it.anchor, s.draft, ok, via, exEn || "");
    }
    else if (!tried) { logAttempt(it.anchor, "", false, via); ok = false; }
    if (ok !== null) {
      if (tried) { s.checked++; if (ok) s.ok++; }
      s.entryOk = s.entryOk && ok;
      if (lastQ) { if (stage === "review") scheduleReview(it.anchor, s.entryOk); s.missed = !s.entryOk; }
    }
    s.revealed = true; renderQuizCard(el);
  };
  const api = wireAnswer(el.querySelector(".qsheet"), Object.assign(s.ans = s.ans || { typed: s.draft }, {
    answer: s.revealed ? null : qAns, step, others: othersOf(it, qAns), seed: hashStr(it.anchor) + s.index + 7 * s.k,
    picks: s.picks = s.picks || [], onReveal: () => { if (!s.revealed) reveal(); }, onInput: v => { s.draft = v; },
  }));
  if (!s.revealed) { if (!api.input.hidden) api.input.focus(); return; }
  const res = el.querySelector("#q-res"), after = el.querySelector("#q-after");
  const stats = stStatsLine(it.anchor, exEn);
  const quiet = exam ? stTitle(it) : ex ? plainMd(ex.zh) : "";
  res.hidden = false;
  el.querySelector("#q-ask").hidden = el.querySelector("#wb-keys").hidden = el.querySelector("#q-show").hidden = true;
  after.hidden = false;
  if (qAns && step === 1) {                                 // ① checked, not logged
    res.innerHTML = (quiet ? `<p class="qquiet">${esc(quiet)}</p>` : "") + verdictHtml(s.draft, exam ? it.answer || "" : exEn, STEP1_NOTE);
    after.innerHTML = `<button class="btn" type="button" id="qz-step2">下一步:打字 ›</button>`;
    const b = after.querySelector("#qz-step2"); b.addEventListener("click", () => onward(false)); b.focus();
    return;
  }
  const whole = final && ex && ex.of > 1 ? `<p class="steps${s.entryOk ? " ok" : ""}">这一条的 ${ex.of} 句都做完了:${s.entryOk ? "全部答对" : "有没答对的,整条记为没对"}</p>` : "";
  res.innerHTML = (quiet ? `<p class="qquiet">${esc(quiet)}</p>` : "") + (qAns ? stepsHtml(s.bankOk, s.typedOk, s.helped) : "") +
    (exam ? verdictHtml(s.draft, it.answer || "", stats) : ex ? verdictHtml(s.draft, exEn, stats) : movedHtml(null, s.draft, s.graded)) + whole +
    (auto ? `<div class="adv"><span>复习里连续答对 ${PROMOTE_REPS} 次了,下一题时自动移到考核</span></div>` :
      back ? `<div class="adv"><span>没答对,下一题时退回复习,排期从明天重新开始</span></div>` : ready ? advanceHtml(stage) : "") + notesForQuestionHtml(it, ex) + stHistoryHtml(it.anchor, exEn);
  decorateNotes(res, it, ex, go, () => go(t));
  if (!lastQ) {
    after.innerHTML = `<button class="btn" type="button" id="qz-nextk">下一句 › <small>${ex.k + 2} / ${ex.of}</small></button>`;
    const b = after.querySelector("#qz-nextk"); b.addEventListener("click", () => onward(true)); b.focus();
    return;
  }
  after.innerHTML = (ready && !auto ? `<button class="btn ghost" type="button" id="qz-adv">移到${STAGE_TAB[nextStage(stage)]}</button>` : "") +
    `<button class="btn" type="button" id="qz-next">${s.index + 1 < s.queue.length ? "下一题 ›" : "完成"}</button>`;
  res.querySelectorAll("[data-ok]").forEach(b => b.addEventListener("click", () => {   // graded by me
    s.graded = b.dataset.ok === "1";
    logAttempt(it.anchor, s.draft, s.graded, via);
    if (stage === "review") scheduleReview(it.anchor, s.graded);
    s.checked++; if (s.graded) s.ok++; s.missed = !s.graded;
    renderQuizCard(el);
  }));
  const nx = after.querySelector("#qz-next"); nx.addEventListener("click", () => next(false)); nx.focus();
  const ad = after.querySelector("#qz-adv"); if (ad) ad.addEventListener("click", () => next(true));
  const ab = res.querySelector("#adv"); if (ab) ab.addEventListener("click", () => next(true));
}

// ── 练习: a daily imitation task and a weekly paragraph. The app picks the same ones
// (ui/PracticeScreen.kt): pool = 会写 entries that aren't 句子 / 自测, sorted by anchor. ──
const POOL = ALL.filter(t => t.it.mastery === "write" && t.level !== "SENTENCE" && t.level !== "SELFTEST")
  .sort((a, b) => a.it.anchor < b.it.anchor ? -1 : a.it.anchor > b.it.anchor ? 1 : 0);
let skip = 0;                                             // 换一题 within this visit
const words = t => (t.match(/[A-Za-z]+(?:['’-][A-Za-z]+)*/g) || []).length;

function renderPractice(){
  if (!POOL.length) { practiceEl.innerHTML = `<p class="note">还没有标「会写」的条目。</p>`; return; }
  const day = dayNo(), week = Math.floor((day + 3) / 7);
  const daily = POOL[(day + skip) % POOL.length];
  const weekly = [0, 1, 2, 3, 4].map(k => POOL[(week * 5 + k) % POOL.length])
    .filter((t, i, a) => a.indexOf(t) === i);
  const dKey = "vk.draft.d." + day + "." + daily.it.anchor, wKey = "vk.draft.w." + week;
  const link = t => `<a class="xref" href="#${t.it.anchor}" data-ref="${t.it.anchor}">${t.it.title}</a>`;
  const dateStr = new Date().toLocaleDateString("zh-CN");
  practiceEl.innerHTML =
    `<p class="note">写完点「复制」,发到和 Claude 的对话里,按 ❌ / ⚠️ / ✅ 批改。草稿存在这个浏览器里。</p>` +
    `<div class="task"><h3>今日仿写</h3><p class="meta2">${dateStr} · 每天一题,从「会写」的条目里轮换</p>` +
    `<p class="ask">${daily.level === "GRAMMAR" ? "按 " + link(daily) + " 这条规则" : "用 " + link(daily) + " 里的表达"},写 3 句关于你自己工作或生活的<b>真实</b>句子。</p>` +
    `<textarea class="draft" id="pr-d" placeholder="1. …&#10;2. …&#10;3. …">${esc(store.get(dKey, ""))}</textarea>` +
    `<div class="foot2"><button class="linkish" type="button" id="pr-skip">换一题</button>` +
    `<button class="btn" type="button" id="pr-dc">复制去批改</button></div></div>` +
    `<div class="task"><h3>本周段落</h3><p class="meta2">每周一换 · 80–100 词</p>` +
    `<p class="ask">写一段 80–100 词的短文(工作近况、这周学到的东西都行),至少用上其中 3 个:</p>` +
    `<div class="chips">${weekly.map(t => `<button type="button" data-ref="${t.it.anchor}">${t.it.title}</button>`).join("")}</div>` +
    `<textarea class="draft" id="pr-w" style="min-height:150px" placeholder="…">${esc(store.get(wKey, ""))}</textarea>` +
    `<div class="foot2"><span class="wc" id="pr-wc"></span><button class="btn" type="button" id="pr-wcpy">复制去批改</button></div></div>`;
  const d = practiceEl.querySelector("#pr-d"), w = practiceEl.querySelector("#pr-w"), wc = practiceEl.querySelector("#pr-wc");
  const count = () => { const n = words(w.value); wc.textContent = n + " 词" + (n >= 80 && n <= 100 ? " ✓" : ""); };
  count();
  d.addEventListener("input", () => store.set(dKey, d.value));
  w.addEventListener("input", () => { store.set(wKey, w.value); count(); });
  practiceEl.querySelector("#pr-skip").addEventListener("click", () => { skip++; renderPractice(); });
  practiceEl.querySelector("#pr-dc").addEventListener("click", e => copyText(
    `【今日仿写 ${dateStr}】${daily.level === "GRAMMAR" ? "按" : "用"}「${daily.it.title}」写 3 句真实的句子,请按 ❌ / ⚠️ / ✅ 批改:\n\n${d.value.trim()}`, e.currentTarget));
  practiceEl.querySelector("#pr-wcpy").addEventListener("click", e => copyText(
    `【本周段落】目标表达:${weekly.map(t => t.it.title).join(" · ")}。请按 ❌ / ⚠️ / ✅ 批改,并说说段落衔接:\n\n${w.value.trim()}`, e.currentTarget));
  practiceEl.querySelectorAll(".xref, .chips [data-ref]").forEach(a => a.addEventListener("click", e => {
    e.preventDefault();
    const x = byAnchor[a.dataset.ref];
    if (x) open(x.it, x.level, x.i);
  }));
}

  if (listTog.parentNode !== home) home.append(listTog);
}
const togglePanel = k => { store.set(k, store.get(k, "0") === "1" ? "0" : "1"); paintPanels(); };
sideTog.addEventListener("click", () => togglePanel("vk.sideOff"));
listTog.addEventListener("click", () => togglePanel("vk.listOff"));
// the header's height, for the sticky sidebar and the docked entry
const topEl = document.querySelector(".top");
new ResizeObserver(() => document.documentElement.style.setProperty("--toph", topEl.offsetHeight + "px")).observe(topEl);
// keys: / searches; J / K walk the list with the entry docked
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey || document.body.classList.contains("running")) return;
  if (e.target.closest && e.target.closest("input, textarea, select, [contenteditable]")) return;
  if (e.key === "/") { e.preventDefault(); q.focus(); return; }
  if (deskMQ.matches && e.key === "[") { togglePanel("vk.sideOff"); return; }
  if (dockable() && e.key === "]") { togglePanel("vk.listOff"); return; }
  if (!dockable() || (e.key !== "j" && e.key !== "k")) return;
  const cards = visibleCards();
  if (!cards.length) return;
  const at = scrim ? cards.findIndex(c => c.dataset.anchor === scrim._entry.it.anchor) : -1;
  const c = cards[Math.max(0, Math.min(cards.length - 1, at + (e.key === "j" ? 1 : -1)))];
  if (at >= 0 && c === cards[at]) return;
  e.preventDefault();
  const t = byAnchor[c.dataset.anchor];
  open(t.it, t.level, t.i, listOf(c));
});

refreshStCounts();
refreshStages();
render();
syncNow();
</script>
