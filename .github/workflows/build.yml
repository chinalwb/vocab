name: Rebuild page

on:
  push:
    branches: [main]
    paths:
      - vocabulary.md
      - template.html
      - build.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-page
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate index.html
        run: python build.py

      - name: Commit if the page changed
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html unchanged — nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Rebuild page from vocabulary.md"
          git push
