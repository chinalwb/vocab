name: Build and deploy page

# Only main publishes. Day-to-day entries land on dev, which never triggers a
# build; merging the dev -> main pull request is what updates the live page.
on:
  push:
    branches: [main]
    paths:
      - vocabulary.md
      - readlist.md
      - template.html
      - build.py
      - users/**
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate the page
        run: python build.py

      # each users/<name>/ with a vocabulary.md is its own page at /vocab/<name>/
      - name: Generate the users' pages
        run: |
          for d in users/*/; do
            [ -f "$d/vocabulary.md" ] && python build.py --src "$d"
          done

      - name: Stage the site
        run: |
          mkdir -p _site
          cp index.html data.json meta.json _site/
          for d in users/*/; do
            [ -f "$d/index.html" ] || continue
            mkdir -p "_site/$(basename "$d")"
            cp "$d/index.html" "_site/$(basename "$d")/"
            # pictures the page uses (site.json "logo")
            find "$d" -maxdepth 1 \( -name '*.jpg' -o -name '*.png' -o -name '*.webp' \) -exec cp {} "_site/$(basename "$d")/" \;
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
