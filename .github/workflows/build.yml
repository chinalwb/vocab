name: Build and deploy page

# Only main publishes. Day-to-day entries land on dev, which never triggers a
# build; merging the dev -> main pull request is what updates the live page.
on:
  push:
    branches: [main]
    paths:
      - vocabulary.md
      - template.html
      - build.py
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate the page
        run: python build.py

      - name: Stage the site
        run: |
          mkdir -p _site
          cp index.html _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
