name: Build and release APK

# The APK isn't kept in git (53 versions of it made every clone 100 MB). main builds it here and
# publishes it, with version.json, as the latest GitHub Release — where the app's 检查 App 更新
# looks (update/AppUpdater.kt). Bump versionCode in android/app/build.gradle.kts for a new release;
# the same version again replaces that release's files.
on:
  push:
    branches: [main]
    paths:
      - android/**
      - .github/workflows/apk.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # build.py runs in every Gradle build, to bundle data.json into the APK
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: gradle/actions/setup-gradle@v4

      # The release key, from the repo's Actions secrets (the same key as the local
      # android/keystore.properties, so CI builds update the installed app in place).
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Signing secrets are missing (KEYSTORE_BASE64, STORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/keystore.properties

      - name: Build
        working-directory: android
        run: ./gradlew publishApk -PrequireReleaseKey

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name=$(jq -r .versionName android/apk/version.json)
          code=$(jq -r .versionCode android/apk/version.json)
          tag="app-v$name"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" android/apk/VoCab.apk android/apk/version.json --clobber
          else
            gh release create "$tag" android/apk/VoCab.apk android/apk/version.json \
              --title "VoCab $name" --notes "versionCode $code · built from ${GITHUB_SHA::7}" --latest
          fi
